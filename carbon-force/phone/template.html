<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; cards only for actionable groups. */
:root {
  --bg: #eef0f2; --surface: #ffffff; --sunk: #e3e6ea; --fg: #16191d; --muted: #5b636d; --line: #d3d8de;
  --accent: #2446a6; --accent-fg: #ffffff; --ok: #1d7a43; --warn: #9a5b00; --bad: #b3261e;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111316; --surface: #1b1e23; --sunk: #24282e; --fg: #e9ecef; --muted: #9aa3ad; --line: #30353c;
  --accent: #8aa6ff; --accent-fg: #0d1430; --ok: #5cc887; --warn: #f0a845; --bad: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1b1e23; --sunk: #24282e; --fg: #e9ecef; --muted: #9aa3ad; --line: #30353c;
  --accent: #8aa6ff; --accent-fg: #0d1430; --ok: #5cc887; --warn: #f0a845; --bad: #ff8a80; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line) }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase }
.brand small { display: block; font: 500 12px/1.3 var(--body); color: var(--muted); text-transform: none; letter-spacing: 0 }
.sync { font-size: 12px; color: var(--muted) }
h1 { font: 700 28px/1.1 var(--display); margin: 6px 0 0; text-wrap: balance; letter-spacing: .01em }
h2 { font: 700 19px/1.2 var(--display); margin: 0 0 8px; letter-spacing: .02em; text-transform: uppercase }
h3 { font-size: 15px; margin: 12px 0 4px }
p { margin: 0 0 8px }
.muted, .hint { color: var(--muted) } .hint { font-size: 13px; display: block; font-weight: 400; margin-top: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }
.card.warn { box-shadow: inset 4px 0 0 var(--warn) } .card.bad { box-shadow: inset 4px 0 0 var(--bad) } .card.ok { box-shadow: inset 4px 0 0 var(--ok) }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; flex-wrap: wrap; gap: 8px }
.row > * { flex: 1 1 140px; min-width: 0 }
ul.list { list-style: none; padding: 0; margin: 0 }
ul.list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
ul.list li:last-child { border-bottom: 0 }
ul.list .main { min-width: 0; flex: 1 }
ol.todo { margin: 0; padding-left: 22px } ol.todo li { margin: 6px 0 }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap }
.p-warn { color: var(--warn) } .p-ok { color: var(--ok) } .p-bad { color: var(--bad) } .p-mute { color: var(--muted) }
.p-solid { background: var(--ok); color: var(--surface); border-color: var(--ok) }
.big { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.nums div { background: var(--sunk); border-radius: 8px; padding: 10px }
.nums b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums }
.nums span { font-size: 13px; color: var(--muted) }
label { display: block; font-weight: 600; font-size: 14px }
input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 10px; font: 16px var(--body);
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px }
textarea { min-height: 120px; resize: vertical }
input[type=checkbox] { display: inline-block; width: 20px; height: 20px; margin: 0 8px 0 0; vertical-align: middle }
form.f { display: flex; flex-direction: column; gap: 10px }
button, .btn { font: 600 15px var(--body); border-radius: 8px; padding: 11px 14px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-fg); cursor: pointer; text-decoration: none; display: inline-block; text-align: center }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line) }
button.small { padding: 7px 10px; font-size: 14px }
button.danger { background: transparent; color: var(--bad); border-color: var(--bad) }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
a { color: var(--accent) }
a.rowlink { color: var(--fg); font-weight: 600; text-decoration: none }
.copy { position: relative; margin: 6px 0 4px }
.copy pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font: 15px/1.45 var(--body); background: var(--sunk);
  border-radius: 8px; padding: 12px 12px 48px }
.copy button { position: absolute; right: 8px; bottom: 8px }
details { border-top: 1px solid var(--line); padding: 8px 0 }
details:first-of-type { border-top: 0 }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; list-style-position: outside }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px }
.chips button { flex: 0 0 auto; padding: 6px 12px; font-size: 14px; background: var(--surface); color: var(--fg); border-color: var(--line); border-radius: 99px }
.chips button.on { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.tablewrap { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: transparent; border: 0; color: var(--muted); padding: 8px 2px; font-size: 12px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8 }
nav.tabs button.on { color: var(--accent) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: calc(100% - 32px); font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.2) }
.toast.err { background: var(--bad); color: #fff }
.back { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 600 }
.morelist button { width: 100%; text-align: left; background: var(--surface); color: var(--fg); border-color: var(--line); padding: 14px }
.empty { color: var(--muted); padding: 6px 0 }
.timer { font: 700 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em }
.timer.over { color: var(--warn) }
.stepname { font: 700 30px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--accent) }
button.huge { width: 100%; padding: 18px; font-size: 19px }
.confirm { background: var(--sunk); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<header class="top"><div class="brand">Carbon Force<small>Detailing command center</small></div><div class="sync" id="sync">Connecting…</div></header>
<main class="wrap" id="view"><div class="card"><h2>Loading your business data</h2><p class="muted">Your leads, bookings and posts load from your private Claude storage. If this stays here, reopen the link while signed in to Claude.</p></div></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="toastbox"></div>

<script type="application/json" id="d-posts">__POSTS__</script>
<script type="application/json" id="d-replies">__REPLIES__</script>
<script type="application/json" id="d-plan">__PLAN__</script>
<script>
(function () {
"use strict";
const J = (id) => JSON.parse(document.getElementById(id).textContent);
const POSTS = J("d-posts"), REPLIES = J("d-replies"), PLAN = J("d-plan");

// ---------------------------------------------------------------- fixed business facts
const BUSINESS = "Carbon Force Detailing";
const SERVICES = { interior: { label: "Interior detail", price: 80 }, exterior: { label: "Exterior cleaning", price: 60 }, full: { label: "Full interior + exterior package", price: 140 } };
const SERVICE_CHOICES = ["interior", "exterior", "full", "unsure"];
const svcLabel = (k) => SERVICES[k] ? `${SERVICES[k].label} ($${SERVICES[k].price})` : "Not sure yet";
const BANNED = ["mobile", "we come to you", "i come to you", "at your home", "at your location", "ceramic", "paint correction", "polish", "buffing", "extraction", "shampoo extract", "fully booked", "booked solid", "only 1 spot", "only one spot", "spots left", "limited spots", "certified", "insured", "#1", "best in"];
const STATUSES = ["New Lead", "Replied", "Quote Sent", "Follow-Up Due", "Booked", "Completed", "Lost"];
const SOURCES = ["facebook_page", "facebook_group", "facebook_marketplace", "instagram", "google_business_profile", "google_search", "flyer", "referral", "repeat_customer", "partner", "nextdoor", "walk_by_or_sign", "other"];
const METHODS = ["text", "call", "facebook_messenger", "instagram_dm", "email", "in_person", "other"];
const PAY = ["cash", "zelle", "venmo", "cash_app", "card", "other"];
const OPP_TYPES = ["facebook_group", "facebook_page", "google_business_profile", "local_search", "partnership", "directory", "referral_program", "community_event", "other"];
const OPP_STATUS = ["to_research", "researched", "join_requested", "joined", "contacted", "posted", "active_partner", "no_response", "declined", "not_a_fit"];
const RULES = { promo_allowed: "Business posts allowed (keep it neighborly)", promo_day_only: "Business posts only on the promo day/thread", recommendations_only: "No ads; answer recommendation requests only", no_business: "No business posts - just be a member", unknown: "Rules not checked yet - read them before posting" };
const SETTINGS = [
  ["booking_line", "How customers book", "Text or call 708-555-0000 to book", true],
  ["phone", "Business phone", "708-555-0000", true],
  ["area_line", "Public location wording (no street address)", "Melrose Park, near North Ave & 25th", true],
  ["hours_line", "Drop-off hours you actually keep", "Drop-off Mon-Sat, 8-10am", true],
  ["owner_first_name", "Your first name for messages", "", false],
  ["payment_methods", "Payment you accept", "Cash, Zelle", true],
  ["interior_includes", "What the $80 interior actually includes", "vacuum seats/carpet/trunk, wipe down dash, console, door panels, cup holders, inside glass", true],
  ["exterior_includes", "What the $60 exterior actually includes", "hand wash, wheels and tires, dry, outside glass", true],
  ["turnaround_line", "Honest turnaround wording", "Drop off in the morning, I text you when it's ready", true],
  ["private_address", "Exact drop-off address (only goes in booking confirmations)", "", false],
  ["review_link", "Review link once you have one", "", false],
  ["max_jobs_per_day", "Max cars you can do in one day", "2", true],
  ["launch_date", "Day 1 of your 7-day plan", "", false],
];
const POST_FIELDS = { facebook: "Facebook Page", instagram: "Instagram caption", story: "Story frames", reel_script: "Reel script (no voice, text on screen)", group_version: "Community-group version" };
const PUBLISH_STEPS = {
  "Facebook Page": ["Open your Facebook Page (not your personal profile).", "Create post, paste the Facebook text, add your real photo(s) or video.", "Read it once out loud and fix anything that doesn't sound like you.", "Post it, then come back and tap Mark published."],
  "Instagram": ["Instagram: + then Post, Reel or Story.", "Pick your real photo or clip. For Reels, add the on-screen text from the script.", "Paste the caption (3-5 hashtags max).", "Share, then tap Mark published."],
  "Community groups": ["Read the group rules again (they change).", "Only post if the group's rule type allows it today (see Prospecting).", "Paste the group version with one real photo.", "Don't post the same thing in lots of groups on the same day."],
};

// ---------------------------------------------------------------- helpers
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const plusDays = (n, start) => { const d = start ? parse(start) : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fdate = (s) => { if (!s) return "-"; const d = parse(s); return `${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const ftime = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const money = (x) => "$" + (Number(x) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nice = (s) => String(s || "").replace(/_/g, " ");
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
class VErr extends Error {}
const need = (cond, msg) => { if (!cond) throw new VErr(msg); };
const num = (v, label) => { v = String(v == null ? "" : v).replace(/[$,\s]/g, ""); if (!v) return null; const n = Math.round(Number(v) * 100) / 100; need(isFinite(n) && n >= 0 && n <= 10000, `${label} must be a number like 80 or 80.00.`); return n; };
const clean = (v, max = 500) => String(v == null ? "" : v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").trim().slice(0, max);
const opts = (vals, sel, labeler) => vals.map((v) => `<option value="${esc(v)}"${String(v) === String(sel ?? "") ? " selected" : ""}>${esc(labeler ? labeler(v) : nice(v) || "-")}</option>`).join("");

function toast(msg, err) {
  const box = document.getElementById("toastbox");
  box.innerHTML = `<div class="toast${err ? " err" : ""}" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { box.innerHTML = ""; }, err ? 5000 : 2500);
}

// ---------------------------------------------------------------- state + storage
const S = { leads: new Map(), slots: new Map(), appts: new Map(), jobs: new Map(), posts: new Map(), opps: new Map(), effort: new Map(), timings: new Map(), settings: {}, active: null, loaded: new Set() };
let db = null, readOnly = false;
const COLS = ["leads", "slots", "appts", "jobs", "posts", "opps", "effort", "timings"];

async function put(col, id, body) {
  if (!db) throw new VErr("Storage isn't connected. Reopen the link while signed in to Claude.");
  if (readOnly) throw new VErr("Only the owner can change this.");
  const data = JSON.parse(JSON.stringify(body)); delete data.id;
  await db.collection(col).doc(id).set(data);
  S[col].set(id, Object.assign({ id }, data)); // show it right away
}
const newId = (col) => db.collection(col).doc().id;
const all = (col) => Array.from(S[col].values());
const settings = () => S.settings || {};
const maxPerDay = () => Math.max(1, parseInt(settings().max_jobs_per_day, 10) || 2);

// ---------------------------------------------------------------- text filling + checks
function values(extra) {
  const v = Object.assign({}, settings(), { business: BUSINESS, price_interior: "$80", price_exterior: "$60", price_full: "$140" });
  v.price_interior = "$" + SERVICES.interior.price; v.price_exterior = "$" + SERVICES.exterior.price; v.price_full = "$" + SERVICES.full.price;
  return Object.assign(v, extra || {});
}
function fill(text, extra) {
  const v = values(extra);
  return String(text || "").replace(/\{(\w+)\}/g, (m, k) => (v[k] ? String(v[k]) : `[SET ${k.toUpperCase()} IN SETUP]`));
}
const negateMobile = (t) => String(t || "").toLowerCase().replace(/(not|no|isn't|aren't|don't do|can't do)\s+(a\s+)?mobile/g, "");
function banned(text) {
  const low = negateMobile(text);
  return BANNED.filter((p) => new RegExp("(^|[^a-z])" + p.replace(/[.*+?^${}()|[\]\\#]/g, "\\$&") + "(?![a-z])").test(low));
}
function postView(base) {
  const o = S.posts.get(base.id) || {};
  const p = Object.assign({}, base, { status: o.status || "draft", approved: o.approved || null, scheduled: o.scheduled || null, published: o.published || null, where: o.where || "", notes: o.notes || "" });
  for (const f in POST_FIELDS) if (o.edits && typeof o.edits[f] === "string") p[f] = o.edits[f];
  return p;
}
function postProblems(p) {
  const allow = String(p.allow_terms || "").split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const out = [];
  for (const f in POST_FIELDS) {
    if (!p[f]) continue;
    const t = fill(p[f]);
    const miss = Array.from(new Set((t.match(/\[SET (\w+) IN SETUP\]/g) || []).map((m) => m.slice(5, -9).toLowerCase())));
    if (miss.length) out.push(`${POST_FIELDS[f]}: fill in Setup first (${miss.join(", ")})`);
    if (t.includes("[TYPE")) out.push(`${POST_FIELDS[f]}: replace the [TYPE ...] parts with real details`);
    const c = banned(t).filter((x) => !allow.includes(x));
    if (c.length) out.push(`${POST_FIELDS[f]}: has a claim you haven't confirmed (${c.join(", ")})`);
  }
  return out;
}
function openSlots(daysAhead) {
  const t = today(), end = plusDays(daysAhead || 14);
  return all("slots").filter((s) => s.status === "open" && s.date >= t && s.date <= end).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function openTimesText() {
  const s = openSlots(14).slice(0, 5);
  return s.length ? s.map((x) => `- ${fdate(x.date)}, drop-off ${ftime(x.time)}`).join("\n") : "[NO OPEN SLOTS ENTERED - ADD REAL SLOTS ON THE BOOK TAB FIRST]";
}
function renderReply(id, lead, appt) {
  const t = REPLIES.find((r) => r.id === id);
  const extra = { open_times: openTimesText(), name: lead && lead.name ? lead.name.split(/\s+/)[0].replace(/[{}]/g, "") : "there" };
  const svc = (appt && appt.service) || (lead && lead.service);
  extra.service_label = SERVICES[svc] ? SERVICES[svc].label.toLowerCase() : "cleaning";
  if (appt) { const sl = S.slots.get(appt.slot) || {}; Object.assign(extra, { appt_date: fdate(sl.date), appt_time: ftime(sl.time), appt_service: SERVICES[appt.service].label, appt_price: "$" + appt.price }); }
  return fill(t.text, extra);
}

// ---------------------------------------------------------------- lead logic
const ev = (lead, type, note, d) => { lead.events = (lead.events || []).concat([{ d: d || today(), t: type, n: clean(note, 200) }]).slice(-80); };
function status(l) { // Follow-up due is shown from the date; nothing is written in the background
  if ((l.status === "Replied" || l.status === "Quote Sent") && l.next && l.next <= today()) return "Follow-Up Due";
  return l.status;
}
function leadFromForm(f, base) {
  const l = Object.assign({}, base || {});
  l.name = clean(f.name, 120); need(l.name, "Name or nickname is required.");
  l.method = METHODS.includes(f.method) ? f.method : "text";
  l.contact = clean(f.contact, 200); l.consent = f.consent === "on"; l.consentNote = clean(f.consentNote, 200);
  need(SOURCES.includes(f.source), "Pick where they found you.");
  l.source = f.source; l.sourceDetail = clean(f.sourceDetail, 200); l.vehicle = clean(f.vehicle, 120);
  l.service = SERVICE_CHOICES.includes(f.service) ? f.service : "unsure";
  l.quote = num(f.quote, "Quoted price"); l.notes = clean(f.notes, 2000);
  return l;
}
async function createLead(f) {
  const inquiry = isDate(f.inquiry) ? f.inquiry : today();
  need(inquiry <= today(), "Inquiry date can't be in the future.");
  const l = leadFromForm(f);
  Object.assign(l, { inquiry, status: "New Lead", next: inquiry, created: new Date().toISOString(), events: [] });
  ev(l, "inquiry", "via " + l.source, inquiry);
  const id = newId("leads"); await put("leads", id, l); return id;
}
async function leadAct(id, fn) { const l = JSON.parse(JSON.stringify(S.leads.get(id))); need(l, "That lead is gone."); fn(l); await put("leads", id, l); }

// ---------------------------------------------------------------- booking logic
async function addSlot(f) {
  need(isDate(f.date), "Pick a date."); need(f.date >= today(), "You can't open a slot in the past.");
  need(/^\d{2}:\d{2}$/.test(f.time || ""), "Pick a drop-off time.");
  if (f.pickup) need(f.pickup > f.time, "Pick-up has to be after drop-off.");
  need(!all("slots").some((s) => s.date === f.date && s.time === f.time && s.status !== "closed"), "You already have a slot at that time.");
  await put("slots", newId("slots"), { date: f.date, time: f.time, pickup: f.pickup || "", status: "open", note: clean(f.note, 200) });
}
async function propose(leadId, slotId, service, price) {
  const slot = S.slots.get(slotId); need(slot, "Pick one of your open slots.");
  need(slot.status === "open", "That slot is no longer open."); need(slot.date >= today(), "That slot is in the past.");
  need(SERVICES[service], "Pick a service.");
  const lead = S.leads.get(leadId);

const evCount = (t, a, b) => all("leads").reduce((n, l) => n + (l.events || []).filter((e) => e.t === t && e.d >= a && e.d <= b).length, 0);
function funnel(a, b) {
  const ls = all("leads").filter((l) => !a || (l.inquiry >= a && l.inquiry <= b));
  const c = (t) => ls.filter((l) => hasEv(l, t)).length;
  const f = { leads: ls.length, quoted: c("quote_sent"), booked: c("booked"), completed: c("completed"), lost: ls.filter((l) => l.status === "Lost").length };
  f.l2b = f.leads ? Math.round(100 * f.booked / f.leads) + "%" : "-"; f.q2b = f.quoted ? Math.round(100 * f.booked / f.quoted) + "%" : "-";

}
function channels(a, b) {

    r.inquiries++; if (hasEv(l, "booked")) r.booked++;
  }
  for (const j of all("jobs")) { const l = S.leads.get(j.lead); if (l && by[l.source]) by[l.source].money += (j.payments || []).reduce((s, p) => s + p.a, 0); }

}

  const ch = channels(a, b);
  const eff = {}; for (const e of all("effort")) if (e.date >= a && e.date <= b) { const r = eff[e.channel] || (eff[e.channel] = { actions: 0, minutes: 0 }); r.actions++; r.minutes += e.minutes; }
  const names = Array.from(new Set(Object.keys(eff).concat(ch.map((c) => c.source)))).sort();
  const effort = names.map((n) => { const e = eff[n] || { actions: 0, minutes: 0 }; const inq = (ch.find((c) => c.source === n) || {}).inquiries || 0; return { channel: n, actions: e.actions, minutes: e.minutes, inquiries: inq, perHour: e.minutes ? Math.round(inq / (e.minutes / 60) * 10) / 10 : null }; });
  const gaps = all("leads").filter((l) => l.inquiry >= a && l.inquiry <= b).map((l) => { const f = (l.events || []).find((e) => e.t === "reply_sent" || e.t === "quote_sent"); return f ? (parse(f.d) - parse(l.inquiry)) / 864e5 : null; }).filter((x) => x != null);
  const r = { a, b, posts, ch, effort, inquiries: ch.reduce((s, c) => s + c.inquiries, 0), replies: evCount("reply_sent", a, b), quotes: evCount("quote_sent", a, b), followups: evCount("followup_sent", a, b), booked: evCount("booked", a, b), cancelled: evCount("cancelled", a, b), noShows: evCount("no_show", a, b), jobs: all("jobs").filter((j) => j.date >= a && j.date <= b).length, revenue: collected(a, b), owed: owed(), speed: gaps.length ? Math.round(gaps.reduce((s, x) => s + x, 0) / gaps.length * 10) / 10 : null };

}
function tips(r) {
  const t = [];
  if (r.inquiries + r.posts.length + r.effort.reduce((s, e) => s + e.actions, 0) === 0) return ["Nothing was recorded this week, so there's nothing to judge yet. Log posts, leads and marketing time as they happen."];
  if (!r.posts.length) t.push("No posts were marked published. Approve 2-3 posts on Sunday and publish one every other day.");
  if (r.speed != null && r.speed >= 1) t.push(`Replies took ${r.speed} day(s) on average. Same-day replies win more jobs - check messages twice a day.`);
  const newOnes = all("leads").filter((l) => l.status === "New Lead").length; if (newOnes) t.push(`${newOnes} lead(s) still have no reply. Answer them first thing.`);
  if (r.quotes && !r.booked) t.push("Quotes went out but nobody booked. Send the quote follow-up with real open times.");
  for (const e of r.effort) if (e.minutes >= 60 && !e.inquiries) t.push(`${nice(e.channel)}: ${e.minutes} min, 0 inquiries. Cut that time in half next week (unless it's a slow-build channel like Google).`);
  const best = r.effort.filter((e) => e.perHour); if (best.length) { const top = best.sort((x, y) => y.perHour - x.perHour)[0]; t.push(`Best return on time: ${nice(top.channel)} (${top.perHour} inquiries/hour). Do a bit more of that.`); }
  if (r.jobs && !r.ch.some((c) => c.source === "referral")) t.push("You finished jobs this week - send the referral ask to happy customers.");
  if (r.inquiries && !r.effort.some((e) => e.minutes)) t.push("Leads came in but no time was logged, so the report can't tell which work paid off. Log minutes on the Plan screen.");

(function boot() {
  const h = (location.hash || "").slice(1);
  if (["today", "leads", "book", "work", "posts", "replies", "prospects", "plan", "weekly", "setup", "more"].includes(h)) view = h;
  render(true);
})();
(async function connect() {
  const sync = document.getElementById("sync");
  if (!window.claude || !window.claude.use) { sync.textContent = "Offline copy"; gate = `<div class="card bad"><h2>Open this from Claude</h2><p>This page saves your data in your Claude account, so it only works when opened from its claude.ai link while you're signed in.</p></div>`; return render(true); }
  const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl;
  if (u) { try { if (!(await u.isOwner())) { readOnly = true; gate = `<div class="card bad"><h2>Private business tool</h2><p>This page belongs to someone else, and its data is private.</p></div>`; sync.textContent = ""; return render(true); } } catch (_) {} }
  if (!d) { sync.textContent = "Not connected"; gate = `<div class="card bad"><h2>Storage isn't connected</h2><p>Reopen this page from its claude.ai link while signed in. Your data is safe - it just can't load in this view.</p></div>`; return render(true); }
  db = d; gate = "";
  const done = (name) => { S.loaded.add(name); sync.textContent = S.loaded.size >= COLS.length + 1 ? "Saved in your Claude account" : "Loading…"; render(); };
  const fail = (e) => { sync.textContent = "Connection lost - reload"; console.warn(e && e.code); };
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => { S[c] = new Map(snap.docs.map((x) => [x.id, Object.assign({ id: x.id }, x.data())])); done(c); }, fail));
  db.doc("config/activejob").onSnapshot((snap) => { S.active = snap.exists ? Object.assign({}, snap.data()) : null; render(); }, fail);
  db.doc("config/settings").onSnapshot((snap) => { S.settings = snap.exists ? Object.assign({}, snap.data()) : {}; done("settings"); }, fail);
})();
})();
</script>
