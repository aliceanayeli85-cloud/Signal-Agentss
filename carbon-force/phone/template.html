<style>

.jobhead { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 8px }
.stepcount { font: italic 700 18px/1 var(--display); color: var(--muted) } .stepcount b { font-size: 34px; color: var(--accent) }
.stepcard { display: flex; flex-direction: column; gap: 12px; border-top: 3px solid var(--accent) }
.why { color: var(--muted); margin: 0 }
.clock { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--sunk); border-radius: 10px; padding: 12px 14px }
.goal { text-align: right; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em } .goal b { font: italic 700 26px/1 var(--display); color: var(--fg); letter-spacing: 0 }
.small { font-size: 14px; margin: 0 }
.checks { display: flex; flex-direction: column; gap: 6px }

button.check .box { flex: 0 0 26px; height: 26px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-weight: 800; color: var(--accent-fg) }
button.check.on { color: var(--muted); text-decoration: line-through; border-color: var(--accent) } button.check.on .box { background: var(--accent); border-color: var(--accent) }
.donewhen, .dont { border-radius: 10px; padding: 10px 12px; font-weight: 600 }
.donewhen { background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent) }
.donewhen .eyebrow { color: var(--ok) }

.tools { display: flex; flex-wrap: wrap; gap: 6px } .tool { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line) }

ol.habits li::before { content: counter(h); grid-row: span 2; font: italic 800 30px/1 var(--display); color: var(--accent) }
ol.habits span { color: var(--muted); font-size: 14px }
ul.tight { margin: 6px 0; padding-left: 20px } ul.tight li { margin: 3px 0 }

button.huge { width: 100%; padding: 18px; font-size: 19px }
.confirm { background: var(--sunk); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

<main class="wrap" id="view"><div class="card"><h2>Loading your business data</h2><p class="muted">Your leads, bookings and posts load from your private Claude storage. If this stays here, reopen the link while signed in to Claude.</p></div></main>

<script>
(function () {
"use strict";
const J = (id) => JSON.parse(document.getElementById(id).textContent);
const POSTS = J("d-posts"), REPLIES = J("d-replies"), PLAN = J("d-plan");

// ---------------------------------------------------------------- fixed business facts
const BUSINESS = "Carbon Force Detailing";
const SERVICES = { interior: { label: "Interior detail", price: 80 }, exterior: { label: "Exterior cleaning", price: 60 }, full: { label: "Full interior + exterior package", price: 140 } };
const SERVICE_CHOICES = ["interior", "exterior", "full", "unsure"];
const svcLabel = (k) => SERVICES[k] ? `${SERVICES[k].label} ($${SERVICES[k].price})` : "Not sure yet";
const BANNED = ["mobile", "we come to you", "i come to you", "at your home", "at your location", "ceramic coating", "paint correction", "polish", "buffing", "extraction", "shampoo extract", "fully booked", "booked solid", "only 1 spot", "only one spot", "spots left", "limited spots", "certified", "insured", "#1", "best in"];
const STATUSES = ["New Lead", "Replied", "Quote Sent", "Follow-Up Due", "Booked", "Completed", "Lost"];
const SOURCES = ["facebook_page", "facebook_group", "facebook_marketplace", "instagram", "google_business_profile", "google_search", "flyer", "referral", "repeat_customer", "partner", "nextdoor", "walk_by_or_sign", "other"];
const METHODS = ["text", "call", "facebook_messenger", "instagram_dm", "email", "in_person", "other"];
const PAY = ["cash", "zelle", "venmo", "cash_app", "card", "other"];
const OPP_TYPES = ["facebook_group", "facebook_page", "google_business_profile", "local_search", "partnership", "directory", "referral_program", "community_event", "other"];
const OPP_STATUS = ["to_research", "researched", "join_requested", "joined", "contacted", "posted", "active_partner", "no_response", "declined", "not_a_fit"];
const RULES = { promo_allowed: "Business posts allowed (keep it neighborly)", promo_day_only: "Business posts only on the promo day/thread", recommendations_only: "No ads; answer recommendation requests only", no_business: "No business posts - just be a member", unknown: "Rules not checked yet - read them before posting" };
const SETTINGS = [
  ["booking_line", "How customers book", "Text or call 708-555-0000 to book", true],
  ["phone", "Business phone", "708-555-0000", true],
  ["area_line", "Public location wording (no street address)", "Melrose Park, near North Ave & 25th", true],
  ["hours_line", "Drop-off hours you actually keep", "Drop-off Mon-Sat, 8-10am", true],
  ["owner_first_name", "Your first name for messages", "", false],
  ["payment_methods", "Payment you accept", "Cash, Zelle", true],
  ["interior_includes", "What the $80 interior actually includes", "vacuum seats/carpet/trunk, wipe down dash, console, door panels, cup holders, inside glass", true],
  ["exterior_includes", "What the $60 exterior actually includes", "hand wash, wheels and tires, dry, outside glass", true],
  ["turnaround_line", "Honest turnaround wording", "Drop off in the morning, I text you when it's ready", true],
  ["private_address", "Exact drop-off address (only goes in booking confirmations)", "", false],
  ["review_link", "Review link once you have one", "", false],
  ["max_jobs_per_day", "Max cars you can do in one day", "2", true],
  ["product_cost", "Product cost per car ($)", "30", false],
  ["launch_date", "Day 1 of your 7-day plan", "", false],
];
const POST_FIELDS = { facebook: "Facebook Page", instagram: "Instagram caption", story: "Story frames", reel_script: "Reel script (no voice, text on screen)", group_version: "Community-group version" };
const PUBLISH_STEPS = {
  "Facebook Page": ["Open your Facebook Page (not your personal profile).", "Create post, paste the Facebook text, add your real photo(s) or video.", "Read it once out loud and fix anything that doesn't sound like you.", "Post it, then come back and tap Mark published."],
  "Instagram": ["Instagram: + then Post, Reel or Story.", "Pick your real photo or clip. For Reels, add the on-screen text from the script.", "Paste the caption (3-5 hashtags max).", "Share, then tap Mark published."],
  "Community groups": ["Read the group rules again (they change).", "Only post if the group's rule type allows it today (see Prospecting).", "Paste the group version with one real photo.", "Don't post the same thing in lots of groups on the same day."],
};

// ---------------------------------------------------------------- helpers
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const plusDays = (n, start) => { const d = start ? parse(start) : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fdate = (s) => { if (!s) return "-"; const d = parse(s); return `${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const ftime = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const money = (x) => "$" + (Number(x) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nice = (s) => String(s || "").replace(/_/g, " ");
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
class VErr extends Error {}
const need = (cond, msg) => { if (!cond) throw new VErr(msg); };
const num = (v, label) => { v = String(v == null ? "" : v).replace(/[$,\s]/g, ""); if (!v) return null; const n = Math.round(Number(v) * 100) / 100; need(isFinite(n) && n >= 0 && n <= 10000, `${label} must be a number like 80 or 80.00.`); return n; };
const clean = (v, max = 500) => String(v == null ? "" : v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").trim().slice(0, max);
const opts = (vals, sel, labeler) => vals.map((v) => `<option value="${esc(v)}"${String(v) === String(sel ?? "") ? " selected" : ""}>${esc(labeler ? labeler(v) : nice(v) || "-")}</option>`).join("");

function toast(msg, err) {
  const box = document.getElementById("toastbox");
  box.innerHTML = `<div class="toast${err ? " err" : ""}" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { box.innerHTML = ""; }, err ? 5000 : 2500);
}

// ---------------------------------------------------------------- state + storage
const S = { leads: new Map(), slots: new Map(), appts: new Map(), jobs: new Map(), posts: new Map(), opps: new Map(), effort: new Map(), timings: new Map(), briefs: new Map(), settings: {}, active: null, loaded: new Set() };
let db = null, readOnly = false;
const COLS = ["leads", "slots", "appts", "jobs", "posts", "opps", "effort", "timings", "briefs"];

async function put(col, id, body) {
  if (!db) throw new VErr("Storage isn't connected. Reopen the link while signed in to Claude.");
  if (readOnly) throw new VErr("Only the owner can change this.");
  const data = JSON.parse(JSON.stringify(body)); delete data.id;
  await db.collection(col).doc(id).set(data);
  S[col].set(id, Object.assign({ id }, data)); // show it right away
}
const newId = (col) => db.collection(col).doc().id;
const all = (col) => Array.from(S[col].values());
const settings = () => S.settings || {};
const maxPerDay = () => Math.max(1, parseInt(settings().max_jobs_per_day, 10) || 2);

// ---------------------------------------------------------------- text filling + checks
function values(extra) {
  const v = Object.assign({}, settings(), { business: BUSINESS, price_interior: "$80", price_exterior: "$60", price_full: "$140" });
  v.price_interior = "$" + SERVICES.interior.price; v.price_exterior = "$" + SERVICES.exterior.price; v.price_full = "$" + SERVICES.full.price;
  return Object.assign(v, extra || {});
}
function fill(text, extra) {
  const v = values(extra);
  return String(text || "").replace(/\{(\w+)\}/g, (m, k) => (v[k] ? String(v[k]) : `[SET ${k.toUpperCase()} IN SETUP]`));
}
const negateMobile = (t) => String(t || "").toLowerCase().replace(/(not|no|isn't|aren't|don't do|can't do)\s+(a\s+)?mobile/g, "");
function banned(text) {
  const low = negateMobile(text);
  return BANNED.filter((p) => new RegExp("(^|[^a-z])" + p.replace(/[.*+?^${}()|[\]\\#]/g, "\\$&") + "(?![a-z])").test(low));
}
function postView(base) {
  const o = S.posts.get(base.id) || {};
  const p = Object.assign({}, base, { status: o.status || "draft", approved: o.approved || null, scheduled: o.scheduled || null, published: o.published || null, where: o.where || "", notes: o.notes || "" });
  for (const f in POST_FIELDS) if (o.edits && typeof o.edits[f] === "string") p[f] = o.edits[f];
  return p;
}
function postProblems(p) {
  const allow = String(p.allow_terms || "").split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const out = [];
  for (const f in POST_FIELDS) {
    if (!p[f]) continue;
    const t = fill(p[f]);
    const miss = Array.from(new Set((t.match(/\[SET (\w+) IN SETUP\]/g) || []).map((m) => m.slice(5, -9).toLowerCase())));
    if (miss.length) out.push(`${POST_FIELDS[f]}: fill in Setup first (${miss.join(", ")})`);
    if (t.includes("[TYPE")) out.push(`${POST_FIELDS[f]}: replace the [TYPE ...] parts with real details`);
    const c = banned(t).filter((x) => !allow.includes(x));
    if (c.length) out.push(`${POST_FIELDS[f]}: has a claim you haven't confirmed (${c.join(", ")})`);
  }
  return out;
}
function openSlots(daysAhead) {
  const t = today(), end = plusDays(daysAhead || 14);
  return all("slots").filter((s) => s.status === "open" && s.date >= t && s.date <= end).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function openTimesText() {
  const s = openSlots(14).slice(0, 5);
  return s.length ? s.map((x) => `- ${fdate(x.date)}, drop-off ${ftime(x.time)}`).join("\n") : "[NO OPEN SLOTS ENTERED - ADD REAL SLOTS ON THE BOOK TAB FIRST]";
}
function renderReply(id, lead, appt) {
  const t = REPLIES.find((r) => r.id === id);
  const extra = { open_times: openTimesText(), name: lead && lead.name ? lead.name.split(/\s+/)[0].replace(/[{}]/g, "") : "there" };
  const svc = (appt && appt.service) || (lead && lead.service);

const payments = () => all("jobs").flatMap((j) => (j.payments || []).map((p) => Object.assign({ job: j.id }, p)));
const collected = (a, b) => payments().filter((p) => !a || (p.d >= a && p.d <= b)).reduce((s, p) => s + p.a, 0);
const owed = () => all("jobs").filter((j) => j.status !== "paid").reduce((s, j) => s + (j.price - j.paid), 0);
const hasEv = (l, t) => (l.events || []).some((e) => e.t === t);
const evCount = (t, a, b) => all("leads").reduce((n, l) => n + (l.events || []).filter((e) => e.t === t && e.d >= a && e.d <= b).length, 0);
function funnel(a, b) {
  const ls = all("leads").filter((l) => !a || (l.inquiry >= a && l.inquiry <= b));
  const c = (t) => ls.filter((l) => hasEv(l, t)).length;
  const f = { leads: ls.length, quoted: c("quote_sent"), booked: c("booked"), completed: c("completed"), lost: ls.filter((l) => l.status === "Lost").length };
  f.l2b = f.leads ? Math.round(100 * f.booked / f.leads) + "%" : "-"; f.q2b = f.quoted ? Math.round(100 * f.booked / f.quoted) + "%" : "-";
  return f;
}
function channels(a, b) {
  const by = {};
  for (const l of all("leads")) {
    if (a && !(l.inquiry >= a && l.inquiry <= b)) continue;
    const r = by[l.source] || (by[l.source] = { source: l.source, inquiries: 0, booked: 0, money: 0 });
    r.inquiries++; if (hasEv(l, "booked")) r.booked++;
  }
  for (const j of all("jobs")) { const l = S.leads.get(j.lead); if (l && by[l.source]) by[l.source].money += (j.payments || []).reduce((s, p) => s + p.a, 0); }

}

  const ch = channels(a, b);
  const eff = {}; for (const e of all("effort")) if (e.date >= a && e.date <= b) { const r = eff[e.channel] || (eff[e.channel] = { actions: 0, minutes: 0 }); r.actions++; r.minutes += e.minutes; }
  const names = Array.from(new Set(Object.keys(eff).concat(ch.map((c) => c.source)))).sort();

  const gaps = all("leads").filter((l) => l.inquiry >= a && l.inquiry <= b).map((l) => { const f = (l.events || []).find((e) => e.t === "reply_sent" || e.t === "quote_sent"); return f ? (parse(f.d) - parse(l.inquiry)) / 864e5 : null; }).filter((x) => x != null);
  const r = { a, b, posts, ch, effort, inquiries: ch.reduce((s, c) => s + c.inquiries, 0), replies: evCount("reply_sent", a, b), quotes: evCount("quote_sent", a, b), followups: evCount("followup_sent", a, b), booked: evCount("booked", a, b), cancelled: evCount("cancelled", a, b), noShows: evCount("no_show", a, b), jobs: all("jobs").filter((j) => j.date >= a && j.date <= b).length, revenue: collected(a, b), owed: owed(), speed: gaps.length ? Math.round(gaps.reduce((s, x) => s + x, 0) / gaps.length * 10) / 10 : null };

function tips(r) {
  const t = [];
  if (r.inquiries + r.posts.length + r.effort.reduce((s, e) => s + e.actions, 0) === 0) return ["Nothing was recorded this week, so there's nothing to judge yet. Log posts, leads and marketing time as they happen."];
  if (!r.posts.length) t.push("No posts were marked published. Approve 2-3 posts on Sunday and publish one every other day.");
  if (r.speed != null && r.speed >= 1) t.push(`Replies took ${r.speed} day(s) on average. Same-day replies win more jobs - check messages twice a day.`);
  const newOnes = all("leads").filter((l) => l.status === "New Lead").length; if (newOnes) t.push(`${newOnes} lead(s) still have no reply. Answer them first thing.`);
  if (r.quotes && !r.booked) t.push("Quotes went out but nobody booked. Send the quote follow-up with real open times.");
  for (const e of r.effort) if (e.minutes >= 60 && !e.inquiries) t.push(`${nice(e.channel)}: ${e.minutes} min, 0 inquiries. Cut that time in half next week (unless it's a slow-build channel like Google).`);
  const best = r.effort.filter((e) => e.perHour); if (best.length) { const top = best.sort((x, y) => y.perHour - x.perHour)[0]; t.push(`Best return on time: ${nice(top.channel)} (${top.perHour} inquiries/hour). Do a bit more of that.`); }
  if (r.jobs && !r.ch.some((c) => c.source === "referral")) t.push("You finished jobs this week - send the referral ask to happy customers.");

function vLead(id) {
  const l = S.leads.get(id); if (!l) return `<button class="back" ${go("leads")}>‹ Leads</button>${empty("That lead isn't here.")}`;

  const replies = ["price", "location", "come_to_me", "full_package", "availability", "pet_or_stain", "quote_followup", "no_reply_1", "no_reply_2", "review_request", "referral_ask", "repeat_offer"];
  const appts = all("appts").filter((a) => a.lead === id).sort((a, b) => (b.created || "").localeCompare(a.created || ""));
  const jobs = all("jobs").filter((j) => j.lead === id);
  const slots = openSlots(21);
  const apptHtml = appts.map((a) => {
    const s = S.slots.get(a.slot) || {}; let acts = "";
    if (a.status === "proposed") acts = `<div class="btns"><button class="small" data-act="confirm" data-id="${a.id}">They said yes - confirm</button><button class="small ghost" data-act="release" data-id="${a.id}">Release slot</button></div>`;
    if (a.status === "confirmed") acts = `<div class="btns"><button class="small ghost" data-act="reminder" data-id="${a.id}">${a.reminder ? "Reminder sent ✓" : "Reminder sent"}</button><button class="small danger" data-ask="cancel-${a.id}">Cancelled</button><button class="small danger" data-ask="noshow-${a.id}">No-show</button></div>
<div class="confirm" data-confirm="cancel-${a.id}" hidden><form class="f" data-form="cancel" data-id="${a.id}">${field("Reason (optional)", "reason", "")}<div class="btns"><button type="submit" class="small danger">Yes, cancel it</button><button type="button" class="small ghost" data-ask="">Keep it</button></div></form></div>
<div class="confirm" data-confirm="noshow-${a.id}" hidden><p>Mark as a no-show?</p><div class="btns"><button class="small danger" data-act="noshow" data-id="${a.id}">Yes, no-show</button><button type="button" class="small ghost" data-ask="">Keep it</button></div></div>
<details data-key="done-${a.id}"><summary>Job done - record it</summary><form class="f" data-form="complete" data-id="${a.id}"><div class="row">${sel("Service done", "service", Object.keys(SERVICES), a.service, svcLabel)}${field("Price charged", "price", a.price, "text", "", 'inputmode="decimal"')}</div><div class="row">${field("Amount paid now", "paid", a.price, "text", "0 if not paid yet", 'inputmode="decimal"')}${sel("Paid with", "method", [""].concat(PAY), "")}</div>${field("Completed date", "date", today(), "date")}${field("Notes", "notes", "")}<button type="submit">Mark completed</button></form></details>`;
    const msgs = a.status === "proposed" || a.status === "confirmed" ? `<details data-key="msgs-${a.id}"><summary>Messages for this appointment</summary>${["booking_confirmation", "reminder", "ready_pickup", "reschedule"].map((r) => `<h3>${esc(REPLIES.find((x) => x.id === r).title)}</h3>${copyBox(renderReply(r, l, a))}`).join("")}</details>` : "";
    return `<div class="card"><h2>${esc(fdate(s.date))} ${esc(ftime(s.time))}</h2><p>${esc(SERVICES[a.service].label)} · ${money(a.price)} ${pill(a.status)}</p>${acts}${msgs}</div>`;
  }).join("");
  const after = jobs.length ? `<div class="card"><h2>After the job</h2>${jobs.map((j) => `<p>${esc(fdate(j.date))}: ${esc(SERVICES[j.service].label)} · charged ${money(j.price)}, paid ${money(j.paid)} ${pill(j.status)}</p>${j.status !== "paid" ? `<form class="f" data-form="pay" data-id="${j.id}"><div class="row">${field("Payment received", "amount", j.price - j.paid, "text", "", 'inputmode="decimal"')}${sel("Method", "method", PAY, "cash")}</div><button type="submit" class="small">Record payment</button></form>` : ""}`).join("")}
<div class="btns">${l.reviewReq ? `<span class="hint">Review asked ${esc(fdate(l.reviewReq))}</span>` : `<button class="small" data-act="reviewreq" data-id="${id}">Review request sent</button>`}${l.reviewGot ? `<span class="hint">Review received ✓</span>` : `<button class="small ghost" data-act="reviewgot" data-id="${id}">They left a review</button>`}<button class="small ghost" data-act="repeat" data-id="${id}">Repeat offer sent</button></div><p class="hint">Next repeat reminder: ${esc(fdate(l.repeat))}</p></div>` : "";
  return `<button class="back" ${go("leads")}>‹ Leads</button><h1>${esc(l.name)}</h1>
<p>${pill(status(l))} <span class="muted">asked ${esc(fdate(l.inquiry))} via ${esc(nice(l.source))}${l.sourceDetail ? " (" + esc(l.sourceDetail) + ")" : ""} · ${esc(nice(l.method))}: ${esc(l.contact || "-")} · consent: ${l.consent ? "yes" : "not recorded"} · next follow-up: <b>${esc(fdate(l.next))}</b></span></p>
<div class="card"><h2>1 · Reply</h2><p class="hint">Copy, paste into your messages app, send it yourself. Then record it below.</p>${replies.map((r) => { const t = REPLIES.find((x) => x.id === r); return `<details data-key="r-${r}"><summary>${esc(t.title)}</summary><span class="hint">${esc(t.when)}</span>${copyBox(renderReply(r, l))}<span class="hint">Then: ${esc(t.next_step)}</span></details>`; }).join("")}</div>
<div class="card"><h2>2 · Record what you did</h2><div class="btns"><button class="small" data-act="replied" data-id="${id}">I replied</button><button class="small ghost" data-act="followup" data-id="${id}" data-v="4">I sent a follow-up</button><button class="small ghost" data-act="followup" data-id="${id}" data-v="0">Final follow-up sent</button></div>

<h3>Offer a drop-off time</h3>${slots.length ? `<form class="f" data-form="offer" data-id="${id}">${sel("Your open slot", "slot", slots.map((s) => s.id), slots[0].id, (sid) => { const s = S.slots.get(sid); return `${fdate(s.date)} - ${ftime(s.time)}`; })}<div class="row">${sel("Service", "service", Object.keys(SERVICES), svcDefault, svcLabel)}${field("Price (blank = quote)", "price", "", "text", "", 'inputmode="decimal"')}</div><button type="submit" class="small">Hold this slot for them</button><span class="hint">Holding doesn't book it. Confirm only after they say yes.</span></form>` : `<p class="muted">No open slots. <a href="#" ${go("book")}>Add your real available times</a> first.</p>`}</div>
${apptHtml}${after}
<div class="card"><details data-key="edit-${id}"><summary>Edit lead</summary><form class="f" data-form="editlead" data-id="${id}">${leadFields(l)}<div class="row">${sel("Status", "status", STATUSES, l.status)}${field("Next follow-up", "next", l.next || "", "date")}</div><div class="row">${field("Repeat reminder date", "repeat", l.repeat || "", "date")}${field("Lost reason", "lostReason", l.lostReason)}</div><button type="submit">Save changes</button></form></details></div>
<div class="card"><h2>History</h2>${list((l.events || []).slice().reverse().map((e) => `<li><div class="main">${esc(fdate(e.d))} · ${esc(nice(e.t))} <span class="hint">${esc(e.n)}</span></div></li>`), "")}</div>`;
}

  const live = all("appts").filter((a) => a.status === "proposed" || a.status === "confirmed").sort((x, y) => ((S.slots.get(x.slot) || {}).date || "").localeCompare((S.slots.get(y.slot) || {}).date || ""));

  return `<h1>Booking</h1><div class="card warn"><p><b>Drop-off only, at times you approved.</b> Add the times you can really take a car. On a lead, hold one and send it. Confirm when they say yes. Max ${maxPerDay()} car(s) a day (change in Setup).</p></div>

function vPost(id) {
  const base = POSTS.find((p) => p.id === id); if (!base) return `<button class="back" ${go("posts")}>‹ Posts</button>${empty("Not found.")}`;

  let acts = "";
  if (p.status === "draft") acts = `<form class="f" data-form="approve" data-id="${id}">${p.needs_real_photos ? `<label><input type="checkbox" name="photos" id="f-photos">I have my own real photos/video for this</label>` : ""}<button type="submit">Approve</button></form>`;
  else if (p.status === "published") acts = `<p>Published ${esc(fdate(p.published))} · ${esc(p.where)}</p>`;
  else acts = `<form class="f" data-form="publish" data-id="${id}">${field("Where you posted it", "where", "", "text", "e.g. facebook page, instagram, a group name", "required")}${field("Date posted", "date", today(), "date")}<button type="submit">Mark published (I posted it)</button></form>
<form class="f" data-form="schedule" data-id="${id}">${field("Plan to post on", "date", p.scheduled || today(), "date")}<button type="submit" class="ghost small">Schedule (just a reminder)</button></form><button class="ghost small" data-act="todraft" data-id="${id}">Back to draft</button>`;
  return `<button class="back" ${go("posts")}>‹ Posts</button><h1>${esc(p.title)}</h1><p>${pill(p.status)} <span class="muted">Day ${p.day} · ${esc(p.platform)} · ${esc(p.format)}</span></p>

${p.status === "draft" && probs.length ? `<div class="card warn"><h2>Before you can approve</h2><ul>${probs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}

setInterval(() => { // refresh only the clock, so nothing else gets redrawn
  const el = document.getElementById("worktimer"), a = S.active;
  if (!el || !a || !a.service) return;
  const now = Date.now(), sec = stepElapsed(a, now);
  el.textContent = fmt(sec); el.classList.toggle("over", sec > Number(el.dataset.goal));
  const tot = document.getElementById("worktotal"); if (tot) tot.textContent = fmt(((a.pausedAt || now) - a.jobStart) / 1000);
}, 1000);

// ---------------------------------------------------------------- marketing agent
// The weekly brief is written by a scheduled Claude research run into the "briefs" collection.
// The assistant below drafts on demand; you still review and post everything yourself.
const ASK_CHIPS = [
  ["Nextdoor post for this week", "Write one Nextdoor Business Page post for this week. Pick an angle that fits the season and isn't one I've already used. Under 90 words."],
  ["Reply to a message", "A customer sent me this message. Write my reply (short, friendly, drop-off only, real prices, never promise a time I haven't opened):\n\n[paste their message here]"],
  ["Ideas to get clients this week", "Give me 5 specific things I can do this week to get paying clients in Melrose Park using only Nextdoor, flyers and in-person visits. Rank them by how likely they are to bring a booking. One line each."],
  ["Before/after caption", "Write a short Nextdoor caption for a real before/after photo. Details of the job: [type what the car was like]"],
  ["Help me price a dirty car", "A customer described their car like this: [paste]. Should I quote my standard price or more? Give me a short honest reply I can send asking for photos first."],
];
function agentContext() {
  const st = settings(), f = funnel(), ch = channels();
  const brief = latestBrief();
  const usedTitles = POSTS.map(postView).filter((p) => p.status === "published").map((p) => p.title);
  return [
    `You are the marketing assistant for ${BUSINESS}, a one-person, garage-based car detailing business in Melrose Park, IL. Customers DROP OFF their car; it is NOT mobile.`,
    `Services and prices (the only ones offered): Interior $80 (${st.interior_includes || "see owner"}); Exterior $60 (${st.exterior_includes || "see owner"}); Full interior + exterior $140. Prices may be quoted higher for very dirty cars only after seeing photos.`,
    `Booking: ${st.booking_line || "call or text"}. Hours: ${st.hours_line || "ask"}. Payment: ${st.payment_methods || "ask"}. Turnaround: ${st.turnaround_line || "same day"}.`,
    "Marketing channel: a free Nextdoor Business Page (no personal-profile promotion, no paid ads or Opportunity Alerts), flyers on community boards, in-person visits to local businesses. No Facebook profile.",
    "Add-ons offered (price on request): pet hair removal, odor bomb treatment, headliner cleaning, engine bay cleaning, spray ceramic sealant, salt removal, wax & sealant protection, wheel & tire deep clean. Hard rules: never claim mobile service (coming later, once the owner's vehicle is repaired), a full ceramic coating or paint correction (owner is still training), polishing, paint correction, extraction, being insured/certified/#1, being fully booked or having limited spots. Never invent reviews, testimonials, customer stories or results. Write like a real local owner: plain, specific, a little funny sometimes, no hashtags on Nextdoor, at most one emoji. Use [brackets] for any detail the owner must fill in with something true.",
    `Real numbers so far: ${f.leads} leads, ${f.booked} booked, ${f.completed} completed, ${money(collected())} collected. Leads by channel: ${ch.map((c) => `${nice(c.source)} ${c.inquiries}`).join(", ") || "none yet"}.`,
    usedTitles.length ? `Posts already published: ${usedTitles.join("; ")}.` : "No posts marked published yet.",
    brief ? `This week's research brief: ${brief.summary}` : "",
    "Answer in plain text the owner can copy. Keep it short.",
  ].filter(Boolean).join("\n");
}
const latestBrief = () => all("briefs").sort((a, b) => (b.week || "").localeCompare(a.week || ""))[0] || null;
let sampleFn = null, askBusy = false, askAnswer = "", askErr = "", askCtl = null;
function vAgent() {
  const b = latestBrief();
  const briefHtml = b ? `<div class="card ok"><h2>This week's brief · ${esc(fdate(b.week))}</h2><p>${esc(b.summary)}</p>
<h3>Do this week</h3><ol class="todo">${(b.actions || []).map((a) => `<li>${esc(a)}</li>`).join("")}</ol></div>
<div class="card"><h2>Posts ready for Nextdoor</h2><p class="hint">Post from your Business Page. Fill in any [brackets] with something true first.</p>${(b.posts || []).map((p) => { const c = banned(negateMobile(p.text)); return `<h3>${esc(p.when ? p.when + ": " : "")}${esc(p.title)}</h3>${p.photo ? `<span class="hint">Photo: ${esc(p.photo)}</span>` : ""}${copyBox(p.text)}${c.length ? `<p class="p-bad">Check before posting: mentions ${esc(c.join(", "))}</p>` : ""}`; }).join("")}</div>
<div class="card"><details data-key="research"><summary>What the research found</summary>${list((b.research || []).map((r) => `<li><div class="main"><b>${esc(r.title)}</b><span class="hint">${esc(r.detail)}${r.source ? " · " + esc(r.source) : ""}</span></div></li>`), "")}</details></div>`
    : `<div class="card"><h2>Weekly brief</h2>${empty("Your first brief arrives with the next weekly research run.")}</div>`;
  const older = all("briefs").sort((x, y) => (y.week || "").localeCompare(x.week || "")).slice(1, 6);
  return `<button class="back" ${go("more")}>‹ More</button><h1>Marketing agent</h1>
<p class="muted">Every Monday morning Claude researches your area (season, weather, local prices, what's working in your numbers) and leaves a brief here with posts ready to copy. It never posts or messages anyone for you.</p>
${briefHtml}
<div class="card"><h2>Ask Claude</h2>${sampleFn ? `<div class="chips">${ASK_CHIPS.map((c, i) => `<button data-act="askchip" data-v="${i}">${esc(c[0])}</button>`).join("")}</div>
<form class="f" data-form="ask"><label>What do you need?<textarea name="q" id="f-askq" placeholder="e.g. Write a Nextdoor post about salt season">${esc(askDraft)}</textarea></label>
<div class="btns"><button type="submit" ${askBusy ? "disabled" : ""}>${askBusy ? "Writing…" : "Ask"}</button>${askBusy ? `<button type="button" class="ghost" data-act="askstop">Stop</button>` : ""}</div></form>
${askErr ? `<p class="p-bad">${esc(askErr)}</p>` : ""}${askAnswer ? `<h3>Answer</h3><div id="askout">${copyBox(askAnswer)}</div>${banned(negateMobile(askAnswer)).length ? `<p class="p-bad">Check before using: mentions ${esc(banned(negateMobile(askAnswer)).join(", "))}</p>` : ""}<p class="hint">Read it, fix anything that isn't true, then post or send it yourself.</p>` : `<div id="askout"></div>`}`
    : empty("The assistant isn't available in this view. Open the page from its claude.ai link while signed in.")}</div>
${older.length ? `<div class="card"><h2>Past briefs</h2>${list(older.map((x) => `<li><div class="main">${esc(fdate(x.week))}<span class="hint">${esc(x.summary)}</span></div></li>`), "")}</div>` : ""}`;
}
let askDraft = "";
async function ask(q) {
  q = clean(q, 4000); need(q, "Type what you need first.");
  need(sampleFn, "The assistant isn't available in this view.");
  askDraft = q; askBusy = true; askErr = ""; askAnswer = ""; render(true);
  askCtl = new AbortController();
  try {
    const r = await sampleFn([{ role: "user", content: agentContext() + "\n\nOWNER'S REQUEST:\n" + q }], {
      cache: false, signal: askCtl.signal, modelTier: "default",
      onText: ({ text }) => { askAnswer = text; const out = document.getElementById("askout"); if (out) out.innerHTML = copyBox(text); },
    });
    askAnswer = r.text;
  } catch (e) {
    if (e && e.text) askAnswer = e.text;
    askErr = !e || e.code === "cancelled" ? "" : e.code === "not_granted" ? "You declined the assistant for this page. You can allow it from the page's Permissions menu." : e.code === "rate_limited" ? "Too many requests right now. Try again in a few minutes." : "Couldn't get an answer. Try again.";
  } finally { askBusy = false; askCtl = null; render(true); }
}

// ---------------------------------------------------------------- render loop
let pendingRender = false;
function render(force) {
  const root = document.getElementById("view");
  const a = document.activeElement;
  if (!force && a && root.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendingRender = true; return; } // don't wipe what you're typing
  pendingRender = false;
  const open = new Set(Array.from(root.querySelectorAll("details[open]")).map((d) => d.dataset.key));
  const fn = { today: vToday, leads: vLeads, newlead: vNewLead, lead: () => vLead(sub), book: vBook, posts: vPosts, post: () => vPost(sub), replies: vReplies, prospects: vProspects, plan: vPlan, weekly: vWeekly, setup: vSetup, more: vMore, work: vWork, agent: vAgent }[view] || vToday;
  root.innerHTML = gate || fn();
  root.querySelectorAll("details[data-key]").forEach((d) => { if (open.has(d.dataset.key)) d.open = true; });
  document.getElementById("tabs").innerHTML = TABS.map(([v, l]) => `<button ${go(v)} class="${tabOf(view) === v || (view === "newlead" && v === "leads") || (view === "lead" && v === "leads") || (view === "post" && v === "posts") ? "on" : ""}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[v]}</svg>${l}</button>`).join("");
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 150));

function navigate(v, s) { view = v; sub = s == null ? null : s; filter = ""; render(true); window.scrollTo(0, 0); }

async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); render(true); }
  catch (e) { toast(e instanceof VErr ? e.message : "Couldn't save that. Check your connection and try again.", true); if (!(e instanceof VErr)) console.error(e); }
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-copy],[data-filter],[data-ask]");
  if (!t) return;
  if (t.hasAttribute("data-go")) { e.preventDefault(); return navigate(t.dataset.go, t.dataset.sub); }
  if (t.hasAttribute("data-filter")) { filter = t.dataset.filter; return render(true); }
  if (t.hasAttribute("data-ask")) { document.querySelectorAll("[data-confirm]").forEach((c) => { c.hidden = c.dataset.confirm !== t.dataset.ask; }); return; }
  if (t.hasAttribute("data-copy")) {
    const pre = t.parentNode.querySelector("pre"), text = pre.innerText;
    const done = () => { t.textContent = "Copied"; setTimeout(() => { t.textContent = "Copy"; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected - tap Copy in the menu"); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
    return;
  }
  const id = t.dataset.id, v = t.dataset.v;
  const acts = {
    replied: () => run(() => leadAct(id, (l) => { if (l.status === "New Lead" || l.status === "Follow-Up Due") l.status = "Replied"; l.lastContact = today(); l.next = plusDays(2); ev(l, "reply_sent"); }), "Reply logged. Follow-up set for 2 days from now."),
    followup: () => run(() => leadAct(id, (l) => { l.lastContact = today(); l.next = Number(v) ? plusDays(Number(v)) : null; if (l.status === "Follow-Up Due") l.status = "Replied"; ev(l, "followup_sent"); }), Number(v) ? "Follow-up logged." : "Final follow-up logged. If they don't answer, mark them Lost."),
    confirm: () => run(() => confirmAppt(id), "Confirmed. Send the booking confirmation message."),
    release: () => run(() => cancelAppt(id, false, "slot released"), "Slot released."),
    noshow: () => run(() => cancelAppt(id, true, ""), "No-show logged."),
    reminder: () => run(async () => { const a = S.appts.get(id); await put("appts", id, Object.assign({}, a, { reminder: today() })); await leadAct(a.lead, (l) => ev(l, "reminder_sent")); }, "Reminder logged."),
    closeslot: () => run(async () => { const s = S.slots.get(id); need(s && s.status === "open", "Only open slots can be closed."); await put("slots", id, Object.assign({}, s, { status: "closed" })); }, "Slot closed."),
    reviewreq: () => run(() => leadAct(id, (l) => { l.reviewReq = today(); l.next = null; ev(l, "review_requested"); }), "Review request logged."),
    reviewgot: () => run(() => leadAct(id, (l) => { l.reviewGot = true; ev(l, "review_received"); }), "Review logged."),
    repeat: () => run(() => leadAct(id, (l) => { l.repeat = plusDays(60); ev(l, "repeat_offer_sent"); }), "Repeat offer logged. Next reminder in 60 days."),
    todraft: () => run(() => putPost(id, { status: "draft", approved: null, scheduled: null }), "Back to draft."),
    cash: () => run(() => saveSettings({ cash_mode: v }), v === "yes" ? "Cash mode on." : "Cash mode off."),
    week: () => { reportWeek = plusDays(Number(v), weekBounds(reportWeek)[0]); render(true); },
    backup: () => saveBackup(),
    askchip: () => { askDraft = ASK_CHIPS[Number(v)][1]; render(true); const ta = document.getElementById("f-askq"); if (ta) ta.focus(); },
    askstop: () => { if (askCtl) askCtl.abort(); },
    worknext: () => run(() => workNext(false)),
    workcheck: () => workCheck(Number(v)),
    finishok: () => { lastFinish = null; render(true); },
    guide: () => { guideSvc = v; render(true); },
    kit: () => { kitChecks[Number(v)] = !kitChecks[Number(v)]; try { localStorage.setItem("cf-kit", JSON.stringify(kitChecks)); } catch (_) {} render(true); },
    workskip: () => run(() => workNext(true)),
    workpause: () => run(() => workPause(true), "Paused. Tap Resume when you're back."),
    workresume: () => run(() => workPause(false)),
    workcancel: () => run(clearActive, "Job timer cancelled."),
  };
  if (acts[t.dataset.act]) acts[t.dataset.act]();
});

async function putPost(id, patch) { const o = Object.assign({ status: "draft" }, S.posts.get(id) || {}, patch); await put("posts", id, o); }
async function saveSettings(patch) { if (!db) throw new VErr("Storage isn't connected."); const next = Object.assign({}, S.settings, patch); await db.doc("config/settings").set(next); S.settings = next; }

document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const f = {}; new FormData(form).forEach((val, k) => { f[k] = typeof val === "string" ? val : ""; });
  const id = form.dataset.id;
  const handlers = {
    workstart: () => run(() => workStart(f), "Timer started. One step at a time."),
    ask: () => { ask(f.q).catch((err) => toast(err.message || "Couldn't ask.", true)); },
    newlead: () => run(async () => { const nid = await createLead(f); view = "lead"; sub = nid; }, "Lead added. Reply now - fast replies win jobs."),
    editlead: () => run(() => leadAct(id, (l) => { const n = leadFromForm(f, l); need(STATUSES.includes(f.status), "Pick a status."); if (f.status === "Lost" && l.status !== "Lost") ev(n, "lost", f.lostReason); n.status = f.status; n.next = isDate(f.next) ? f.next : null; n.repeat = isDate(f.repeat) ? f.repeat : null; n.lostReason = clean(f.lostReason, 200); Object.assign(l, n); }), "Saved."),
    quote: () => run(() => leadAct(id, (l) => { need(SERVICES[f.service], "Pick a service."); let p = num(f.price, "Price"); if (p == null) p = SERVICES[f.service].price; l.status = "Quote Sent"; l.service = f.service; l.quote = p; l.lastContact = today(); l.next = plusDays(2); ev(l, "quote_sent", `${SERVICES[f.service].label} $${p}`); }), "Quote logged. Follow-up in 2 days."),
    offer: () => run(() => propose(id, f.slot, f.service, f.price), "Slot held. Send them the time, then confirm when they say yes."),
    cancel: () => run(() => cancelAppt(id, false, f.reason), "Cancelled. The slot is open again if it's in the future."),
    complete: () => run(() => completeJob(id, f), "Job recorded. Ask for a review tomorrow."),
    pay: () => run(() => recordPayment(id, f.amount, f.method), "Payment recorded."),
    slot: () => run(() => addSlot(f), "Slot added."),
    approve: () => run(async () => { const p = postView(POSTS.find((x) => x.id === id)); if (p.needs_real_photos) need(f.photos === "on", "This post needs your real photos or video. Tick the box once you have them."); const probs = postProblems(p); need(!probs.length, "Can't approve yet: " + probs.join("; ")); await putPost(id, { status: "approved", approved: today() }); }, "Approved. Post it yourself, then mark it published."),
    publish: () => run(async () => { const where = clean(f.where, 200); need(where, "Say where you posted it."); const d = isDate(f.date) ? f.date : today(); need(d <= today(), "Use Schedule for a future date."); await putPost(id, { status: "published", published: d, where }); }, "Marked published."),
    schedule: () => run(async () => { need(isDate(f.date), "Pick a date."); await putPost(id, { status: "scheduled", scheduled: f.date }); }, "Scheduled (reminder only - post it yourself on the day)."),
    postedit: () => run(async () => { const base = POSTS.find((x) => x.id === id), cur = postView(base); need(cur.status !== "published", "Already published - edit it on the platform."); const edits = {}; let changed = false; for (const k in POST_FIELDS) { edits[k] = clean(f[k], 4000); if (edits[k] !== cur[k]) changed = true; } await putPost(id, Object.assign({ edits }, changed && cur.status !== "draft" ? { status: "draft", approved: null } : {})); }, "Wording saved."),
    oppnew: () => run(() => put("opps", newId("opps"), oppFromForm(f, { found: today(), order: Date.now() })), "Added."),
    opp: () => run(() => put("opps", id, oppFromForm(f, S.opps.get(id))), "Updated."),
    effort: () => run(async () => { const m = parseInt(f.minutes, 10); need(m >= 0 && m <= 600, "Minutes must be 0-600."); need(clean(f.activity), "Say what you did."); need(SOURCES.includes(f.channel), "Pick a channel."); await put("effort", newId("effort"), { date: isDate(f.date) ? f.date : today(), channel: f.channel, activity: clean(f.activity, 200), minutes: m }); }, "Logged."),
    settings: () => run(async () => { const patch = {}; for (const [k] of SETTINGS) patch[k] = clean(f[k], 200); if (patch.max_jobs_per_day) { const n = parseInt(patch.max_jobs_per_day, 10); need(n >= 1 && n <= 10, "Max cars per day must be 1-10."); patch.max_jobs_per_day = String(n); } if (patch.launch_date) need(isDate(patch.launch_date), "Launch date must be a date."); await saveSettings(patch); }, "Setup saved."),
  };
  if (handlers[form.dataset.form]) handlers[form.dataset.form]();
});
function oppFromForm(f, base) {
  const o = Object.assign({}, base || {}); o.name = clean(f.name, 200); need(o.name, "Name is required.");
  o.type = OPP_TYPES.includes(f.type) ? f.type : "other"; o.status = OPP_STATUS.includes(f.status) ? f.status : "to_research"; o.rule = RULES[f.rule] ? f.rule : "unknown";
  o.contact = clean(f.contact, 300); o.rulesNotes = clean(f.rulesNotes, 1000); o.next = clean(f.next, 300); o.nextDate = isDate(f.nextDate) ? f.nextDate : null; o.outcome = clean(f.outcome, 500); o.info = clean(f.info, 300);
  return o;
}

let downloads = null;
async function saveBackup() {
  const data = { saved: new Date().toISOString(), settings: S.settings };
  COLS.forEach((c) => { data[c] = all(c); });
  if (!downloads) return toast("Saving files isn't available in this view. Your data is still stored safely.", true);
  try { await downloads.save({ filename: `carbon-force-backup-${today()}.json`, data: JSON.stringify(data, null, 1) }); }
  catch (e) { toast("Backup wasn't saved.", true); }
}

// ---------------------------------------------------------------- boot
let gate = "";
(function boot() {
  const h = (location.hash || "").slice(1);
  if (["agent", "today", "leads", "book", "work", "posts", "replies", "prospects", "plan", "weekly", "setup", "more"].includes(h)) view = h;
  render(true);
})();
(async function connect() {
  const sync = document.getElementById("sync");
  if (!window.claude || !window.claude.use) { sync.textContent = "Offline copy"; gate = `<div class="card bad"><h2>Open this from Claude</h2><p>This page saves your data in your Claude account, so it only works when opened from its claude.ai link while you're signed in.</p></div>`; return render(true); }
  const [d, u, dl, sm] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads"), claude.use("sample")]);
  downloads = dl; sampleFn = sm;
  if (u) { try { if (!(await u.isOwner())) { readOnly = true; gate = `<div class="card bad"><h2>Private business tool</h2><p>This page belongs to someone else, and its data is private.</p></div>`; sync.textContent = ""; return render(true); } } catch (_) {} }
  if (!d) { sync.textContent = "Not connected"; gate = `<div class="card bad"><h2>Storage isn't connected</h2><p>Reopen this page from its claude.ai link while signed in. Your data is safe - it just can't load in this view.</p></div>`; return render(true); }
  db = d; gate = "";
  const done = (name) => { S.loaded.add(name); sync.textContent = S.loaded.size >= COLS.length + 1 ? "Saved ✓" : "Loading…"; render(); };
  const fail = (e) => { sync.textContent = "Connection lost - reload"; console.warn(e && e.code); };
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => { S[c] = new Map(snap.docs.map((x) => [x.id, Object.assign({ id: x.id }, x.data())])); done(c); }, fail));
  db.doc("config/activejob").onSnapshot((snap) => { S.active = snap.exists ? Object.assign({}, snap.data()) : null; render(); }, fail);
  db.doc("config/settings").onSnapshot((snap) => { S.settings = snap.exists ? Object.assign({}, snap.data()) : {}; done("settings"); }, fail);
})();
})();
</script>
