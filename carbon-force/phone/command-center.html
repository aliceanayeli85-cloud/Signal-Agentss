<style>
/* Layout: one-column phone app, sticky brand bar, fixed bottom tab bar. Theme: Carbon Force flyer - carbon black, race red, white, slanted heavy condensed type. */
:root {

}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line) }
.brand { font: italic 800 24px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; color: var(--fg) }
.brand em { font-style: italic; color: var(--accent) }
.brand small { display: block; font: 500 11px/1.4 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: 3px }
header.top { background-color: var(--bg); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px); border-bottom: 2px solid var(--accent) !important }
.sync { font-size: 12px; color: var(--muted) }
h1 { font: italic 800 34px/1 var(--display); margin: 8px 0 0; text-wrap: balance; letter-spacing: .01em; text-transform: uppercase }

p { margin: 0 0 8px }
.muted, .hint { color: var(--muted) } .hint { font-size: 13px; display: block; font-weight: 400; margin-top: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }

.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; flex-wrap: wrap; gap: 8px }
.row > * { flex: 1 1 140px; min-width: 0 }
ul.list { list-style: none; padding: 0; margin: 0 }

ol.todo { margin: 0; padding-left: 22px } ol.todo li { margin: 6px 0 }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap }
.p-warn { color: var(--warn) } .p-ok { color: var(--ok) } .p-bad { color: var(--bad) } .p-mute { color: var(--muted) }
.p-solid { background: var(--ok); color: #06210f; border-color: var(--ok) }
.big { font: italic 800 40px/1 var(--display); font-variant-numeric: tabular-nums }

.nums div { background: var(--sunk); border-radius: 8px; padding: 10px }

.nums span { font-size: 13px; color: var(--muted) }
label { display: block; font-weight: 600; font-size: 14px }
input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 10px; font: 16px var(--body);
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px }
textarea { min-height: 120px; resize: vertical }

  background: var(--accent); color: var(--accent-fg); cursor: pointer; text-decoration: none; display: inline-block; text-align: center }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line) }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
a { color: var(--accent) }
a.rowlink { color: var(--fg); font-weight: 600; text-decoration: none }
.copy { position: relative; margin: 6px 0 4px }
.copy pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font: 15px/1.45 var(--body); background: var(--sunk);
  border-radius: 8px; padding: 12px 12px 48px }
.copy button { position: absolute; right: 8px; bottom: 8px }

.chips button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.tablewrap { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: transparent; border: 0; color: var(--muted); padding: 8px 2px; font-size: 12px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8 }
nav.tabs button.on { color: var(--accent-hi) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: calc(100% - 32px); font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.2) }
.toast.err { background: var(--accent); color: #fff }
.back { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 600 }
.morelist button { width: 100%; text-align: left; background: var(--surface); color: var(--fg); border-color: var(--line); padding: 14px }
.empty { color: var(--muted); padding: 6px 0 }
.timer { font: italic 800 68px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em }
.timer.over { color: var(--warn) }
.stepname { font: italic 800 40px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; margin: 0 }
.eyebrow { display: block; font: 700 11px/1.3 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 4px }
.jobhead { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: 8px }
.stepcount { font: italic 700 18px/1 var(--display); color: var(--muted) } .stepcount b { font-size: 34px; color: var(--accent) }
.stepcard { display: flex; flex-direction: column; gap: 12px; border-top: 3px solid var(--accent) }
.why { color: var(--muted); margin: 0 }
.clock { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--sunk); border-radius: 10px; padding: 12px 14px }
.goal { text-align: right; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em } .goal b { font: italic 700 26px/1 var(--display); color: var(--fg); letter-spacing: 0 }
.small { font-size: 14px; margin: 0 }
.checks { display: flex; flex-direction: column; gap: 6px }
button.check { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--sunk); color: var(--fg); border: 1px solid var(--line); padding: 12px; font-weight: 500 }
button.check .box { flex: 0 0 26px; height: 26px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-weight: 800; color: var(--accent-fg) }
button.check.on { color: var(--muted); text-decoration: line-through; border-color: var(--accent) } button.check.on .box { background: var(--accent); border-color: var(--accent) }
.donewhen, .dont { border-radius: 10px; padding: 10px 12px; font-weight: 600 }
.donewhen { background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent) }

.tools { display: flex; flex-wrap: wrap; gap: 6px } .tool { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line) }

.hero { border-top: 3px solid var(--accent) }
.finish { border-top: 3px solid var(--ok) }

ol.habits li { counter-increment: h; display: grid; grid-template-columns: 34px 1fr; column-gap: 8px }

ol.habits span { color: var(--muted); font-size: 14px }
ul.tight { margin: 6px 0; padding-left: 20px } ul.tight li { margin: 3px 0 }
details .donewhen, details .dont { margin-top: 8px; font-size: 14px }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--accent) }
button.huge { width: 100%; padding: 18px; font-size: 19px }
.confirm { background: var(--sunk); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
.next { border-top: 3px solid var(--accent); display: flex; flex-direction: column; gap: 6px; align-items: flex-start }
.nextwhat { font: italic 800 26px/1.05 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance }
.tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) }
.journey { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 } .journey span { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line) } .journey span.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
dl.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 14px; margin: 0 } dl.kv dt { color: var(--muted); font-size: 14px } dl.kv dd { margin: 0; font-weight: 600 }

.check.auto { display: flex; align-items: center; gap: 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 12px } .check.auto .box { flex: 0 0 26px; height: 26px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; font-weight: 800 } .check.auto.on .box { background: var(--ok); border-color: var(--ok); color: #06210f }
.searchbox input { margin-top: 4px }
.jobbox { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px } .jobbox:first-of-type { border-top: 0; margin-top: 0; padding-top: 0 }
body.busy button[type=submit] { opacity: .6; pointer-events: none }
@media (max-width: 420px) { dl.kv { grid-template-columns: 1fr } dl.kv dd { margin-bottom: 6px } }
</style>

up_version":"","day":3,"id":"d03-do-you-come-to-me"},{"title":"Reel: what's under your seats","pillar":"process","purpose":"Satisfying faceless video that shows real work and stops the scroll.","platform":"Instagram Reel + Facebook Reel","format":"15-25s reel, no voice","needs_real_photos":true,"cta":"DM to book an interior","visual":"Real vacuum footage from under a seat and between seat and console.","shots":"- Phone low, pointing under the seat, slide seat forward\n- Vacuum nozzle pass, slow\n- Same spot after, clean\n- Keep hands only in frame","reel_script":"0-2s  Seat slides forward, revealing what's under it. Text: \"Nobody looks under here.\"\n2-8s  Vacuum crevice tool passes, close-up. Text: \"I do.\"\n8-14s Gap between seat and console. Text: \"This gap too.\"\n14-20s Clean after shot, same angle. Text: \"Interior {price_interior} - Melrose Park, drop-off\"\nAudio: trending instrumental or just the vacuum sound. No voice needed.","instagram":"The area under the seat is where fries go to retire.\n\nInterior {price_interior}, drop-off in Melrose Park. {booking_line}.","facebook":"Everybody has this spot. You just haven't looked.\n\nInterior {price_interior}. {booking_line}.","season":"any","story":"","group_version":"","allow_terms":"","day":4,"id":"d04-under-the-seats"},{"title":"Parents: the car seat zone","pillar":"everyday problem","purpose":"Speak directly to parents - a big local group with real messy cars.","platform":"Facebook Page + parent-friendly local groups (where allowed)","format":"photo post","cta":"Text to book an interior","visual":"Real photo of a cleaned back seat area (no car seat, no kids' items with names).","shots":"- Back seat floor after cleaning\n- Close-up of seat crease, clean","facebook":"If there's a car seat in your back row, you already know what's going on under it.\n\nCrumbs in the seat creases, juice on the floor mat, something sticky on the door you can't identify. That's normal. It's also exactly what an interior detail is for.\n\nInterior is {price_interior}. Drop it off at my garage in {area_line} and do something else for a few hours.\n\n{booking_line}.","instagram":"Back seat of a parent's car: a short documentary.\n\nInterior {price_interior}. Drop-off, Melrose Park. {booking_line}.","group_version":"For the parents here: if your back seat has turned into a snack museum, I do interior cleaning out of my garage in {area_line} for {price_interior}. Drop-off only.\n\nNo pressure - just figured someone might need it. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":5,"id":"d05-car-seat-crumbs"},{"title":"Before / after #1 (your first real job)","pillar":"proof","purpose":"Show real results. Only post with your own genuine photos.","platform":"Facebook Page + Instagram carousel","format":"carousel: before, after","needs_real_photos":true,"cta":"Message to book the same service","visual":"REAL before and after from the same angle, same lighting. Blur plates, no customer faces. Ask the customer if it's okay to post their car.","shots":"- Before: wide shot of the area, phone at chest height\n- After: exact same spot and angle\n- One close-up detail (cup holder, mat, wheel)","facebook":"Before and after from this week. [TYPE WHAT SERVICE THIS WAS AND ONE REAL DETAIL ABOUT THE CAR]\n\nSame angle, same light, no filters.\n\n{booking_line}.","instagram":"Before / after. [TYPE THE SERVICE]. No filters, same light.\n\nMelrose Park, drop-off. {booking_line}.","story":"Frame 1: before photo, text 'Before'. Frame 2: after photo, text 'After'. Frame 3: 'This was the {price_interior} interior' (edit to match) + DM sticker.","season":"any","reel_script":"","group_version":"","allow_terms":"","day":6,"id":"d06-before-after-1"},{"title":"Fall: leaves, sap and what's on your paint","pillar":"seasonal","season":"fall","purpose":"Timely exterior post for October/November.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Text to book an exterior","visual":"Real photo of leaves stuck at the base of a windshield or around the hood, then the cleaned version.","shots":"- Leaves in the windshield area (before)\n- Same area cleaned (after)","facebook":"It's that time of year where you park under one tree for ten minutes and come back to a hood full of leaves, wet gunk at the bottom of the windshield, and bird droppings that have been sitting for a week.\n\nExterior cleaning is {price_exterior}: {exterior_includes}.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"October paint job: leaves, sap, and mystery spots.\n\nExterior {price_exterior}. Drop-off, Melrose Park. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":7,"id":"d07-fall-leaves"},{"title":"Reel: cleaning one cup holder","pillar":"satisfying detail","purpose":"Short, oddly satisfying video. Low effort, high watch time.","platform":"Instagram Reel + Facebook Reel","format":"10-15s reel, no voice","needs_real_photos":true,"cta":"DM to book","visual":"Tight close-up of a dirty cup holder being cleaned with a brush and towel.","shots":"- Phone propped, 6 inches away, cup holder fills the frame\n- Brush in, swirl, towel wipe\n- Final clean shot, hold 2 seconds","reel_script":"0-2s  Dirty cup holder, close. Text: \"One cup holder. 40 seconds.\"\n2-10s Brush, wipe, brush again. No text.\n10-13s Clean result. Text: \"Now imagine the whole car. Interior {price_interior}.\"\nAudio: the brush sounds. Seriously, people like that.","instagram":"Every car has one cup holder that's been through things.\n\nInterior {price_interior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":8,"id":"d08-cup-holder"},{"title":"What the full package actually includes","pillar":"pricing","purpose":"Explain the best-value option clearly.","platform":"Facebook Page","format":"text + 2 photos (inside and out)","cta":"Text 'full' to book","visual":"One real interior photo + one real exterior photo of the same car.","shots":"- Interior wide shot through the open driver door\n- Exterior three-quarter angle","facebook":"A few people asked what the {price_full} package is, so here it is plainly.\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\nThat's both services in one drop-off. Price-wise it's the same as booking them separately - the point is one visit, one number, and the whole car done at once.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"Full package = interior + exterior, {price_full}.\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":9,"id":"d09-full-package"},{"title":"How booking works (4 steps)","pillar":"booking","purpose":"Remove friction - people book when they know exactly what happens.","platform":"Facebook Page + Instagram + Story highlight","format":"text post / story series","cta":"Send a text with your car and the service you want","visual":"Simple numbered graphic, or a photo of keys on a clean seat.","shots":"- Keys on a clean seat\n- Garage with the door open","facebook":"How booking with me works:\n\n1. Text or message me what car you have and which service you want.\n2. I'll send you the drop-off times I actually have open.\n3. Drop the car off at my garage in {area_line}. {turnaround_line}.\n4. Pick it up, pay ({payment_methods}), done.\n\nInterior {price_interior} / Exterior {price_exterior} / Both {price_full}\n\n{booking_line}.","instagram":"Booking in 4 steps:\n1. DM your car + service\n2. I send open drop-off times\n3. Drop it off\n4. Pick up a clean car\n\n{booking_line}.","story":"Four frames, one step each. Save as a 'Booking' highlight on Instagram.","season":"any","needs_real_photos":false,"reel_script":"","group_version":"","allow_terms":"","day":10,"id":"d10-how-booking-works"},{"title":"Uber, Lyft and delivery drivers","pillar":"everyday problem","purpose":"Target people whose car is literally their workplace.","platform":"Facebook Page + driver-focused groups (where allowed)","format":"text post","cta":"Text to book","visual":"Real photo of a clean back seat and door panel.","shots":"- Rear passenger door panel, clean\n- Back seat from the passenger's view","facebook":"If you drive for Uber, Lyft, DoorDash, any of them - your car is your office. And your office gets a lot of strangers.\n\nInterior is {price_interior}. Full inside and out is {price_full}. Drop-off in {area_line}, so plan it on a day you're not driving.\n\n{booking_line}.","instagram":"Drivers: your back seat sees more people than most waiting rooms.\n\nInterior {price_interior}. Drop-off, Melrose Park. {booking_line}.","group_version":"For drivers in the area: I do interior cleaning ({price_interior}) and full inside/out ({price_full}) out of my garage in {area_line}. Drop-off only, so it works best on a day off. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":11,"id":"d11-rideshare-drivers"},{"title":"Before / after: floor mats","pillar":"proof","purpose":"Second real proof post, focused on one obvious part of the car.","platform":"Instagram carousel + Facebook Page","format":"carousel","needs_real_photos":true,"cta":"DM to book","visual":"REAL floor mat before/after, laid on the same surface.","shots":"- Mat on the garage floor, before\n- Same mat, same spot, after","facebook":"Floor mats take the worst of it. This one [TYPE ONE REAL DETAIL - e.g. 'had half a season of salt and mud on it'].\n\nBefore and after, same spot on my garage floor.\n\n{booking_line}.","instagram":"Floor mat, before and after. [TYPE ONE REAL DETAIL]\n\nInterior {price_interior}. {booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":12,"id":"d12-before-after-mats"},{"title":"Dog hair: honest expectations","pillar":"everyday problem","purpose":"Attract pet owners while setting realistic expectations.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Send a photo for an honest answer","visual":"Real photo of a cargo area or back seat with pet hair (yours or a customer's, with permission).","shots":"- Close-up of fabric with hair\n- Same fabric after","facebook":"Dog owners, this one's for you.\n\nPet hair weaves itself into car fabric like it's paying rent. Some cars come out great, some need more time than a standard interior.\n\nSo here's what I do: send me a photo before you book and I'll tell you honestly what to expect. No surprises when you pick it up.\n\nInterior starts at {price_interior}. {booking_line}.","instagram":"Dog hair in the back seat? Send me a pic first and I'll give you an honest answer before you book.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":13,"id":"d13-pet-hair"},{"title":"Story poll: crumbs vs. dog hair","pillar":"engagement","purpose":"Easy Story engagement so Instagram shows your next posts to more people.","platform":"Instagram Story + Facebook Story","format":"story with poll sticker","cta":"Vote / DM","visual":"Plain background or a real close-up of a messy seat.","shots":"- Any close-up of a messy (or cleaned) seat","story":"Frame 1: 'What's worse in a car?' Poll sticker: 'Crumbs' / 'Dog hair'.\nFrame 2 (next day): 'Results are in: [TYPE REAL RESULT]. Either way, interior is {price_interior}.' + DM sticker.","season":"any","needs_real_photos":false,"facebook":"","instagram":"","reel_script":"","group_version":"","allow_terms":"","day":14,"id":"d14-poll-crumbs-vs-hair"},{"title":"Thanksgiving: airport runs and family in the car","pillar":"seasonal","season":"fall","purpose":"Holiday timing: people want clean cars before guests ride along.","platform":"Facebook Page + local groups (where allowed)","format":"text + photo","cta":"Book a drop-off before the holiday","visual":"Clean back seat or trunk ready for luggage.","shots":"- Empty clean trunk\n- Back seat, wide","facebook":"Picking somebody up from O'Hare for Thanksgiving? Driving the whole family to dinner?\n\nIf the back seat currently has gym clothes, receipts and a single lost shoe in it, now's a good time.\n\nInterior {price_interior}. Inside and out {price_full}. Drop-off in {area_line}.\n\nMessage me and I'll tell you what drop-off times I have before the holiday. {booking_line}.","instagram":"Airport pickup season. Make the back seat presentable.\n\nInterior {price_interior} / Full {price_full}. {booking_line}.","group_version":"If anyone's doing airport runs or hosting family next week and wants their car cleaned first, I do drop-off detailing in {area_line}. Interior {price_interior}, full {price_full}. Happy to tell you what times I have open. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":15,"id":"d15-thanksgiving-ohare"},{"title":"Reel: wheels and tires","pillar":"process","purpose":"Exterior process video; wheels are the most visual part.","platform":"Instagram Reel + Facebook Reel","format":"15-20s reel, no voice","needs_real_photos":true,"cta":"DM to book an exterior","visual":"Close-up of a dirty wheel being cleaned, then the result.","shots":"- Phone at wheel height, 2 feet away\n- Brush in the spokes, slow\n- Rinse, then final shot","reel_script":"0-3s  Dirty wheel, still. Text: \"Brake dust is not a color.\"\n3-12s Brush through the spokes, rinse. Text: \"Exterior {price_exterior}\"\n12-18s Clean wheel, slow pan. Text: \"Drop-off, Melrose Park. DM to book.\"","instagram":"Brake dust is not a color.\n\nExterior {price_exterior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":16,"id":"d16-wheels-reel"},{"title":"Selling or trading in? Clean it first","pillar":"everyday problem","purpose":"Reach people with a concrete reason to book this week.","platform":"Facebook Page + Marketplace-adjacent groups (where allowed)","format":"text post","cta":"Text to book before you list","visual":"Real photo of a clean interior taken like a listing photo.","shots":"- Driver's door open, wide interior shot (the classic listing photo)","facebook":"Listing your car on Marketplace or trading it in soon?\n\nI can't promise a clean car gets you a better offer. I can tell you that listing photos of a clean car look like it's been cared for, and photos of a dirty one look like... a dirty one.\n\nFull inside and out is {price_full}. Drop-off in {area_line}. {booking_line}.","instagram":"Selling soon? Clean listing photos > dirty listing photos.\n\nFull package {price_full}. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":17,"id":"d17-selling-your-car"},{"title":"What I don't do (yet)","pillar":"trust","purpose":"Build trust by being upfront about limits; filters out bad-fit requests.","platform":"Facebook Page","format":"text post","cta":"Ask if your car's a good fit","visual":"Photo of your supplies or the garage.","shots":"- Supplies shelf, tidy","allow_terms":"mobile, ceramic, paint correction, polish, extraction","facebook":"Being upfront about what I do and don't do:\n\nI do: interior detailing ({price_interior}), exterior cleaning ({price_exterior}), and both together ({price_full}).\n\nI don't do (right now): paint correction, polishing, ceramic coatings, carpet extraction, or mobile service.\n\nIf your car needs one of those, I'll tell you instead of taking your money for something I don't offer. If it just needs a good, honest cleaning, that's me.\n\n{booking_line}.","season":"any","needs_real_photos":false,"instagram":"","story":"","reel_script":"","group_version":"","day":18,"id":"d18-what-i-dont-do"},{"title":"Salt season prep","pillar":"seasonal","season":"winter","purpose":"Chicago winter: salt is the big exterior problem. Post after the first salting.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Book an exterior after the next salt day","visual":"Real photo of salt residue on a lower door or wheel well, then cleaned.","shots":"- Lower door panel with white salt line\n- Same area after","facebook":"The salt trucks are out, which means the bottom of every car around here is about to turn white.\n\nExterior cleaning is {price_exterior}: {exterior_includes}.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"First salt of the season. You know what's coming.\n\nExterior {price_exterior}. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":19,"id":"d19-salt-season"},{"title":"If I've cleaned your car, tell one person","pillar":"referral","purpose":"Ask happy customers to spread the word - the cheapest marketing there is.","platform":"Facebook Page + direct message to past customers","format":"text post","cta":"Share or tag someone","visual":"Real after photo from a past job (with permission).","shots":"- Any good after shot you already have","facebook":"Small business, honest ask: if I've cleaned your car and you were happy with it, tell one person. A coworker, your sister, the neighbor whose car you secretly judge.\n\nThat's how a one-person shop like mine actually grows.\n\nAnd if you haven't booked yet: interior {price_interior}, exterior {price_exterior}, both {price_full}. {booking_line}.","instagram":"If I've cleaned your car - share this with one person who needs it. That's how a one-person shop grows.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":20,"id":"d20-referral-ask"},{"title":"Before / after: exterior","pillar":"proof","purpose":"Third real proof post, exterior this time.","platform":"Facebook Page + Instagram carousel","format":"carousel","needs_real_photos":true,"cta":"DM to book an exterior","visual":"REAL exterior before/after from the same angle. Plates blurred.","shots":"- Three-quarter front angle, before\n- Same angle, after, same time of day","facebook":"Exterior before and after. [TYPE ONE REAL DETAIL ABOUT THIS CAR]\n\n{price_exterior}, drop-off in {area_line}. {booking_line}.","instagram":"Exterior before / after. [TYPE ONE REAL DETAIL]\n\n{price_exterior}. {booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":21,"id":"d21-before-after-exterior"},{"title":"The coffee drip on the console","pillar":"everyday problem","purpose":"Relatable commuter problem, honest about stains.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Text to book an interior","visual":"Real photo of a console/cup holder area after cleaning.","shots":"- Console, top-down shot","facebook":"Every commuter car has the same drip line running down the side of the console. Coffee, mostly. Sometimes Gatorade. Once in a while, a mystery.\n\nFresh spills clean up a lot easier than ones that have been baking in since summer. If you've got one that's old, send me a photo and I'll tell you honestly what to expect.\n\nInterior {price_interior}. {booking_line}.","instagram":"The console coffee drip. Every car has one.\n\nInterior {price_interior}. Melrose Park, drop-off. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":22,"id":"d22-coffee-spill"},{"title":"What I actually use","pillar":"process","purpose":"Show the real tools - credibility without showing your face.","platform":"Instagram feed + Facebook Page","format":"single photo","needs_real_photos":true,"cta":"Ask a question / DM to book","visual":"Flat lay of your REAL brushes, towels, vacuum attachments on the garage floor or a clean towel.","shots":"- Top-down, phone held flat over the tools\n- One close-up of the most-used brush","facebook":"People always ask what I use. Here's the actual kit. [TYPE 1-2 REAL THINGS ABOUT YOUR TOOLS - e.g. which brush you use most and why]\n\nNothing magic, just the right tool for each spot and the patience to use it.\n\n{booking_line}.","instagram":"The actual kit. [TYPE ONE REAL DETAIL]\n\n{booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":23,"id":"d23-tools-flatlay"},{"title":"Reel: full interior timelapse","pillar":"process","purpose":"The big 'whole job' video. Shows effort and value for the price.","platform":"Instagram Reel + Facebook Reel","format":"20-30s timelapse, no voice","needs_real_photos":true,"cta":"DM to book","visual":"Phone on a tripod or wedged in the door frame, timelapse of the whole interior job.","shots":"- Fixed angle through the open passenger door\n- Timelapse mode for the whole job\n- 3-second normal-speed clean shot at the end","reel_script":"0-2s  Before, normal speed. Text: \"[TYPE REAL TIME IT TOOK] in 25 seconds.\"\n2-22s Timelapse. Text pops in at the midpoint: \"Interior {price_interior}\"\n22-27s After, normal speed, slow pan. Text: \"Drop-off - Melrose Park. DM to book.\"","instagram":"A full interior, sped way up. [TYPE REAL TIME IT TOOK] of work.\n\nInterior {price_interior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":24,"id":"d24-timelapse"},{"title":"Open drop-off times this week","pillar":"booking","purpose":"Fill REAL open slots. Only post when you actually have openings.","platform":"Facebook Page + Instagram Story + groups (promo days)","format":"text post / story","cta":"Text to grab a time","visual":"Photo of your empty garage bay, or plain text graphic.","shots":"- Empty garage bay, lights on","facebook":"I've got a few drop-off times open this week:\n\n[TYPE YOUR REAL OPEN DROP-OFF TIMES HERE]\n\nInterior {price_interior} / Exterior {price_exterior} / Both {price_full}\n\n{booking_line}.","instagram":"Open drop-off times this week:\n[TYPE YOUR REAL OPEN DROP-OFF TIMES HERE]\n\n{booking_line}.","story":"Frame: 'Open this week:' + your real times. Add a DM sticker. Only post with times you've added in the Booking page.","season":"any","needs_real_photos":false,"reel_script":"","group_version":"","allow_terms":"","day":25,"id":"d25-open-times-this-week"},{"title":"Sports parents and gym bags","pillar":"everyday problem","purpose":"Another real, local audience with messy cars.","platform":"Facebook Page + parent/sports groups (where allowed)","format":"text post","cta":"Text to book","visual":"Real photo of a cleaned trunk/cargo area.","shots":"- Clean trunk, wide\n- Trunk carpet close-up","facebook":"Travel soccer, hockey bags, cleats, the gym bag that lives in your trunk year-round. Your car has seen things.\n\nA lot of car smell is just stuff that's been sitting in there too long. Getting it all out and cleaned up is step one.\n\nInterior {price_interior}. Drop-off in {area_line}. {booking_line}.","instagram":"Hockey bag owners, I see you. And I smell you.\n\nInterior {price_interior}. {booking_line}.","group_version":"Sports parents: if the trunk has become permanent storage for cleats and bags, I do interior cleaning out of my garage in {area_line}, {price_interior}. Drop-off only. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":26,"id":"d26-sports-gym-bags"},{"title":"December: holiday driving","pillar":"seasonal","season":"winter","purpose":"Holiday timing for December.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Message for open times before the holidays","visual":"Clean interior, warm garage lighting.","shots":"- Front seats, wide, garage lights on","facebook":"Between holiday parties, picking people up, and the salt on the roads, December is rough on cars.\n\nIf you want it clean before family's in the car: interior {price_interior}, exterior {price_exterior}, or both for {price_full}.\n\nMessage me and I'll send you the drop-off times I actually have. {booking_line}.","instagram":"Clean car before the holiday chaos. Interior {price_interior} / Full {price_full}.\n\n{booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":27,"id":"d27-holiday-driving"},{"title":"How long does it take?","pillar":"faq","purpose":"Answer the second most common question after price.","platform":"Facebook Page + Instagram Story highlight","format":"text post","cta":"Text to book a drop-off","visual":"Photo of keys on a hook or a clock in the garage (optional).","shots":"- Keys hanging in the garage","facebook":"\"How long will you have my car?\"\n\n{turnaround_line}. {hours_line}.\n\nI'm one person, so I don't rush cars through. When you pick it up, it's done.\n\n{booking_line}.","instagram":"How long? {turnaround_line}.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":28,"id":"d28-how-long"},{"title":"Why regulars book every month or so","pillar":"repeat","purpose":"Plant the idea of repeat bookings.","platform":"Facebook Page","format":"text post","cta":"Ask about your next cleaning","visual":"Side-by-side: a car that's maintained vs. one that isn't (your real photos only).","shots":"- Any real after shot","facebook":"The easiest car to clean is one that got cleaned a month ago.\n\nWhen it's been a year, everything's ground in. When it's been a month, it's a quick reset and the car basically stays nice.\n\nInterior {price_interior}, exterior {price_exterior}, both {price_full}. If you've been in before, just text me when you're ready for the next one. {booking_line}.","instagram":"Clean car tip: the best time to clean it is before it gets bad.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":29,"id":"d29-maintenance-cleaning"},{"title":"30 days in: real numbers and thanks","pillar":"milestone","purpose":"Honest recap with REAL numbers only. Builds trust and reminds people you exist.","platform":"Facebook Page","format":"text post + best real before/after","needs_real_photos":true,"cta":"Book / share","visual":"Your favorite REAL before/after from the month.","shots":"- Best before/after you have","facebook":"First month of {business} is done.\n\n[TYPE REAL NUMBER] cars cleaned. [TYPE ONE REAL THING YOU LEARNED OR NOTICED - e.g. which spot is always the dirtiest].\n\nThank you to everyone who dropped off a car or shared a post. Seriously.\n\nStill the same prices: interior {price_interior}, exterior {price_exterior}, both {price_full}. {booking_line}.","instagram":"Month one: [TYPE REAL NUMBER] cars. Thank you, Melrose Park.\n\n{booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":30,"id":"d30-first-30-days"}]</script>
<script type="application/json" id="d-replies">[{"id":"price","group":"Inquiries","title":"\"How much do you charge?\"","when":"First reply to a price question. Answer the price straight away - don't make them ask twice.","next_step":"Mark as Replied (or Quote Sent if they named a service).","text":"Hey {name}! Prices are simple:\n\nInterior - {price_interior}\nExterior - {price_exterior}\nBoth inside and out - {price_full}\n\nIt's drop-off at my garage in {area_line}. What kind of car is it, and which one were you thinking?"},{"id":"location","group":"Inquiries","title":"\"Where are you located?\"","when":"Give the general area. Send the exact address only once they've booked.","next_step":"Mark as Replied.","text":"I'm in {area_line}. It's a garage setup, so it's drop-off - you leave the car with me and pick it up when it's done. I'll send the exact address once we lock in a time. Want me to send you what I have open?"},{"id":"come_to_me","group":"Inquiries","title":"\"Do you come to me?\"","when":"Mobile requests. Be clear and friendly - don't leave any doubt.","next_step":"Mark as Replied. If they can't drop off, mark Lost with reason 'needs mobile'.","text":"I don't, sorry - I'm drop-off only right now. Everything I use is set up in my garage in {area_line}. If you're able to drop it off, I'd be happy to take care of it. {hours_line}."},{"id":"full_package","group":"Inquiries","title":"\"What does the $140 package include?\"","when":"Explaining the full package. Only list what you actually do (it comes from Settings).","next_step":"Mark Quote Sent with service 'full'.","text":"The {price_full} package is both services in one drop-off:\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\n{turnaround_line}. Want me to send you some drop-off times?"},{"id":"availability","group":"Inquiries","title":"\"Do you have availability?\"","when":"Only real open slots from the Booking page are listed. If none are listed, add slots first - never guess.","next_step":"After they pick one, use 'Offer this slot' on the lead, then Confirm once they say yes.","text":"Here's what I have open right now:\n\n{open_times}\n\nWhich one works for you? Once you pick, I'll hold it and send the address."},{"id":"pet_or_stain","group":"Inquiries","title":"Pet hair / old stain / \"can you get this out?\"","when":"Don't promise results you haven't seen. Ask for a photo.","next_step":"Mark as Replied, follow up in 1 day.","text":"Can you send me a picture of it? I'd rather tell you honestly what to expect before you book than promise something and have you disappointed."},{"id":"no_reply_1","group":"Follow-ups","title":"No reply - first nudge (2 days)","when":"They asked, you answered, then silence. One light nudge.","next_step":"Use 'Log follow-up' and set next follow-up in 4 days.","text":"Hey {name}, just checking back in case my last message got buried. Still want to get the car cleaned? No worries either way."},{"id":"no_reply_2","group":"Follow-ups","title":"No reply - last message (about a week later)","when":"Final follow-up. After this, mark Lost - don't keep messaging.","next_step":"Log follow-up with no next date, then mark Lost (reason: no response).","text":"Last one from me so I'm not blowing up your phone - if you ever want the car done, just text me. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Take care!"},{"id":"quote_followup","group":"Follow-ups","title":"Quote sent, no decision yet","when":"They got a price but didn't pick a time.","next_step":"Log follow-up, next in 3 days.","text":"Hey {name}, any thoughts on the {service_label}? Happy to send you the open drop-off times if you want to grab one."},{"id":"booking_confirmation","group":"Appointments","title":"Booking confirmation","when":"Right after they say yes to a time. Then press Confirm on the appointment.","next_step":"Confirm the appointment in the app.","text":"You're all set, {name}!\n\n{appt_service} - {appt_price}\nDrop-off: {appt_date} at {appt_time}\nWhere: {private_address}\n\n{turnaround_line}. I take {payment_methods}. Please take out anything valuable before drop-off. If anything changes, just text me."},{"id":"reminder","group":"Appointments","title":"Reminder (day before)","when":"The day before a confirmed appointment.","next_step":"Press 'Reminder sent' on the appointment.","text":"Hey {name}, quick reminder - drop-off is tomorrow ({appt_date}) at {appt_time} for the {appt_service}. Still good?"},{"id":"ready_pickup","group":"Appointments","title":"Car is ready","when":"When you finish the job.","next_step":"Mark the job completed and record payment.","text":"Your car's ready, {name}! Come by whenever works for you. Total is {appt_price} ({payment_methods})."},{"id":"reschedule","group":"Appointments","title":"They need to reschedule / cancel","when":"Keep it easy. Cancel the appointment in the app so the slot opens back up.","next_step":"Cancel the appointment (the slot re-opens automatically).","text":"No problem at all. Here's what else I have open:\n\n{open_times}\n\nJust let me know which one works."},{"id":"review_request","group":"After the job","title":"Review request (day after)","when":"The day after a completed, paid job. Ask once. Never offer anything in exchange, and never ask only happy customers.","next_step":"Press 'Review requested' on the lead.","text":"Thanks again for bringing your car in, {name}. If you have a minute, an honest review would really help a one-person shop like mine: {review_link}\n\nAnd if anything wasn't right, tell me directly - I'd rather fix it."},{"id":"referral_ask","group":"After the job","title":"Referral ask","when":"With a happy customer, a few days after the job.","next_step":"Log follow-up.","text":"Hey {name}, if you know anyone who needs their car cleaned, I'd really appreciate you passing my number along. Most of my customers come from people telling people."},{"id":"repeat_offer","group":"After the job","title":"Repeat booking (about 5 weeks later)","when":"Repeat follow-up date reached. No fake discounts - just a reminder.","next_step":"Press 'Repeat offer sent' (next reminder in 60 days).","text":"Hey {name}, it's been about a month since I did your car. If it's ready for another round, I've got a few drop-off times open:\n\n{open_times}\n\nSame prices: interior {price_interior}, exterior {price_exterior}, both {price_full}."},{"id":"group_recommendation","group":"Community groups","title":"Answering a \"Can anyone recommend a detailer?\" post","when":"When someone in a local group asks for a recommendation. Reply once; don't argue with other recommendations.","next_step":"Log the effort under facebook_group. If they message you, add them as a lead.","text":"I do detailing out of my garage in {area_line} - {business}. Drop-off only. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Happy to answer questions, feel free to message me."},{"id":"partner_intro","group":"Partnerships","title":"Intro to a local business (in person or via their public business contact)","when":"One personal message to a business's PUBLIC business contact. Never mass-send. If they don't answer, one follow-up max.","next_step":"Update the opportunity status to 'contacted' and set a follow-up date 7 days out.","text":"Hi, I'm {owner_first_name} - I run {business}, a small drop-off detailing shop in {area_line}. I'm reaching out to a few local businesses to see if you'd be open to me leaving a few flyers, or if your customers ever ask about car cleaning. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Totally fine if it's not a fit - thanks for reading."},{"id":"first_response","group":"Inquiries","title":"First response to a new inquiry","when":"The first reply to anyone who messages you. Fast and friendly.","next_step":"Tap \"I replied\" on the lead.","text":"Hey {name}, thanks for reaching out! I'd be glad to help. What kind of car is it, and are you thinking interior, exterior, or both? It's drop-off at my garage in {area_line}, and {turnaround_line}."},{"id":"pre_quote_questions","group":"Inquiries","title":"Questions to ask before quoting","when":"Before you give an exact price. Photos stop surprises at pickup.","next_step":"When they answer, send the quote.","text":"Happy to give you an exact price. A few quick questions:\n\n1. What's the year, make and model?\n2. Interior, exterior, or both?\n3. Any pet hair, stains or anything I should know about?\n4. Could you send 2-3 photos of the inside (front seats, back seat, floor)?\n\nThat way the price I give you is the price you pay."},{"id":"send_quote","group":"Inquiries","title":"Sending a quote","when":"Once you know the car and what they want.","next_step":"Use the Quote form on the lead, then follow up in a couple of days.","text":"Thanks {name}! For your car, the {service_label} would be {quote_price}. That's drop-off at my garage in {area_line}, {hours_line}, and {turnaround_line}. I take {payment_methods}.\n\nHere's what I have open:\n{open_times}\n\nWant me to hold one of those for you?"},{"id":"service_limits","group":"Inquiries","title":"Explaining what you don't offer","when":"When someone asks for a service you don't do yet.","next_step":"If that's all they wanted, mark the lead Lost with reason \"service not offered\".","text":"Thanks for asking, {name}. Right now I don't offer {excludes_line}. I'm drop-off only at my garage in {area_line}. What I do offer is interior ({price_interior}), exterior ({price_exterior}) or both ({price_full}). If that works for you, I'd be glad to help."},{"id":"payment_request","group":"After the job","title":"Requesting payment","when":"When a finished job still has a balance.","next_step":"Record the payment on the lead when it comes in.","text":"Hi {name}, thanks again for bringing your car in! Your total is {job_total} and the remaining balance is {balance}. You can pay with {payment_methods}. Let me know if you have any questions."},{"id":"booking_terms","group":"Appointments","title":"Booking terms","when":"Send with a confirmation if you want customers to know your policies up front. Review your policies first (More > Policies & readiness).","next_step":"Confirm the appointment.","text":"A few quick notes before your drop-off:\n\n- {policy_deposit}\n- {policy_cancel}\n- {policy_late}\n- {policy_belongings}\n- {policy_condition}\n\nThanks, {name}. See you soon!"},{"id":"reconnect","group":"After the job","title":"Reconnecting with a past customer","when":"Someone you detailed a while ago. Only people who've done business with you.","next_step":"Tap \"Reconnect message sent\" on the lead.","text":"Hi {name}, it's been a little while since I detailed your car. If it's ready for another round, here's what I have open:\n\n{open_times}\n\nSame prices as before. No pressure at all."}]</script>
<script type="application/json" id="d-plan">{"normal":[{"day":1,"theme":"Show up","content":"Publish one post from your Nextdoor Business Page (Marketing agent has posts ready to copy).","acquisition":"Pin flyers at 2 places with a public board (laundromat, library). Ask first.","followup":"Reply to every New Lead. Then clear anything on 'Follow-ups due'.","optional":"Take 5 minutes of close-up photos or video on your next job for later posts."},{"day":2,"theme":"Be findable","content":"No post today. Check your Nextdoor page: hours, prices and photos are correct.","acquisition":"Answer every Nextdoor message within the hour if you can. Add each one as a lead (source: nextdoor).","followup":"Send any 'no reply - first nudge' messages that are due.","optional":"Look at one nearby detailer's prices so you know where you stand."},{"day":3,"theme":"Neighbors","content":"Publish one Nextdoor Business Page post (a before/after if you have one).","acquisition":"Check Nextdoor Groups you've joined: only post the business where the group's rules allow it.","followup":"Follow-ups due today.","optional":"Drop 5-10 flyers at one more public board."},{"day":4,"theme":"Partners","content":"No post needed today.","acquisition":"Visit ONE local business in person (tire shop, repair shop, used-car lot) with flyers. Use the partner intro template. Record it in Prospecting.","followup":"Check every Quote Sent lead - send the quote follow-up if it's been 2+ days.","optional":"Add your real open drop-off times for next week on the Book tab."},{"day":5,"theme":"Fill the week","content":"If you have REAL open slots, post 'Open drop-off times this week' on Nextdoor with those exact times.","acquisition":"Text past customers whose repeat date has arrived (repeat offer template). Only people who've done business with you.","followup":"Send reminders for tomorrow's appointments.","optional":"Ask one happy customer to Fave you on Nextdoor."},{"day":6,"theme":"Work day","content":"Use the Work tab on every car. Take before/after photos at the same spots.","acquisition":"Ask today's customers if it's okay to post photos of their car (plate blurred), and to Fave you on Nextdoor.","followup":"Review / Fave requests for yesterday's completed jobs.","optional":"Read your Work tab 'biggest time sink' and focus on it next job."},{"day":7,"theme":"Review","content":"No posting required. Read this week's Marketing agent brief.","acquisition":"Open the Weekly report. Do more of what brought inquiries; drop what took time and brought nothing.","followup":"Mark anyone who hasn't replied after 2 follow-ups as Lost. Save a backup file (More > Setup).","optional":"Log any marketing time you forgot to record this week."}],"cash_mode":["1. Reply to every New Lead right now. Speed wins most small jobs.","2. Send every follow-up due today (quote follow-ups first - they already know the price).","3. Add your REAL open drop-off slots for the next 7 days on the Book tab.","4. Text past customers whose repeat date is close (repeat offer template) - only people who've done business with you.","5. Ask 2-3 happy past customers for a referral and a Nextdoor Fave.","6. Post 'Open drop-off times this week' with your real open slots from your Nextdoor Business Page.","7. Walk 15 flyers to tire shops, laundromats and the library today. Ask before pinning.","8. Skip anything that doesn't lead to a message today."]}</script>

// ---------------------------------------------------------------- helpers
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const plusDays = (n, start) => { const d = start ? parse(start) : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fdate = (s) => { if (!s) return "-"; const d = parse(s); return `${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const ftime = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const money = (x) => "$" + (Number(x) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nice = (s) => String(s || "").replace(/_/g, " ");
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
class VErr extends Error {}
const need = (cond, msg) => { if (!cond) throw new VErr(msg); };
const num = (v, label) => { v = String(v == null ? "" : v).replace(/[$,\s]/g, ""); if (!v) return null; const n = Math.round(Number(v) * 100) / 100; need(isFinite(n) && n >= 0 && n <= 10000, `${label} must be a number like 80 or 80.00.`); return n; };
const clean = (v, max = 500) => String(v == null ? "" : v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").trim().slice(0, max);

function toast(msg, err) {

}

const S = { leads: new Map(), slots: new Map(), appts: new Map(), jobs: new Map(), posts: new Map(), opps: new Map(), effort: new Map(), timings: new Map(), briefs: new Map(), expenses: new Map(), experiments: new Map(), daily: new Map(), backups: new Map(), settings: {}, biz: {}, meta: {}, active: null, loaded: new Set() };
let db = null, readOnly = false;
// Every collection the app owns. Backups export and restore exactly these.
const COLS = ["leads", "slots", "appts", "jobs", "posts", "opps", "effort", "timings", "briefs", "expenses", "experiments", "daily"];
const CONFIG_DOCS = ["settings", "business", "meta"];

async function put(col, id, body) {
  if (!db) throw new VErr("Storage isn't connected. Reopen the link while signed in to Claude.");
  if (readOnly) throw new VErr("Only the owner can change this.");
  const data = JSON.parse(JSON.stringify(body)); delete data.id;
  await db.collection(col).doc(id).set(data);
  S[col].set(id, Object.assign({ id }, data)); // show it right away
}
const newId = (col) => db.collection(col).doc().id;
const all = (col) => Array.from(S[col].values());
const settings = () => S.settings || {};

// Business config = defaults deep-merged with what's saved. Saved values always win.
function merge(base, over) {
  if (Array.isArray(base) || Array.isArray(over)) return over !== undefined ? over : base;
  if (base && typeof base === "object") {
    const out = Object.assign({}, base);
    for (const k in (over || {})) out[k] = (base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) ? merge(base[k], over[k]) : over[k];
    return out;
  }
  return over !== undefined ? over : base;
}
let BIZ = merge(DEFAULT_BIZ, {});
const B = () => BIZ;
function includesFromSettings(key) { // old Setup text, split into a list
  return String(settings()[key] || "").split(",").map((s) => s.trim()).filter(Boolean)
    .filter((s) => !/spray wax|^wax|sealant protection/i.test(s)); // wax is an add-on, never included by default
}
function rebuildBiz() {
  BIZ = merge(DEFAULT_BIZ, S.biz || {});
  const sv = BIZ.services;
  if (!(S.biz.services && S.biz.services.interior && S.biz.services.interior.includes)) sv.interior.includes = includesFromSettings("interior_includes");
  if (!(S.biz.services && S.biz.services.exterior && S.biz.services.exterior.includes)) sv.exterior.includes = includesFromSettings("exterior_includes");
  const fallbackSupply = numOrNullSafe(settings().product_cost);
  for (const k of SVC_KEYS) {
    if (sv[k].supply == null && fallbackSupply != null && !(S.biz.services && S.biz.services[k] && "supply" in S.biz.services[k])) { sv[k].supply = fallbackSupply; sv[k].supplyEstimated = true; }
    Object.assign(SERVICES[k], { label: sv[k].label, price: Number(sv[k].price) || 0 });
  }
}
function numOrNullSafe(v) { try { return numOrNull(v, "x"); } catch (_) { return null; } }
const maxPerDay = () => Math.max(1, parseInt(B().capacity.maxJobs, 10) || parseInt(settings().max_jobs_per_day, 10) || 1);
const addonById = (id) => B().addons.find((a) => a.id === id);
function sources() { return BASE_SOURCES.concat((B().channels || []).map((c) => c.key)); }
function srcLabel(k) { const c = (B().channels || []).find((x) => x.key === k); return c ? c.label : (SOURCE_LABELS[k] || nice(k)); }
async function saveBiz(patch) {

  await db.doc("config/business").set(JSON.parse(JSON.stringify(next)));
  S.biz = next; rebuildBiz();
}
async function saveMeta(patch) { if (!db) return; const next = Object.assign({}, S.meta, patch); await db.doc("config/meta").set(next); S.meta = next; }

// ---------------------------------------------------------------- text filling + checks
function values(extra) {
  const sv = B().services, pol = B().policies;
  const v = Object.assign({}, settings(), { business: BUSINESS });
  v.price_interior = "$" + SERVICES.interior.price; v.price_exterior = "$" + SERVICES.exterior.price; v.price_full = "$" + SERVICES.full.price;
  v.interior_includes = (sv.interior.includes || []).join(", ").toLowerCase() || settings().interior_includes || "";
  v.exterior_includes = (sv.exterior.includes || []).join(", ").toLowerCase() || "";
  const priced = B().addons.filter((a) => a.price != null).map((a) => `${a.name} $${a.price}`);
  v.addons_line = B().addons.length ? (priced.length ? priced.join(", ") : B().addons.map((a) => a.name).join(", ") + " (ask for a price)") : "";
  v.excludes_line = "paint correction, polishing, full ceramic coatings, carpet extraction or mobile service";
  for (const k in pol) v["policy_" + k] = String(pol[k] || "").replace(/^DRAFT[^:]*:\s*/i, "");
  return Object.assign(v, extra || {});
}
function fill(text, extra) {
  const v = values(extra);
  return String(text || "").replace(/\{(\w+)\}/g, (m, k) => (v[k] ? String(v[k]) : `[SET ${k.toUpperCase()} IN SETUP]`));
}
const negateMobile = (t) => String(t || "").toLowerCase().replace(/(not|no|isn't|aren't|don't do|can't do|don't offer)\s+(a\s+)?mobile/g, "");
function banned(text) {
  const low = negateMobile(text);
  return BANNED.filter((p) => new RegExp("(^|[^a-z])" + p.replace(/[.*+?^${}()|[\]\\#]/g, "\\$&") + "(?![a-z])").test(low));
}
function postView(base) {
  const o = S.posts.get(base.id) || {};
  const p = Object.assign({}, base, { status: o.status || "draft", approved: o.approved || null, scheduled: o.scheduled || null, published: o.published || null, where: o.where || "", notes: o.notes || "" });
  for (const f in POST_FIELDS) if (o.edits && typeof o.edits[f] === "string") p[f] = o.edits[f];
  return p;
}
function postProblems(p) {
  const allow = String(p.allow_terms || "").split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const out = [];
  for (const f in POST_FIELDS) {
    if (!p[f]) continue;
    const t = fill(p[f]);
    const miss = Array.from(new Set((t.match(/\[SET (\w+) IN SETUP\]/g) || []).map((m) => m.slice(5, -9).toLowerCase())));
    if (miss.length) out.push(`${POST_FIELDS[f]}: fill in Setup first (${miss.join(", ")})`);
    if (t.includes("[TYPE")) out.push(`${POST_FIELDS[f]}: replace the [TYPE ...] parts with real details`);
    const c = banned(t).filter((x) => !allow.includes(x));
    if (c.length) out.push(`${POST_FIELDS[f]}: has a claim you haven't confirmed (${c.join(", ")})`);
  }
  return out;
}
function openSlots(daysAhead) {
  const t = today(), end = plusDays(daysAhead || 14);
  return all("slots").filter((s) => s.status === "open" && s.date >= t && s.date <= end).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function openTimesText() {
  const s = openSlots(14).slice(0, 5);
  return s.length ? s.map((x) => `- ${fdate(x.date)}, drop-off ${ftime(x.time)}`).join("\n") : "[NO OPEN SLOTS ENTERED - ADD REAL SLOTS ON THE BOOK TAB FIRST]";
}
const replyText = (t) => (B().replyOverrides && typeof B().replyOverrides[t.id] === "string" ? B().replyOverrides[t.id] : t.text);
function renderReply(id, lead, appt, job) {
  const t = REPLIES.find((r) => r.id === id); if (!t) return "";
  const extra = { open_times: openTimesText(), name: lead && lead.name ? lead.name.split(/\s+/)[0].replace(/[{}]/g, "") : "there" };
  const svc = (appt && appt.service) || (lead && lead.service);
  extra.service_label = SERVICES[svc] ? SERVICES[svc].label.toLowerCase() : "cleaning";
  if (lead && lead.quote != null) extra.quote_price = "$" + lead.quote;
  if (appt) {
    const sl = S.slots.get(appt.slot) || {};
    Object.assign(extra, { appt_date: fdate(sl.date), appt_time: ftime(sl.time), appt_service: SERVICES[appt.service].label, appt_price: "$" + appt.price });
    if (appt.addons && appt.addons.length) extra.appt_service += " + " + appt.addons.map((x) => (addonById(x) || { name: x }).name).join(", ");
  }
  if (job) { const e = jobEcon(job); extra.balance = money(e.balance); extra.job_total = money(e.revenue); }
  return fill(replyText(t), extra);
}

// ---------------------------------------------------------------- lead logic
const ev = (lead, type, note, d) => { lead.events = (lead.events || []).concat([{ d: d || today(), t: type, n: clean(note, 200) }]).slice(-80); };
function status(l) { // Follow-up due is shown from the date; nothing is written in the background
  if (["Replied", "Quote Sent", "Contacted"].includes(l.status) && l.next && l.next <= today()) return "Follow-Up Due";
  return l.status;
}
const overdueDays = (l) => (l.next && l.next < today() && OPEN_STATUSES.includes(l.status) ? dayDiff(l.next, today()) : 0);
function hoursWaiting(l) { const t = l.created ? Date.parse(l.created) : parse(l.inquiry || today()).getTime(); return Math.max(0, (Date.now() - t) / 36e5); }
function leadFromForm(f, base) {
  const l = Object.assign({}, base || {});
  l.name = clean(f.name, 120); need(l.name, "Name or nickname is required.");
  l.method = METHODS.includes(f.method) ? f.method : "text";
  l.contact = clean(f.contact, 200); l.consent = f.consent === "on"; l.consentNote = clean(f.consentNote, 200);
  need(sources().includes(f.source), "Pick where they found you.");
  l.source = f.source; l.sourceDetail = clean(f.sourceDetail, 200); l.vehicle = clean(f.vehicle, 120);
  l.size = SIZES[f.size] ? f.size : (l.size || ""); l.condition = CONDITIONS[f.condition] ? f.condition : (l.condition || "");
  l.service = SERVICE_CHOICES.includes(f.service) ? f.service : "unsure";
  l.quote = num(f.quote, "Quoted price"); l.notes = clean(f.notes, 2000);
  l.nextAction = clean(f.nextAction, 200);
  return l;
}
function findDuplicates(f, exceptId) {
  const d = digits(f.contact), nm = clean(f.name, 120).toLowerCase();
  return all("leads").filter((l) => l.id !== exceptId && ((d.length >= 7 && digits(l.contact) === d) || (nm && (l.name || "").toLowerCase() === nm && (!d || digits(l.contact) === d))));
}
async function createLead(f) {
  const outbound = f.mode === "outbound";
  const d = isDate(f.date) ? f.date : today();
  need(d <= today(), "That date can't be in the future.");
  const dups = findDuplicates(f);
  need(!dups.length || f.dupok === "on", `Looks like you already have ${dups.map((x) => x.name).join(", ")} with the same name or number. Open that lead instead, or tick "This is a different person".`);
  const l = leadFromForm(f);
  Object.assign(l, { created: new Date().toISOString(), events: [], followups: 0 });
  if (outbound) {
    Object.assign(l, { status: f.contacted === "on" ? "Contacted" : "Identified", firstContact: f.contacted === "on" ? d : null, inquiry: null, next: plusDays(f.contacted === "on" ? B().sla.followupGapDays : 0, d) });
    ev(l, f.contacted === "on" ? "contacted" : "identified", "outreach via " + l.source, d);
  } else {
    Object.assign(l, { status: "New Lead", inquiry: d, firstContact: d, next: d });
    ev(l, "inquiry", "via " + l.source, d);
  }
  const id = newId("leads"); await put("leads", id, l); return id;
}
async function leadAct(id, fn) { const cur = S.leads.get(id); need(cur, "That lead is gone."); const l = JSON.parse(JSON.stringify(cur)); fn(l); await put("leads", id, l); }

// ---------------------------------------------------------------- booking logic
async function addSlot(f) {
  need(isDate(f.date), "Pick a date."); need(f.date >= today(), "You can't open a slot in the past.");
  need(/^\d{2}:\d{2}$/.test(f.time || ""), "Pick a drop-off time.");
  if (f.pickup) need(f.pickup > f.time, "Pick-up has to be after drop-off.");
  need(!all("slots").some((s) => s.date === f.date && s.time === f.time && s.status !== "closed"), "You already have a slot at that time.");
  const wd = parse(f.date).getDay();
  need(B().capacity.workDays.includes(wd) || f.offday === "on", `${DAYS[wd]} isn't one of your work days (Services & prices > Capacity). Tick "I'm working that day" to add it anyway.`);
  await put("slots", newId("slots"), { date: f.date, time: f.time, pickup: f.pickup || "", status: "open", note: clean(f.note, 200) });
}
const liveAppts = () => all("appts").filter((a) => a.status === "proposed" || a.status === "confirmed");
const apptDate = (a) => (S.slots.get(a.slot) || {}).date || "";
function quoteFor(service, addons, condition, override) {
  // Price the customer agrees to: service + add-ons + condition adjustment. Unknown prices must be typed in.
  const sv = B().services[service]; need(sv, "Pick a service.");
  const missing = [];
  let total = Number(sv.price) || 0, minutes = Number(sv.minutes) || 0;
  for (const id of addons) { const a = addonById(id); if (!a) continue; if (a.price == null) missing.push(a.name); else total += Number(a.price); minutes += Number(a.minutes) || 0; }
  const adj = B().condition[condition];
  if (condition === "heavy") { minutes = Math.round(minutes * 1.4); if (adj == null) missing.push("heavy-condition extra"); else total += Number(adj); }
  else if (adj) total += Number(adj);
  const ov = num(override, "Agreed price");
  if (ov != null) return { price: ov, minutes, missing: [], computed: r2(total) };
  need(!missing.length, `No price set for: ${missing.join(", ")}. Type the agreed price, or set prices in More > Services & prices.`);
  return { price: r2(total), minutes, missing, computed: r2(total) };
}
function dayLoad(date, exceptId) {
  const as = liveAppts().filter((a) => a.id !== exceptId && apptDate(a) === date);
  return { jobs: as.length, minutes: as.reduce((s, a) => s + (Number(a.minutes) || Number(B().services[a.service].minutes) || 0), 0) };
}
async function propose(leadId, slotId, f) {
  const slot = S.slots.get(slotId); need(slot, "Pick one of your open slots.");
  need(slot.status === "open", "That slot is no longer open."); need(slot.date >= today(), "That slot is in the past.");
  need(SERVICES[f.service], "Pick a service.");
  const lead = S.leads.get(leadId); need(lead, "That lead is gone.");
  const addons = B().addons.filter((a) => f["addon_" + a.id] === "on").map((a) => a.id);
  const condition = CONDITIONS[f.condition] ? f.condition : (lead.condition || "medium");
  const q = quoteFor(f.service, addons, condition, f.price || (lead.quote != null && lead.service === f.service && !addons.length ? lead.quote : ""));
  const load = dayLoad(slot.date), cap = B().capacity;
  need(load.jobs < maxPerDay(), `You already have ${load.jobs} car(s) that day - your daily max of ${maxPerDay()}. Change it in Services & prices > Capacity if you really can take another.`);
  need(load.minutes + q.minutes <= cap.hoursPerDay * 60 || f.overtime === "on", `That day would need about ${Math.round((load.minutes + q.minutes) / 60 * 10) / 10} hours but you set ${cap.hoursPerDay}. Tick "I can work longer that day" to book anyway.`);
  await put("appts", newId("appts"), { lead: leadId, slot: slotId, service: f.service, addons, condition, vehicle: clean(f.vehicle || lead.vehicle, 120), size: lead.size || "", price: q.price, minutes: q.minutes, status: "proposed", terms: values().policy_deposit || "", created: new Date().toISOString() });
  await put("slots", slotId, Object.assign({}, slot, { status: "held" }));
  await leadAct(leadId, (l) => { l.quote = q.price; l.service = f.service; l.condition = condition; l.next = plusDays(1); ev(l, "time_offered", `${slot.date} ${slot.time} ${money(q.price)}`); });
}
async function confirmAppt(aid) {
  const a = S.appts.get(aid); need(a && a.status === "proposed", "Only a held time can be confirmed.");
  const slot = S.slots.get(a.slot); need(slot, "That time slot is missing.");
  const others = liveAppts().filter((x) => x.id !== aid && x.slot === a.slot && x.status === "confirmed");
  need(!others.length, "Another customer is already confirmed in that slot.");
  await put("appts", aid, Object.assign({}, a, { status: "confirmed", confirmed: today() }));
  await put("slots", a.slot, Object.assign({}, slot, { status: "booked" }));
  await leadAct(a.lead, (l) => { l.status = "Booked"; l.lastContact = today(); l.next = slot.date > today() ? plusDays(-1, slot.date) : slot.date; l.nextAction = "Send reminder the day before"; ev(l, "booked", `${slot.date} ${slot.time} ${a.service}`); });
}
async function recordDeposit(aid, f) {
  const a = S.appts.get(aid); need(a && (a.status === "proposed" || a.status === "confirmed"), "Deposits go on an upcoming appointment.");
  const amt = num(f.amount, "Deposit"); need(amt && amt > 0, "Enter the deposit amount."); need(amt <= a.price, "Deposit is more than the agreed price.");
  need(PAY.includes(f.method), "Pick how they paid.");
  await put("appts", aid, Object.assign({}, a, { deposit: { d: today(), a: amt, m: f.method } }));
  await leadAct(a.lead, (l) => ev(l, "deposit", `$${amt} ${f.method}`));
}
async function cancelAppt(aid, noShow, f) {
  f = f || {};
  const a = S.appts.get(aid); need(a && (a.status === "proposed" || a.status === "confirmed"), "That appointment can't be cancelled.");
  const slot = S.slots.get(a.slot), reason = clean(f.reason, 200);
  await put("appts", aid, Object.assign({}, a, { status: noShow ? "no_show" : "cancelled", notes: reason, depositOutcome: a.deposit ? (f.keep === "on" ? "kept" : "refunded") : "" }));
  if (slot) await put("slots", a.slot, Object.assign({}, slot, { status: slot.date >= today() ? "open" : "closed" }));

    await put("jobs", newId("jobs"), { appt: aid, lead: a.lead, date: today(), service: a.service, kind: "cancellation_fee", price: a.deposit.a, discount: 0, payments: [a.deposit], refunds: [], supplies: 0, suppliesActual: true, laborHours: 0, laborActual: true, otherCost: 0, notes: "Deposit kept per policy" });
  }
  await leadAct(a.lead, (l) => { l.status = "Follow-Up Due"; l.next = plusDays(2); ev(l, noShow ? "no_show" : "cancelled", reason); });
}

// ---------------------------------------------------------------- job costing
const sumA = (arr) => r2((arr || []).reduce((s, p) => s + (Number(p.a) || 0), 0));
function feeFor(p) { const pctFee = B().costs.fees[p.m]; return pctFee == null ? null : r2(p.a * pctFee / 100); }
function jobEcon(j) {
  const discount = Number(j.discount) || 0, refunds = sumA(j.refunds), paidIn = sumA(j.payments);
  const revenue = r2((Number(j.price) || 0) - discount - refunds);
  const netPaid = r2(paidIn - refunds);
  const balance = r2(Math.max(0, revenue - netPaid));
  const feeList = (j.payments || []).map(feeFor);
  const fees = feeList.includes(null) ? null : r2(feeList.reduce((s, x) => s + x, 0));
  const missing = [], estimated = [];
  if (j.supplies == null) missing.push("supply cost"); else if (!j.suppliesActual) estimated.push("supplies");
  if (fees == null) missing.push("payment fee % for " + Array.from(new Set((j.payments || []).filter((p) => feeFor(p) == null).map((p) => payLabel(p.m)))).join(", "));
  const direct = j.supplies == null || fees == null ? null : r2(Number(j.supplies) + (Number(j.otherCost) || 0) + fees);
  const contribution = direct == null ? null : r2(revenue - direct);
  const rate = B().costs.ownerRate, hours = j.laborHours == null ? null : Number(j.laborHours);
  if (hours == null) missing.push("labor hours"); else if (!j.laborActual) estimated.push("labor hours");
  if (rate == null) missing.push("your hourly labor value (Money > Cost settings)");
  const labor = hours == null || rate == null ? null : r2(hours * rate);
  const ohm = B().costs.overheadMonthly;
  let overhead = null;
  if (ohm != null) { const [ms, me] = monthBounds(j.date); const n = all("jobs").filter((x) => x.date >= ms && x.date <= me && x.kind !== "cancellation_fee").length || 1; overhead = j.kind === "cancellation_fee" ? 0 : r2(ohm / n); }
  else missing.push("monthly overhead (enter 0 if none)");
  const profit = contribution == null || labor == null || overhead == null ? null : r2(contribution - labor - overhead);
  const st = revenue <= 0 && refunds > 0 ? "refunded" : netPaid >= revenue && revenue > 0 ? "paid" : netPaid > 0 ? "partial" : "unpaid";
  return { revenue, discount, refunds, paidIn, netPaid, balance, fees, direct, contribution, labor, overhead, profit, hours, missing, estimated, status: st, complete: !missing.length, actual: !missing.length && !estimated.length };
}
function jobStatus(j) { return jobEcon(j).status; }
function timingFor(apptId) { return all("timings").find((t) => t.appt && t.appt === apptId); }
function supplyEstimate(service, addons) {
  const sv = B().services[service]; if (!sv || sv.supply == null) return null;
  let s = Number(sv.supply);
  for (const id of addons || []) { const a = addonById(id); if (a && a.supply != null) s += Number(a.supply); }
  return r2(s);
}
async function completeJob(aid, f) {
  const a = S.appts.get(aid); need(a && a.status === "confirmed", "Only a confirmed appointment can be completed.");
  need(!all("jobs").some((j) => j.appt === aid && j.kind !== "cancellation_fee"), "This appointment already has a completed job.");
  let price = num(f.price, "Price charged"); if (price == null) price = a.price; need(price > 0, "Price charged must be more than $0.");
  const discount = num(f.discount, "Discount") || 0; need(discount <= price, "Discount can't be more than the price.");
  const paidNow = num(f.paid, "Amount paid") || 0;
  need(!paidNow || PAY.includes(f.method), "Pick how they paid.");
  const payments = []; if (a.deposit) payments.push(a.deposit); if (paidNow) payments.push({ d: isDate(f.date) ? f.date : today(), a: paidNow, m: f.method });
  need(sumA(payments) <= price - discount + 0.001, "Payments are more than the price after discount. Put tips in notes.");
  const date = isDate(f.date) ? f.date : today(); need(date <= today(), "Completed date can't be in the future.");
  const service = SERVICES[f.service] ? f.service : a.service;
  const supplies = numOrNull(f.supplies, "Supplies used", 2000);
  const hours = numOrNull(f.hours, "Labor hours", 24);
  const t = timingFor(aid);
  const job = { appt: aid, lead: a.lead, date, service, addons: a.addons || [], condition: a.condition || "", price, discount, payments, refunds: [],
    supplies, suppliesActual: f.suppliesActual === "on", laborHours: hours, laborActual: f.hoursActual === "on" || (!!t && hours != null && Math.abs(hours - t.total / 3600) < 0.05),
    otherCost: numOrNull(f.other, "Other costs", 2000) || 0, photosBefore: f.photosBefore === "on", photosAfter: f.photosAfter === "on", qc: f.qc === "on", outcome: clean(f.outcome, 200), notes: clean(f.notes, 500) };
  await put("jobs", newId("jobs"), job);
  await put("appts", aid, Object.assign({}, a, { status: "completed" }));
  const e = jobEcon(job);

function pill(s) {

  return `<span class="pill ${k}">${esc(nice(s))}</span>`;
}

  const unpaid = all("jobs").filter((j) => jobEcon(j).balance > 0);

</div>

function journey(l) {
  const jobs = realJobs().filter((j) => j.lead === l.id);
  const paid = jobs.some((j) => jobEcon(j).status === "paid");
  const stages = [["Contacted", hasEv(l, "contacted") || hasEv(l, "inquiry")], ["Inquiry", !!l.inquiry], ["Replied", hasEv(l, "reply_sent") || hasEv(l, "quote_sent")], ["Quote", hasEv(l, "quote_sent")], ["Booked", hasEv(l, "booked")], ["Done", jobs.length > 0], ["Paid", paid], ["Review", !!l.reviewReq], ["Repeat", jobs.length > 1]];
  return `<div class="journey">${stages.map(([n, on]) => `<span class="${on ? "on" : ""}">${esc(n)}</span>`).join("")}</div>`;
}

<div class="btns">${l.reviewReq ? `<span class="hint">Review asked ${esc(fdate(l.reviewReq))}</span>` : `<button class="small" data-act="reviewreq" data-id="${id}">Review request sent</button>`}${l.reviewGot ? `<span class="hint">Review received ✓</span>` : `<button class="small ghost" data-act="reviewgot" data-id="${id}">They left a review</button>`}<button class="small ghost" data-act="repeat" data-id="${id}">Reconnect message sent</button></div><p class="hint">Next reconnect reminder: ${esc(fdate(l.repeat))}</p></div>` : "";

function vMoney() {

  const be = costs.overheadMonthly != null && mm.contribution != null && mm.contribN ? Math.ceil(costs.overheadMonthly / Math.max(1, mm.contribution / mm.contribN)) : null;
  const cf = cashFlow(8);
  const exps = all("expenses").sort((x, y) => y.date.localeCompare(x.date)).slice(0, 20);
  const profitLabel = m.profit == null ? "Profit: not enough cost data" : m.allActual ? "Profit (actual)" : "Profit (estimate)";
  return `${back("more", "More")}<h1>Money & profit</h1>${periodChips(period)}
<div class="nums tiles"><div><b>${money(m.collected)}</b><span>collected (after refunds)</span></div><div><b>${money(m.owed)}</b><span>still owed to you (all time)</span></div><div><b>${money(m.revenue)}</b><span>earned from ${m.jobs} job(s)</span></div><div><b>${dollars(m.avgJob)}</b><span>average job</span></div><div><b>${m.avgHours == null ? "-" : m.avgHours + "h"}</b><span>average job time</span></div><div><b>${dollars(m.revPerHour)}</b><span>revenue per labor hour</span></div></div>
<div class="card"><h2>Profit</h2><dl class="kv"><dt>After job costs (supplies, fees, other)</dt><dd>${m.contribution == null ? "-" : money(m.contribution)} <span class="hint">${m.contribN} of ${m.jobs} job(s) have enough data</span></dd>
<dt>${esc(profitLabel)}</dt><dd>${m.profit == null ? "-" : money(m.profit)} <span class="hint">after your labor value and overhead</span></dd><dt>Profit per labor hour</dt><dd>${dollars(m.profitPerHour)}</dd></dl>
${m.missing.length ? `<p class="hint"><b>Missing for true profit:</b> ${esc(m.missing.join("; "))}.</p>` : m.jobs && m.allActual ? `<p class="hint">All jobs in this period have complete, actual cost data.</p>` : m.jobs ? `<p class="hint"><b>Estimate:</b> some numbers are estimates (${esc(Array.from(new Set(m.econ.flatMap((e) => e.estimated))).join(", "))}). Mark them actual on each job once you know them.</p>` : ""}
<p class="hint">"After job costs" is cash left from the jobs. Profit also subtracts what your own time is worth and your overhead, so it isn't confused with take-home cash.</p></div>
<div class="card"><h2>This month vs targets</h2><dl class="kv"><dt>Collected this month</dt><dd>${money(mm.collected)}</dd><dt>Revenue target</dt><dd>${target ? money(target) + " · " + pct(mm.collected, target) + " reached" : `<a href="#" ${go("growth")}>Set a target</a>`}</dd><dt>Break-even</dt><dd>${costs.overheadMonthly === 0 ? "No monthly overhead entered (0), so every job's after-cost amount goes toward your pay." : be != null ? `${be} job(s) a month cover ${money(costs.overheadMonthly)} overhead (at your average after-cost amount per job)` : "Needs monthly overhead and at least one job with complete costs"}</dd></dl></div>
