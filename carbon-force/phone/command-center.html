<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; cards only for actionable groups. */
:root {
  --bg: #eef0f2; --surface: #ffffff; --sunk: #e3e6ea; --fg: #16191d; --muted: #5b636d; --line: #d3d8de;
  --accent: #2446a6; --accent-fg: #ffffff; --ok: #1d7a43; --warn: #9a5b00; --bad: #b3261e;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111316; --surface: #1b1e23; --sunk: #24282e; --fg: #e9ecef; --muted: #9aa3ad; --line: #30353c;
  --accent: #8aa6ff; --accent-fg: #0d1430; --ok: #5cc887; --warn: #f0a845; --bad: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1b1e23; --sunk: #24282e; --fg: #e9ecef; --muted: #9aa3ad; --line: #30353c;
  --accent: #8aa6ff; --accent-fg: #0d1430; --ok: #5cc887; --warn: #f0a845; --bad: #ff8a80; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line) }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase }
.brand small { display: block; font: 500 12px/1.3 var(--body); color: var(--muted); text-transform: none; letter-spacing: 0 }
.sync { font-size: 12px; color: var(--muted) }
h1 { font: 700 28px/1.1 var(--display); margin: 6px 0 0; text-wrap: balance; letter-spacing: .01em }
h2 { font: 700 19px/1.2 var(--display); margin: 0 0 8px; letter-spacing: .02em; text-transform: uppercase }
h3 { font-size: 15px; margin: 12px 0 4px }
p { margin: 0 0 8px }
.muted, .hint { color: var(--muted) } .hint { font-size: 13px; display: block; font-weight: 400; margin-top: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }
.card.warn { box-shadow: inset 4px 0 0 var(--warn) } .card.bad { box-shadow: inset 4px 0 0 var(--bad) } .card.ok { box-shadow: inset 4px 0 0 var(--ok) }
.stack { display: flex; flex-direction: column; gap: 14px }
.row { display: flex; flex-wrap: wrap; gap: 8px }
.row > * { flex: 1 1 140px; min-width: 0 }
ul.list { list-style: none; padding: 0; margin: 0 }
ul.list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
ul.list li:last-child { border-bottom: 0 }
ul.list .main { min-width: 0; flex: 1 }
ol.todo { margin: 0; padding-left: 22px } ol.todo li { margin: 6px 0 }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap }
.p-warn { color: var(--warn) } .p-ok { color: var(--ok) } .p-bad { color: var(--bad) } .p-mute { color: var(--muted) }
.p-solid { background: var(--ok); color: var(--surface); border-color: var(--ok) }
.big { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.nums div { background: var(--sunk); border-radius: 8px; padding: 10px }
.nums b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums }
.nums span { font-size: 13px; color: var(--muted) }
label { display: block; font-weight: 600; font-size: 14px }
input, select, textarea { display: block; width: 100%; margin-top: 4px; padding: 10px; font: 16px var(--body);
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px }
textarea { min-height: 120px; resize: vertical }
input[type=checkbox] { display: inline-block; width: 20px; height: 20px; margin: 0 8px 0 0; vertical-align: middle }
form.f { display: flex; flex-direction: column; gap: 10px }
button, .btn { font: 600 15px var(--body); border-radius: 8px; padding: 11px 14px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-fg); cursor: pointer; text-decoration: none; display: inline-block; text-align: center }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line) }
button.small { padding: 7px 10px; font-size: 14px }
button.danger { background: transparent; color: var(--bad); border-color: var(--bad) }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btns { display: flex; flex-wrap: wrap; gap: 8px }
a { color: var(--accent) }
a.rowlink { color: var(--fg); font-weight: 600; text-decoration: none }
.copy { position: relative; margin: 6px 0 4px }
.copy pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; font: 15px/1.45 var(--body); background: var(--sunk);
  border-radius: 8px; padding: 12px 12px 48px }
.copy button { position: absolute; right: 8px; bottom: 8px }
details { border-top: 1px solid var(--line); padding: 8px 0 }
details:first-of-type { border-top: 0 }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; list-style-position: outside }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px }
.chips button { flex: 0 0 auto; padding: 6px 12px; font-size: 14px; background: var(--surface); color: var(--fg); border-color: var(--line); border-radius: 99px }
.chips button.on { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.tablewrap { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: transparent; border: 0; color: var(--muted); padding: 8px 2px; font-size: 12px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8 }
nav.tabs button.on { color: var(--accent) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: calc(100% - 32px); font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.2) }
.toast.err { background: var(--bad); color: #fff }
.back { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 600 }
.morelist button { width: 100%; text-align: left; background: var(--surface); color: var(--fg); border-color: var(--line); padding: 14px }
.empty { color: var(--muted); padding: 6px 0 }
.timer { font: 700 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .02em }
.timer.over { color: var(--warn) }
.stepname { font: 700 30px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--accent) }
button.huge { width: 100%; padding: 18px; font-size: 19px }
.confirm { background: var(--sunk); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<script type="application/json" id="d-posts">[{"title":"We're open: what I do and what it costs","pillar":"launch","purpose":"Tell people the business exists, what it costs, and that it's drop-off.","platform":"Facebook Page + local groups (where allowed)","format":"photo post","cta":"Message or text to book","visual":"Your existing logo or flyer as the first image, plus 1-2 real photos of a car you cleaned (no faces, no plates).","shots":"- Flyer laid flat on a clean dash or hood\n- Wide shot of your garage setup (tidy, no house numbers visible)","facebook":"{business} is officially taking cars.\n\nI'm a one-person detailing shop working out of my garage in {area_line}. You drop the car off, I clean it, you pick it up. Simple.\n\nInterior: {price_interior}\nExterior: {price_exterior}\nInside and out: {price_full}\n\nNo packages with 14 add-ons, no surprise fees. If your car needs something I don't do, I'll tell you up front.\n\n{booking_line}.","instagram":"New in Melrose Park. One person, one garage, clean cars.\n\nInterior {price_interior} / Exterior {price_exterior} / Both {price_full}\nDrop-off only. {booking_line}.\n\n#melrosepark #cardetailing #westsuburbs","story":"Frame 1: Logo on black.\nFrame 2: 'Interior {price_interior} / Exterior {price_exterior} / Both {price_full}'\nFrame 3: 'Drop-off in {area_line}. DM to book.' + link sticker or DM prompt","group_version":"Hi neighbors - hope this is okay to share (checked the group rules first).\n\nI just started {business}, a small detailing setup out of my garage in {area_line}. It's drop-off: you leave the car with me, pick it up when it's done.\n\nInterior {price_interior}, exterior {price_exterior}, or both for {price_full}.\n\nIf you've been meaning to deal with your car, I'd be glad to help. {booking_line}.","season":"any","needs_real_photos":false,"reel_script":"","allow_terms":"","day":1,"id":"d01-open-for-business"},{"title":"The whole price list in one post","pillar":"pricing","purpose":"Answer 'how much' before people have to ask; the post to pin.","platform":"Facebook Page (pin it) + Instagram feed","format":"graphic or flyer photo","cta":"Text to book","visual":"Your existing flyer, or a plain text graphic in your brand colors with the three prices.","shots":"- Straight-on photo of the flyer in good daylight\n- Optional: flyer on a car seat you just cleaned","facebook":"Pinning this so nobody has to ask.\n\nInterior detail - {price_interior}\n{interior_includes}\n\nExterior cleaning - {price_exterior}\n{exterior_includes}\n\nInside + out - {price_full}\n\nDrop-off only, {area_line}. {hours_line}.\n{booking_line}.","instagram":"Prices, no DM-for-price games.\n\nInterior {price_interior}\nExterior {price_exterior}\nFull package {price_full}\n\nDrop-off in Melrose Park. {booking_line}.","story":"Single frame: the price graphic. Add a 'Questions?' sticker.","season":"any","needs_real_photos":false,"reel_script":"","group_version":"","allow_terms":"","day":2,"id":"d02-price-menu"},{"title":"Do you come to me? (No - here's why that's fine)","pillar":"faq","purpose":"Set the drop-off expectation clearly so you don't waste time on mobile requests.","platform":"Facebook Page","format":"text post with one garage photo","cta":"Ask about drop-off times","visual":"Photo of your garage workspace, lights on, car pulled in. No address visible.","shots":"- Garage door half-open with a car inside\n- Close-up of your supplies on a shelf","allow_terms":"mobile","facebook":"Quick one because a few people have asked: I'm not mobile. I don't come to your house.\n\nEverything I use is set up in my garage, so the car comes to me. Drop it off, go about your day, come back to a clean car.\n\nIf you're in or near Melrose Park, that's usually an easy trip. {hours_line}.\n\n{booking_line}.","instagram":"Not mobile - drop-off only.\n\nMy setup lives in the garage, so the car comes here. {area_line}.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","day":3,"id":"d03-do-you-come-to-me"},{"title":"Reel: what's under your seats","pillar":"process","purpose":"Satisfying faceless video that shows real work and stops the scroll.","platform":"Instagram Reel + Facebook Reel","format":"15-25s reel, no voice","needs_real_photos":true,"cta":"DM to book an interior","visual":"Real vacuum footage from under a seat and between seat and console.","shots":"- Phone low, pointing under the seat, slide seat forward\n- Vacuum nozzle pass, slow\n- Same spot after, clean\n- Keep hands only in frame","reel_script":"0-2s  Seat slides forward, revealing what's under it. Text: \"Nobody looks under here.\"\n2-8s  Vacuum crevice tool passes, close-up. Text: \"I do.\"\n8-14s Gap between seat and console. Text: \"This gap too.\"\n14-20s Clean after shot, same angle. Text: \"Interior {price_interior} - Melrose Park, drop-off\"\nAudio: trending instrumental or just the vacuum sound. No voice needed.","instagram":"The area under the seat is where fries go to retire.\n\nInterior {price_interior}, drop-off in Melrose Park. {booking_line}.","facebook":"Everybody has this spot. You just haven't looked.\n\nInterior {price_interior}. {booking_line}.","season":"any","story":"","group_version":"","allow_terms":"","day":4,"id":"d04-under-the-seats"},{"title":"Parents: the car seat zone","pillar":"everyday problem","purpose":"Speak directly to parents - a big local group with real messy cars.","platform":"Facebook Page + parent-friendly local groups (where allowed)","format":"photo post","cta":"Text to book an interior","visual":"Real photo of a cleaned back seat area (no car seat, no kids' items with names).","shots":"- Back seat floor after cleaning\n- Close-up of seat crease, clean","facebook":"If there's a car seat in your back row, you already know what's going on under it.\n\nCrumbs in the seat creases, juice on the floor mat, something sticky on the door you can't identify. That's normal. It's also exactly what an interior detail is for.\n\nInterior is {price_interior}. Drop it off at my garage in {area_line} and do something else for a few hours.\n\n{booking_line}.","instagram":"Back seat of a parent's car: a short documentary.\n\nInterior {price_interior}. Drop-off, Melrose Park. {booking_line}.","group_version":"For the parents here: if your back seat has turned into a snack museum, I do interior cleaning out of my garage in {area_line} for {price_interior}. Drop-off only.\n\nNo pressure - just figured someone might need it. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":5,"id":"d05-car-seat-crumbs"},{"title":"Before / after #1 (your first real job)","pillar":"proof","purpose":"Show real results. Only post with your own genuine photos.","platform":"Facebook Page + Instagram carousel","format":"carousel: before, after","needs_real_photos":true,"cta":"Message to book the same service","visual":"REAL before and after from the same angle, same lighting. Blur plates, no customer faces. Ask the customer if it's okay to post their car.","shots":"- Before: wide shot of the area, phone at chest height\n- After: exact same spot and angle\n- One close-up detail (cup holder, mat, wheel)","facebook":"Before and after from this week. [TYPE WHAT SERVICE THIS WAS AND ONE REAL DETAIL ABOUT THE CAR]\n\nSame angle, same light, no filters.\n\n{booking_line}.","instagram":"Before / after. [TYPE THE SERVICE]. No filters, same light.\n\nMelrose Park, drop-off. {booking_line}.","story":"Frame 1: before photo, text 'Before'. Frame 2: after photo, text 'After'. Frame 3: 'This was the {price_interior} interior' (edit to match) + DM sticker.","season":"any","reel_script":"","group_version":"","allow_terms":"","day":6,"id":"d06-before-after-1"},{"title":"Fall: leaves, sap and what's on your paint","pillar":"seasonal","season":"fall","purpose":"Timely exterior post for October/November.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Text to book an exterior","visual":"Real photo of leaves stuck at the base of a windshield or around the hood, then the cleaned version.","shots":"- Leaves in the windshield area (before)\n- Same area cleaned (after)","facebook":"It's that time of year where you park under one tree for ten minutes and come back to a hood full of leaves, wet gunk at the bottom of the windshield, and bird droppings that have been sitting for a week.\n\nExterior cleaning is {price_exterior}: {exterior_includes}.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"October paint job: leaves, sap, and mystery spots.\n\nExterior {price_exterior}. Drop-off, Melrose Park. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":7,"id":"d07-fall-leaves"},{"title":"Reel: cleaning one cup holder","pillar":"satisfying detail","purpose":"Short, oddly satisfying video. Low effort, high watch time.","platform":"Instagram Reel + Facebook Reel","format":"10-15s reel, no voice","needs_real_photos":true,"cta":"DM to book","visual":"Tight close-up of a dirty cup holder being cleaned with a brush and towel.","shots":"- Phone propped, 6 inches away, cup holder fills the frame\n- Brush in, swirl, towel wipe\n- Final clean shot, hold 2 seconds","reel_script":"0-2s  Dirty cup holder, close. Text: \"One cup holder. 40 seconds.\"\n2-10s Brush, wipe, brush again. No text.\n10-13s Clean result. Text: \"Now imagine the whole car. Interior {price_interior}.\"\nAudio: the brush sounds. Seriously, people like that.","instagram":"Every car has one cup holder that's been through things.\n\nInterior {price_interior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":8,"id":"d08-cup-holder"},{"title":"What the full package actually includes","pillar":"pricing","purpose":"Explain the best-value option clearly.","platform":"Facebook Page","format":"text + 2 photos (inside and out)","cta":"Text 'full' to book","visual":"One real interior photo + one real exterior photo of the same car.","shots":"- Interior wide shot through the open driver door\n- Exterior three-quarter angle","facebook":"A few people asked what the {price_full} package is, so here it is plainly.\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\nThat's both services in one drop-off. Price-wise it's the same as booking them separately - the point is one visit, one number, and the whole car done at once.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"Full package = interior + exterior, {price_full}.\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":9,"id":"d09-full-package"},{"title":"How booking works (4 steps)","pillar":"booking","purpose":"Remove friction - people book when they know exactly what happens.","platform":"Facebook Page + Instagram + Story highlight","format":"text post / story series","cta":"Send a text with your car and the service you want","visual":"Simple numbered graphic, or a photo of keys on a clean seat.","shots":"- Keys on a clean seat\n- Garage with the door open","facebook":"How booking with me works:\n\n1. Text or message me what car you have and which service you want.\n2. I'll send you the drop-off times I actually have open.\n3. Drop the car off at my garage in {area_line}. {turnaround_line}.\n4. Pick it up, pay ({payment_methods}), done.\n\nInterior {price_interior} / Exterior {price_exterior} / Both {price_full}\n\n{booking_line}.","instagram":"Booking in 4 steps:\n1. DM your car + service\n2. I send open drop-off times\n3. Drop it off\n4. Pick up a clean car\n\n{booking_line}.","story":"Four frames, one step each. Save as a 'Booking' highlight on Instagram.","season":"any","needs_real_photos":false,"reel_script":"","group_version":"","allow_terms":"","day":10,"id":"d10-how-booking-works"},{"title":"Uber, Lyft and delivery drivers","pillar":"everyday problem","purpose":"Target people whose car is literally their workplace.","platform":"Facebook Page + driver-focused groups (where allowed)","format":"text post","cta":"Text to book","visual":"Real photo of a clean back seat and door panel.","shots":"- Rear passenger door panel, clean\n- Back seat from the passenger's view","facebook":"If you drive for Uber, Lyft, DoorDash, any of them - your car is your office. And your office gets a lot of strangers.\n\nInterior is {price_interior}. Full inside and out is {price_full}. Drop-off in {area_line}, so plan it on a day you're not driving.\n\n{booking_line}.","instagram":"Drivers: your back seat sees more people than most waiting rooms.\n\nInterior {price_interior}. Drop-off, Melrose Park. {booking_line}.","group_version":"For drivers in the area: I do interior cleaning ({price_interior}) and full inside/out ({price_full}) out of my garage in {area_line}. Drop-off only, so it works best on a day off. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":11,"id":"d11-rideshare-drivers"},{"title":"Before / after: floor mats","pillar":"proof","purpose":"Second real proof post, focused on one obvious part of the car.","platform":"Instagram carousel + Facebook Page","format":"carousel","needs_real_photos":true,"cta":"DM to book","visual":"REAL floor mat before/after, laid on the same surface.","shots":"- Mat on the garage floor, before\n- Same mat, same spot, after","facebook":"Floor mats take the worst of it. This one [TYPE ONE REAL DETAIL - e.g. 'had half a season of salt and mud on it'].\n\nBefore and after, same spot on my garage floor.\n\n{booking_line}.","instagram":"Floor mat, before and after. [TYPE ONE REAL DETAIL]\n\nInterior {price_interior}. {booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":12,"id":"d12-before-after-mats"},{"title":"Dog hair: honest expectations","pillar":"everyday problem","purpose":"Attract pet owners while setting realistic expectations.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Send a photo for an honest answer","visual":"Real photo of a cargo area or back seat with pet hair (yours or a customer's, with permission).","shots":"- Close-up of fabric with hair\n- Same fabric after","facebook":"Dog owners, this one's for you.\n\nPet hair weaves itself into car fabric like it's paying rent. Some cars come out great, some need more time than a standard interior.\n\nSo here's what I do: send me a photo before you book and I'll tell you honestly what to expect. No surprises when you pick it up.\n\nInterior starts at {price_interior}. {booking_line}.","instagram":"Dog hair in the back seat? Send me a pic first and I'll give you an honest answer before you book.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":13,"id":"d13-pet-hair"},{"title":"Story poll: crumbs vs. dog hair","pillar":"engagement","purpose":"Easy Story engagement so Instagram shows your next posts to more people.","platform":"Instagram Story + Facebook Story","format":"story with poll sticker","cta":"Vote / DM","visual":"Plain background or a real close-up of a messy seat.","shots":"- Any close-up of a messy (or cleaned) seat","story":"Frame 1: 'What's worse in a car?' Poll sticker: 'Crumbs' / 'Dog hair'.\nFrame 2 (next day): 'Results are in: [TYPE REAL RESULT]. Either way, interior is {price_interior}.' + DM sticker.","season":"any","needs_real_photos":false,"facebook":"","instagram":"","reel_script":"","group_version":"","allow_terms":"","day":14,"id":"d14-poll-crumbs-vs-hair"},{"title":"Thanksgiving: airport runs and family in the car","pillar":"seasonal","season":"fall","purpose":"Holiday timing: people want clean cars before guests ride along.","platform":"Facebook Page + local groups (where allowed)","format":"text + photo","cta":"Book a drop-off before the holiday","visual":"Clean back seat or trunk ready for luggage.","shots":"- Empty clean trunk\n- Back seat, wide","facebook":"Picking somebody up from O'Hare for Thanksgiving? Driving the whole family to dinner?\n\nIf the back seat currently has gym clothes, receipts and a single lost shoe in it, now's a good time.\n\nInterior {price_interior}. Inside and out {price_full}. Drop-off in {area_line}.\n\nMessage me and I'll tell you what drop-off times I have before the holiday. {booking_line}.","instagram":"Airport pickup season. Make the back seat presentable.\n\nInterior {price_interior} / Full {price_full}. {booking_line}.","group_version":"If anyone's doing airport runs or hosting family next week and wants their car cleaned first, I do drop-off detailing in {area_line}. Interior {price_interior}, full {price_full}. Happy to tell you what times I have open. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":15,"id":"d15-thanksgiving-ohare"},{"title":"Reel: wheels and tires","pillar":"process","purpose":"Exterior process video; wheels are the most visual part.","platform":"Instagram Reel + Facebook Reel","format":"15-20s reel, no voice","needs_real_photos":true,"cta":"DM to book an exterior","visual":"Close-up of a dirty wheel being cleaned, then the result.","shots":"- Phone at wheel height, 2 feet away\n- Brush in the spokes, slow\n- Rinse, then final shot","reel_script":"0-3s  Dirty wheel, still. Text: \"Brake dust is not a color.\"\n3-12s Brush through the spokes, rinse. Text: \"Exterior {price_exterior}\"\n12-18s Clean wheel, slow pan. Text: \"Drop-off, Melrose Park. DM to book.\"","instagram":"Brake dust is not a color.\n\nExterior {price_exterior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":16,"id":"d16-wheels-reel"},{"title":"Selling or trading in? Clean it first","pillar":"everyday problem","purpose":"Reach people with a concrete reason to book this week.","platform":"Facebook Page + Marketplace-adjacent groups (where allowed)","format":"text post","cta":"Text to book before you list","visual":"Real photo of a clean interior taken like a listing photo.","shots":"- Driver's door open, wide interior shot (the classic listing photo)","facebook":"Listing your car on Marketplace or trading it in soon?\n\nI can't promise a clean car gets you a better offer. I can tell you that listing photos of a clean car look like it's been cared for, and photos of a dirty one look like... a dirty one.\n\nFull inside and out is {price_full}. Drop-off in {area_line}. {booking_line}.","instagram":"Selling soon? Clean listing photos > dirty listing photos.\n\nFull package {price_full}. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":17,"id":"d17-selling-your-car"},{"title":"What I don't do (yet)","pillar":"trust","purpose":"Build trust by being upfront about limits; filters out bad-fit requests.","platform":"Facebook Page","format":"text post","cta":"Ask if your car's a good fit","visual":"Photo of your supplies or the garage.","shots":"- Supplies shelf, tidy","allow_terms":"mobile, ceramic, paint correction, polish, extraction","facebook":"Being upfront about what I do and don't do:\n\nI do: interior detailing ({price_interior}), exterior cleaning ({price_exterior}), and both together ({price_full}).\n\nI don't do (right now): paint correction, polishing, ceramic coatings, carpet extraction, or mobile service.\n\nIf your car needs one of those, I'll tell you instead of taking your money for something I don't offer. If it just needs a good, honest cleaning, that's me.\n\n{booking_line}.","season":"any","needs_real_photos":false,"instagram":"","story":"","reel_script":"","group_version":"","day":18,"id":"d18-what-i-dont-do"},{"title":"Salt season prep","pillar":"seasonal","season":"winter","purpose":"Chicago winter: salt is the big exterior problem. Post after the first salting.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Book an exterior after the next salt day","visual":"Real photo of salt residue on a lower door or wheel well, then cleaned.","shots":"- Lower door panel with white salt line\n- Same area after","facebook":"The salt trucks are out, which means the bottom of every car around here is about to turn white.\n\nExterior cleaning is {price_exterior}: {exterior_includes}.\n\nDrop-off in {area_line}. {booking_line}.","instagram":"First salt of the season. You know what's coming.\n\nExterior {price_exterior}. {booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":19,"id":"d19-salt-season"},{"title":"If I've cleaned your car, tell one person","pillar":"referral","purpose":"Ask happy customers to spread the word - the cheapest marketing there is.","platform":"Facebook Page + direct message to past customers","format":"text post","cta":"Share or tag someone","visual":"Real after photo from a past job (with permission).","shots":"- Any good after shot you already have","facebook":"Small business, honest ask: if I've cleaned your car and you were happy with it, tell one person. A coworker, your sister, the neighbor whose car you secretly judge.\n\nThat's how a one-person shop like mine actually grows.\n\nAnd if you haven't booked yet: interior {price_interior}, exterior {price_exterior}, both {price_full}. {booking_line}.","instagram":"If I've cleaned your car - share this with one person who needs it. That's how a one-person shop grows.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":20,"id":"d20-referral-ask"},{"title":"Before / after: exterior","pillar":"proof","purpose":"Third real proof post, exterior this time.","platform":"Facebook Page + Instagram carousel","format":"carousel","needs_real_photos":true,"cta":"DM to book an exterior","visual":"REAL exterior before/after from the same angle. Plates blurred.","shots":"- Three-quarter front angle, before\n- Same angle, after, same time of day","facebook":"Exterior before and after. [TYPE ONE REAL DETAIL ABOUT THIS CAR]\n\n{price_exterior}, drop-off in {area_line}. {booking_line}.","instagram":"Exterior before / after. [TYPE ONE REAL DETAIL]\n\n{price_exterior}. {booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":21,"id":"d21-before-after-exterior"},{"title":"The coffee drip on the console","pillar":"everyday problem","purpose":"Relatable commuter problem, honest about stains.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Text to book an interior","visual":"Real photo of a console/cup holder area after cleaning.","shots":"- Console, top-down shot","facebook":"Every commuter car has the same drip line running down the side of the console. Coffee, mostly. Sometimes Gatorade. Once in a while, a mystery.\n\nFresh spills clean up a lot easier than ones that have been baking in since summer. If you've got one that's old, send me a photo and I'll tell you honestly what to expect.\n\nInterior {price_interior}. {booking_line}.","instagram":"The console coffee drip. Every car has one.\n\nInterior {price_interior}. Melrose Park, drop-off. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":22,"id":"d22-coffee-spill"},{"title":"What I actually use","pillar":"process","purpose":"Show the real tools - credibility without showing your face.","platform":"Instagram feed + Facebook Page","format":"single photo","needs_real_photos":true,"cta":"Ask a question / DM to book","visual":"Flat lay of your REAL brushes, towels, vacuum attachments on the garage floor or a clean towel.","shots":"- Top-down, phone held flat over the tools\n- One close-up of the most-used brush","facebook":"People always ask what I use. Here's the actual kit. [TYPE 1-2 REAL THINGS ABOUT YOUR TOOLS - e.g. which brush you use most and why]\n\nNothing magic, just the right tool for each spot and the patience to use it.\n\n{booking_line}.","instagram":"The actual kit. [TYPE ONE REAL DETAIL]\n\n{booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":23,"id":"d23-tools-flatlay"},{"title":"Reel: full interior timelapse","pillar":"process","purpose":"The big 'whole job' video. Shows effort and value for the price.","platform":"Instagram Reel + Facebook Reel","format":"20-30s timelapse, no voice","needs_real_photos":true,"cta":"DM to book","visual":"Phone on a tripod or wedged in the door frame, timelapse of the whole interior job.","shots":"- Fixed angle through the open passenger door\n- Timelapse mode for the whole job\n- 3-second normal-speed clean shot at the end","reel_script":"0-2s  Before, normal speed. Text: \"[TYPE REAL TIME IT TOOK] in 25 seconds.\"\n2-22s Timelapse. Text pops in at the midpoint: \"Interior {price_interior}\"\n22-27s After, normal speed, slow pan. Text: \"Drop-off - Melrose Park. DM to book.\"","instagram":"A full interior, sped way up. [TYPE REAL TIME IT TOOK] of work.\n\nInterior {price_interior}. {booking_line}.","season":"any","facebook":"","story":"","group_version":"","allow_terms":"","day":24,"id":"d24-timelapse"},{"title":"Open drop-off times this week","pillar":"booking","purpose":"Fill REAL open slots. Only post when you actually have openings.","platform":"Facebook Page + Instagram Story + groups (promo days)","format":"text post / story","cta":"Text to grab a time","visual":"Photo of your empty garage bay, or plain text graphic.","shots":"- Empty garage bay, lights on","facebook":"I've got a few drop-off times open this week:\n\n[TYPE YOUR REAL OPEN DROP-OFF TIMES HERE]\n\nInterior {price_interior} / Exterior {price_exterior} / Both {price_full}\n\n{booking_line}.","instagram":"Open drop-off times this week:\n[TYPE YOUR REAL OPEN DROP-OFF TIMES HERE]\n\n{booking_line}.","story":"Frame: 'Open this week:' + your real times. Add a DM sticker. Only post with times you've added in the Booking page.","season":"any","needs_real_photos":false,"reel_script":"","group_version":"","allow_terms":"","day":25,"id":"d25-open-times-this-week"},{"title":"Sports parents and gym bags","pillar":"everyday problem","purpose":"Another real, local audience with messy cars.","platform":"Facebook Page + parent/sports groups (where allowed)","format":"text post","cta":"Text to book","visual":"Real photo of a cleaned trunk/cargo area.","shots":"- Clean trunk, wide\n- Trunk carpet close-up","facebook":"Travel soccer, hockey bags, cleats, the gym bag that lives in your trunk year-round. Your car has seen things.\n\nA lot of car smell is just stuff that's been sitting in there too long. Getting it all out and cleaned up is step one.\n\nInterior {price_interior}. Drop-off in {area_line}. {booking_line}.","instagram":"Hockey bag owners, I see you. And I smell you.\n\nInterior {price_interior}. {booking_line}.","group_version":"Sports parents: if the trunk has become permanent storage for cleats and bags, I do interior cleaning out of my garage in {area_line}, {price_interior}. Drop-off only. {booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","allow_terms":"","day":26,"id":"d26-sports-gym-bags"},{"title":"December: holiday driving","pillar":"seasonal","season":"winter","purpose":"Holiday timing for December.","platform":"Facebook Page + Instagram","format":"photo post","cta":"Message for open times before the holidays","visual":"Clean interior, warm garage lighting.","shots":"- Front seats, wide, garage lights on","facebook":"Between holiday parties, picking people up, and the salt on the roads, December is rough on cars.\n\nIf you want it clean before family's in the car: interior {price_interior}, exterior {price_exterior}, or both for {price_full}.\n\nMessage me and I'll send you the drop-off times I actually have. {booking_line}.","instagram":"Clean car before the holiday chaos. Interior {price_interior} / Full {price_full}.\n\n{booking_line}.","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":27,"id":"d27-holiday-driving"},{"title":"How long does it take?","pillar":"faq","purpose":"Answer the second most common question after price.","platform":"Facebook Page + Instagram Story highlight","format":"text post","cta":"Text to book a drop-off","visual":"Photo of keys on a hook or a clock in the garage (optional).","shots":"- Keys hanging in the garage","facebook":"\"How long will you have my car?\"\n\n{turnaround_line}. {hours_line}.\n\nI'm one person, so I don't rush cars through. When you pick it up, it's done.\n\n{booking_line}.","instagram":"How long? {turnaround_line}.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":28,"id":"d28-how-long"},{"title":"Why regulars book every month or so","pillar":"repeat","purpose":"Plant the idea of repeat bookings.","platform":"Facebook Page","format":"text post","cta":"Ask about your next cleaning","visual":"Side-by-side: a car that's maintained vs. one that isn't (your real photos only).","shots":"- Any real after shot","facebook":"The easiest car to clean is one that got cleaned a month ago.\n\nWhen it's been a year, everything's ground in. When it's been a month, it's a quick reset and the car basically stays nice.\n\nInterior {price_interior}, exterior {price_exterior}, both {price_full}. If you've been in before, just text me when you're ready for the next one. {booking_line}.","instagram":"Clean car tip: the best time to clean it is before it gets bad.\n\n{booking_line}.","season":"any","needs_real_photos":false,"story":"","reel_script":"","group_version":"","allow_terms":"","day":29,"id":"d29-maintenance-cleaning"},{"title":"30 days in: real numbers and thanks","pillar":"milestone","purpose":"Honest recap with REAL numbers only. Builds trust and reminds people you exist.","platform":"Facebook Page","format":"text post + best real before/after","needs_real_photos":true,"cta":"Book / share","visual":"Your favorite REAL before/after from the month.","shots":"- Best before/after you have","facebook":"First month of {business} is done.\n\n[TYPE REAL NUMBER] cars cleaned. [TYPE ONE REAL THING YOU LEARNED OR NOTICED - e.g. which spot is always the dirtiest].\n\nThank you to everyone who dropped off a car or shared a post. Seriously.\n\nStill the same prices: interior {price_interior}, exterior {price_exterior}, both {price_full}. {booking_line}.","instagram":"Month one: [TYPE REAL NUMBER] cars. Thank you, Melrose Park.\n\n{booking_line}.","season":"any","story":"","reel_script":"","group_version":"","allow_terms":"","day":30,"id":"d30-first-30-days"}]</script>
<script type="application/json" id="d-replies">[{"id":"price","group":"Inquiries","title":"\"How much do you charge?\"","when":"First reply to a price question. Answer the price straight away - don't make them ask twice.","next_step":"Mark as Replied (or Quote Sent if they named a service).","text":"Hey {name}! Prices are simple:\n\nInterior - {price_interior}\nExterior - {price_exterior}\nBoth inside and out - {price_full}\n\nIt's drop-off at my garage in {area_line}. What kind of car is it, and which one were you thinking?"},{"id":"location","group":"Inquiries","title":"\"Where are you located?\"","when":"Give the general area. Send the exact address only once they've booked.","next_step":"Mark as Replied.","text":"I'm in {area_line}. It's a garage setup, so it's drop-off - you leave the car with me and pick it up when it's done. I'll send the exact address once we lock in a time. Want me to send you what I have open?"},{"id":"come_to_me","group":"Inquiries","title":"\"Do you come to me?\"","when":"Mobile requests. Be clear and friendly - don't leave any doubt.","next_step":"Mark as Replied. If they can't drop off, mark Lost with reason 'needs mobile'.","text":"I don't, sorry - I'm drop-off only right now. Everything I use is set up in my garage in {area_line}. If you're able to drop it off, I'd be happy to take care of it. {hours_line}."},{"id":"full_package","group":"Inquiries","title":"\"What does the $140 package include?\"","when":"Explaining the full package. Only list what you actually do (it comes from Settings).","next_step":"Mark Quote Sent with service 'full'.","text":"The {price_full} package is both services in one drop-off:\n\nInside: {interior_includes}.\nOutside: {exterior_includes}.\n\n{turnaround_line}. Want me to send you some drop-off times?"},{"id":"availability","group":"Inquiries","title":"\"Do you have availability?\"","when":"Only real open slots from the Booking page are listed. If none are listed, add slots first - never guess.","next_step":"After they pick one, use 'Offer this slot' on the lead, then Confirm once they say yes.","text":"Here's what I have open right now:\n\n{open_times}\n\nWhich one works for you? Once you pick, I'll hold it and send the address."},{"id":"pet_or_stain","group":"Inquiries","title":"Pet hair / old stain / \"can you get this out?\"","when":"Don't promise results you haven't seen. Ask for a photo.","next_step":"Mark as Replied, follow up in 1 day.","text":"Can you send me a picture of it? I'd rather tell you honestly what to expect before you book than promise something and have you disappointed."},{"id":"no_reply_1","group":"Follow-ups","title":"No reply - first nudge (2 days)","when":"They asked, you answered, then silence. One light nudge.","next_step":"Use 'Log follow-up' and set next follow-up in 4 days.","text":"Hey {name}, just checking back in case my last message got buried. Still want to get the car cleaned? No worries either way."},{"id":"no_reply_2","group":"Follow-ups","title":"No reply - last message (about a week later)","when":"Final follow-up. After this, mark Lost - don't keep messaging.","next_step":"Log follow-up with no next date, then mark Lost (reason: no response).","text":"Last one from me so I'm not blowing up your phone - if you ever want the car done, just text me. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Take care!"},{"id":"quote_followup","group":"Follow-ups","title":"Quote sent, no decision yet","when":"They got a price but didn't pick a time.","next_step":"Log follow-up, next in 3 days.","text":"Hey {name}, any thoughts on the {service_label}? Happy to send you the open drop-off times if you want to grab one."},{"id":"booking_confirmation","group":"Appointments","title":"Booking confirmation","when":"Right after they say yes to a time. Then press Confirm on the appointment.","next_step":"Confirm the appointment in the app.","text":"You're all set, {name}!\n\n{appt_service} - {appt_price}\nDrop-off: {appt_date} at {appt_time}\nWhere: {private_address}\n\n{turnaround_line}. I take {payment_methods}. Please take out anything valuable before drop-off. If anything changes, just text me."},{"id":"reminder","group":"Appointments","title":"Reminder (day before)","when":"The day before a confirmed appointment.","next_step":"Press 'Reminder sent' on the appointment.","text":"Hey {name}, quick reminder - drop-off is tomorrow ({appt_date}) at {appt_time} for the {appt_service}. Still good?"},{"id":"ready_pickup","group":"Appointments","title":"Car is ready","when":"When you finish the job.","next_step":"Mark the job completed and record payment.","text":"Your car's ready, {name}! Come by whenever works for you. Total is {appt_price} ({payment_methods})."},{"id":"reschedule","group":"Appointments","title":"They need to reschedule / cancel","when":"Keep it easy. Cancel the appointment in the app so the slot opens back up.","next_step":"Cancel the appointment (the slot re-opens automatically).","text":"No problem at all. Here's what else I have open:\n\n{open_times}\n\nJust let me know which one works."},{"id":"review_request","group":"After the job","title":"Review request (day after)","when":"The day after a completed, paid job. Only ask once. Never offer anything in exchange for a review.","next_step":"Press 'Review requested' on the lead.","text":"Thanks again for bringing your car in, {name}. If you were happy with it, a quick review would really help a one-person shop like mine: {review_link}\n\nAnd if anything wasn't right, tell me - I'd rather fix it."},{"id":"referral_ask","group":"After the job","title":"Referral ask","when":"With a happy customer, a few days after the job.","next_step":"Log follow-up.","text":"Hey {name}, if you know anyone who needs their car cleaned, I'd really appreciate you passing my number along. Most of my customers come from people telling people."},{"id":"repeat_offer","group":"After the job","title":"Repeat booking (about 5 weeks later)","when":"Repeat follow-up date reached. No fake discounts - just a reminder.","next_step":"Press 'Repeat offer sent' (next reminder in 60 days).","text":"Hey {name}, it's been about a month since I did your car. If it's ready for another round, I've got a few drop-off times open:\n\n{open_times}\n\nSame prices: interior {price_interior}, exterior {price_exterior}, both {price_full}."},{"id":"group_recommendation","group":"Community groups","title":"Answering a \"Can anyone recommend a detailer?\" post","when":"When someone in a local group asks for a recommendation. Reply once; don't argue with other recommendations.","next_step":"Log the effort under facebook_group. If they message you, add them as a lead.","text":"I do detailing out of my garage in {area_line} - {business}. Drop-off only. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Happy to answer questions, feel free to message me."},{"id":"partner_intro","group":"Partnerships","title":"Intro to a local business (in person or via their public business contact)","when":"One personal message to a business's PUBLIC business contact. Never mass-send. If they don't answer, one follow-up max.","next_step":"Update the opportunity status to 'contacted' and set a follow-up date 7 days out.","text":"Hi, I'm {owner_first_name} - I run {business}, a small drop-off detailing shop in {area_line}. I'm reaching out to a few local businesses to see if you'd be open to me leaving a few flyers, or if your customers ever ask about car cleaning. Interior {price_interior}, exterior {price_exterior}, both {price_full}. Totally fine if it's not a fit - thanks for reading."}]</script>
<script type="application/json" id="d-plan">{"normal":[{"day":1,"theme":"Show up","content":"Publish one approved post on your Facebook Page (start with the next post in the library).","acquisition":"Find 2 local Facebook groups (Prospecting page), read their rules, and record the rule type. Ask to join. Don't post yet.","followup":"Reply to every New Lead. Then clear anything on 'Follow-ups due today'.","optional":"Take 5 minutes of close-up video on your next job (cup holder, wheel, under-seat). Save it for later."},{"day":2,"theme":"Be findable","content":"Post one Instagram Story (price graphic or a quick close-up). 2 minutes.","acquisition":"Work on one Google/search step from the Prospecting checklist (e.g. confirm GBP eligibility, or set up the Facebook Page's About section).","followup":"Send any 'no reply - first nudge' messages that are due.","optional":"Pin the price-menu post on your Facebook Page if it's approved."},{"day":3,"theme":"Neighbors","content":"Publish one approved post (Page). If a group you joined allows business posts today, share the group version there.","acquisition":"Search 2 joined groups for 'detail', 'car wash', 'clean my car'. Answer real recommendation requests with the group template. One reply each, no arguing.","followup":"Follow-ups due today.","optional":"Drop 5-10 flyers at one place that has a public community board (and allows it)."},{"day":4,"theme":"Partners","content":"Post a Reel if you have real footage; otherwise skip content today.","acquisition":"Visit or message ONE local business from the Prospecting list via its public business contact (partner intro template). Record it.","followup":"Check every Quote Sent lead - send the quote follow-up if it's been 2+ days.","optional":"Add your real open drop-off times for next week on the Booking page."},{"day":5,"theme":"Fill the week","content":"If you have REAL open slots, post 'Open drop-off times this week' with those exact times. If you're full, post anything else approved.","acquisition":"Text past customers whose repeat date has arrived (repeat offer template). Only people who've done business with you.","followup":"Send reminders for tomorrow's appointments.","optional":"Ask one happy customer for a referral (referral template)."},{"day":6,"theme":"Work day","content":"Shoot before/after photos and 1-2 short clips while you work. Hands and car only.","acquisition":"Ask today's customers if it's okay to post photos of their car (plates blurred).","followup":"Review requests for yesterday's completed jobs.","optional":"Pick next week's 3 posts and approve them."},{"day":7,"theme":"Review","content":"No posting required. Approve/schedule 2-3 posts for next week.","acquisition":"Open the Weekly Report. Look at which channel brought inquiries and drop the one that took time and brought nothing.","followup":"Mark anyone who hasn't replied after 2 follow-ups as Lost. Back up your data (Backup button).","optional":"Log any marketing time you forgot to record this week."}],"cash_mode":["1. Reply to every New Lead right now. Speed wins most small jobs.","2. Send every follow-up due today (quote follow-ups first - they already know the price).","3. Add your REAL open drop-off slots for the next 7 days on the Booking page.","4. Text past customers whose repeat date is close (repeat offer template) - only people who've done business with you.","5. Ask 2-3 happy past customers for a referral (referral template).","6. Post 'Open drop-off times this week' with your real open slots on your Page, and in any group whose rules allow business posts today.","7. Search your joined groups for people asking for a detailer or car cleaning and reply once with the group template.","8. Skip new Reels, logo tweaks and anything that doesn't lead to a message today."]}</script>
<script>
(function () {
"use strict";
const J = (id) => JSON.parse(document.getElementById(id).textContent);
const POSTS = J("d-posts"), REPLIES = J("d-replies"), PLAN = J("d-plan");

// ---------------------------------------------------------------- fixed business facts
const BUSINESS = "Carbon Force Detailing";
const SERVICES = { interior: { label: "Interior detail", price: 80 }, exterior: { label: "Exterior cleaning", price: 60 }, full: { label: "Full interior + exterior package", price: 140 } };
const SERVICE_CHOICES = ["interior", "exterior", "full", "unsure"];
const svcLabel = (k) => SERVICES[k] ? `${SERVICES[k].label} ($${SERVICES[k].price})` : "Not sure yet";
const BANNED = ["mobile", "we come to you", "i come to you", "at your home", "at your location", "ceramic", "paint correction", "polish", "buffing", "extraction", "shampoo extract", "fully booked", "booked solid", "only 1 spot", "only one spot", "spots left", "limited spots", "certified", "insured", "#1", "best in"];
const STATUSES = ["New Lead", "Replied", "Quote Sent", "Follow-Up Due", "Booked", "Completed", "Lost"];
const SOURCES = ["facebook_page", "facebook_group", "facebook_marketplace", "instagram", "google_business_profile", "google_search", "flyer", "referral", "repeat_customer", "partner", "nextdoor", "walk_by_or_sign", "other"];
const METHODS = ["text", "call", "facebook_messenger", "instagram_dm", "email", "in_person", "other"];
const PAY = ["cash", "zelle", "venmo", "cash_app", "card", "other"];
const OPP_TYPES = ["facebook_group", "facebook_page", "google_business_profile", "local_search", "partnership", "directory", "referral_program", "community_event", "other"];
const OPP_STATUS = ["to_research", "researched", "join_requested", "joined", "contacted", "posted", "active_partner", "no_response", "declined", "not_a_fit"];
const RULES = { promo_allowed: "Business posts allowed (keep it neighborly)", promo_day_only: "Business posts only on the promo day/thread", recommendations_only: "No ads; answer recommendation requests only", no_business: "No business posts - just be a member", unknown: "Rules not checked yet - read them before posting" };
const SETTINGS = [
  ["booking_line", "How customers book", "Text or call 708-555-0000 to book", true],
  ["phone", "Business phone", "708-555-0000", true],
  ["area_line", "Public location wording (no street address)", "Melrose Park, near North Ave & 25th", true],
  ["hours_line", "Drop-off hours you actually keep", "Drop-off Mon-Sat, 8-10am", true],
  ["owner_first_name", "Your first name for messages", "", false],
  ["payment_methods", "Payment you accept", "Cash, Zelle", true],
  ["interior_includes", "What the $80 interior actually includes", "vacuum seats/carpet/trunk, wipe down dash, console, door panels, cup holders, inside glass", true],
  ["exterior_includes", "What the $60 exterior actually includes", "hand wash, wheels and tires, dry, outside glass", true],
  ["turnaround_line", "Honest turnaround wording", "Drop off in the morning, I text you when it's ready", true],
  ["private_address", "Exact drop-off address (only goes in booking confirmations)", "", false],
  ["review_link", "Review link once you have one", "", false],
  ["max_jobs_per_day", "Max cars you can do in one day", "2", true],
  ["launch_date", "Day 1 of your 7-day plan", "", false],
];
const POST_FIELDS = { facebook: "Facebook Page", instagram: "Instagram caption", story: "Story frames", reel_script: "Reel script (no voice, text on screen)", group_version: "Community-group version" };
const PUBLISH_STEPS = {
  "Facebook Page": ["Open your Facebook Page (not your personal profile).", "Create post, paste the Facebook text, add your real photo(s) or video.", "Read it once out loud and fix anything that doesn't sound like you.", "Post it, then come back and tap Mark published."],
  "Instagram": ["Instagram: + then Post, Reel or Story.", "Pick your real photo or clip. For Reels, add the on-screen text from the script.", "Paste the caption (3-5 hashtags max).", "Share, then tap Mark published."],
  "Community groups": ["Read the group rules again (they change).", "Only post if the group's rule type allows it today (see Prospecting).", "Paste the group version with one real photo.", "Don't post the same thing in lots of groups on the same day."],
};

// ---------------------------------------------------------------- helpers
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const plusDays = (n, start) => { const d = start ? parse(start) : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fdate = (s) => { if (!s) return "-"; const d = parse(s); return `${DAYS[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const ftime = (t) => { if (!t) return ""; let [h, m] = t.split(":").map(Number); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const money = (x) => "$" + (Number(x) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nice = (s) => String(s || "").replace(/_/g, " ");
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
class VErr extends Error {}
const need = (cond, msg) => { if (!cond) throw new VErr(msg); };
const num = (v, label) => { v = String(v == null ? "" : v).replace(/[$,\s]/g, ""); if (!v) return null; const n = Math.round(Number(v) * 100) / 100; need(isFinite(n) && n >= 0 && n <= 10000, `${label} must be a number like 80 or 80.00.`); return n; };
const clean = (v, max = 500) => String(v == null ? "" : v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").trim().slice(0, max);
const opts = (vals, sel, labeler) => vals.map((v) => `<option value="${esc(v)}"${String(v) === String(sel ?? "") ? " selected" : ""}>${esc(labeler ? labeler(v) : nice(v) || "-")}</option>`).join("");

function toast(msg, err) {
  const box = document.getElementById("toastbox");
  box.innerHTML = `<div class="toast${err ? " err" : ""}" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { box.innerHTML = ""; }, err ? 5000 : 2500);
}

// ---------------------------------------------------------------- state + storage
const S = { leads: new Map(), slots: new Map(), appts: new Map(), jobs: new Map(), posts: new Map(), opps: new Map(), effort: new Map(), timings: new Map(), settings: {}, active: null, loaded: new Set() };
let db = null, readOnly = false;
const COLS = ["leads", "slots", "appts", "jobs", "posts", "opps", "effort", "timings"];

async function put(col, id, body) {
  if (!db) throw new VErr("Storage isn't connected. Reopen the link while signed in to Claude.");
  if (readOnly) throw new VErr("Only the owner can change this.");
  const data = JSON.parse(JSON.stringify(body)); delete data.id;
  await db.collection(col).doc(id).set(data);
  S[col].set(id, Object.assign({ id }, data)); // show it right away
}
const newId = (col) => db.collection(col).doc().id;
const all = (col) => Array.from(S[col].values());
const settings = () => S.settings || {};
const maxPerDay = () => Math.max(1, parseInt(settings().max_jobs_per_day, 10) || 2);

// ---------------------------------------------------------------- text filling + checks
function values(extra) {
  const v = Object.assign({}, settings(), { business: BUSINESS, price_interior: "$80", price_exterior: "$60", price_full: "$140" });
  v.price_interior = "$" + SERVICES.interior.price; v.price_exterior = "$" + SERVICES.exterior.price; v.price_full = "$" + SERVICES.full.price;
  return Object.assign(v, extra || {});
}
function fill(text, extra) {
  const v = values(extra);
  return String(text || "").replace(/\{(\w+)\}/g, (m, k) => (v[k] ? String(v[k]) : `[SET ${k.toUpperCase()} IN SETUP]`));
}
const negateMobile = (t) => String(t || "").toLowerCase().replace(/(not|no|isn't|aren't|don't do|can't do)\s+(a\s+)?mobile/g, "");
function banned(text) {
  const low = negateMobile(text);
  return BANNED.filter((p) => new RegExp("(^|[^a-z])" + p.replace(/[.*+?^${}()|[\]\\#]/g, "\\$&") + "(?![a-z])").test(low));
}
function postView(base) {
  const o = S.posts.get(base.id) || {};
  const p = Object.assign({}, base, { status: o.status || "draft", approved: o.approved || null, scheduled: o.scheduled || null, published: o.published || null, where: o.where || "", notes: o.notes || "" });
  for (const f in POST_FIELDS) if (o.edits && typeof o.edits[f] === "string") p[f] = o.edits[f];
  return p;
}
function postProblems(p) {
  const allow = String(p.allow_terms || "").split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
  const out = [];
  for (const f in POST_FIELDS) {
    if (!p[f]) continue;
    const t = fill(p[f]);
    const miss = Array.from(new Set((t.match(/\[SET (\w+) IN SETUP\]/g) || []).map((m) => m.slice(5, -9).toLowerCase())));
    if (miss.length) out.push(`${POST_FIELDS[f]}: fill in Setup first (${miss.join(", ")})`);
    if (t.includes("[TYPE")) out.push(`${POST_FIELDS[f]}: replace the [TYPE ...] parts with real details`);
    const c = banned(t).filter((x) => !allow.includes(x));
    if (c.length) out.push(`${POST_FIELDS[f]}: has a claim you haven't confirmed (${c.join(", ")})`);
  }
  return out;
}
function openSlots(daysAhead) {
  const t = today(), end = plusDays(daysAhead || 14);
  return all("slots").filter((s) => s.status === "open" && s.date >= t && s.date <= end).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function openTimesText() {
  const s = openSlots(14).slice(0, 5);
  return s.length ? s.map((x) => `- ${fdate(x.date)}, drop-off ${ftime(x.time)}`).join("\n") : "[NO OPEN SLOTS ENTERED - ADD REAL SLOTS ON THE BOOK TAB FIRST]";
}
function renderReply(id, lead, appt) {
  const t = REPLIES.find((r) => r.id === id);
  const extra = { open_times: openTimesText(), name: lead && lead.name ? lead.name.split(/\s+/)[0].replace(/[{}]/g, "") : "there" };
  const svc = (appt && appt.service) || (lead && lead.service);
  extra.service_label = SERVICES[svc] ? SERVICES[svc].label.toLowerCase() : "cleaning";
  if (appt) { const sl = S.slots.get(appt.slot) || {}; Object.assign(extra, { appt_date: fdate(sl.date), appt_time: ftime(sl.time), appt_service: SERVICES[appt.service].label, appt_price: "$" + appt.price }); }
  return fill(t.text, extra);
}

// ---------------------------------------------------------------- lead logic
const ev = (lead, type, note, d) => { lead.events = (lead.events || []).concat([{ d: d || today(), t: type, n: clean(note, 200) }]).slice(-80); };
function status(l) { // Follow-up due is shown from the date; nothing is written in the background
  if ((l.status === "Replied" || l.status === "Quote Sent") && l.next && l.next <= today()) return "Follow-Up Due";
  return l.status;
}
function leadFromForm(f, base) {
  const l = Object.assign({}, base || {});
  l.name = clean(f.name, 120); need(l.name, "Name or nickname is required.");
  l.method = METHODS.includes(f.method) ? f.method : "text";
  l.contact = clean(f.contact, 200); l.consent = f.consent === "on"; l.consentNote = clean(f.consentNote, 200);
  need(SOURCES.includes(f.source), "Pick where they found you.");
  l.source = f.source; l.sourceDetail = clean(f.sourceDetail, 200); l.vehicle = clean(f.vehicle, 120);
  l.service = SERVICE_CHOICES.includes(f.service) ? f.service : "unsure";
  l.quote = num(f.quote, "Quoted price"); l.notes = clean(f.notes, 2000);
  return l;
}
async function createLead(f) {
  const inquiry = isDate(f.inquiry) ? f.inquiry : today();
  need(inquiry <= today(), "Inquiry date can't be in the future.");
  const l = leadFromForm(f);
  Object.assign(l, { inquiry, status: "New Lead", next: inquiry, created: new Date().toISOString(), events: [] });
  ev(l, "inquiry", "via " + l.source, inquiry);
  const id = newId("leads"); await put("leads", id, l); return id;
}
async function leadAct(id, fn) { const l = JSON.parse(JSON.stringify(S.leads.get(id))); need(l, "That lead is gone."); fn(l); await put("leads", id, l); }

// ---------------------------------------------------------------- booking logic
async function addSlot(f) {
  need(isDate(f.date), "Pick a date."); need(f.date >= today(), "You can't open a slot in the past.");
  need(/^\d{2}:\d{2}$/.test(f.time || ""), "Pick a drop-off time.");
  if (f.pickup) need(f.pickup > f.time, "Pick-up has to be after drop-off.");
  need(!all("slots").some((s) => s.date === f.date && s.time === f.time && s.status !== "closed"), "You already have a slot at that time.");
  await put("slots", newId("slots"), { date: f.date, time: f.time, pickup: f.pickup || "", status: "open", note: clean(f.note, 200) });
}
async function propose(leadId, slotId, service, price) {
  const slot = S.slots.get(slotId); need(slot, "Pick one of your open slots.");
  need(slot.status === "open", "That slot is no longer open."); need(slot.date >= today(), "That slot is in the past.");
  need(SERVICES[service], "Pick a service.");
  const lead = S.leads.get(leadId);
  let amt = num(price, "Price"); if (amt == null) amt = lead.quote || SERVICES[service].price;
  const sameDay = all("appts").filter((a) => (a.status === "proposed" || a.status === "confirmed") && (S.slots.get(a.slot) || {}).date === slot.date).length;
  need(sameDay < maxPerDay(), `You already have ${sameDay} car(s) that day - your daily max. Change it in Setup if you really can take another.`);
  await put("appts", newId("appts"), { lead: leadId, slot: slotId, service, price: amt, status: "proposed", created: new Date().toISOString() });
  await put("slots", slotId, Object.assign({}, slot, { status: "held" }));
  await leadAct(leadId, (l) => { l.quote = amt; l.service = service; l.next = plusDays(1); ev(l, "time_offered", `${slot.date} ${slot.time}`); });
}
async function confirmAppt(aid) {
  const a = S.appts.get(aid); need(a && a.status === "proposed", "Only a held time can be confirmed.");
  const slot = S.slots.get(a.slot);
  await put("appts", aid, Object.assign({}, a, { status: "confirmed", confirmed: today() }));
  await put("slots", a.slot, Object.assign({}, slot, { status: "booked" }));
  await leadAct(a.lead, (l) => { l.status = "Booked"; l.lastContact = today(); l.next = slot.date > today() ? plusDays(-1, slot.date) : slot.date; ev(l, "booked", `${slot.date} ${slot.time} ${a.service}`); });
}
async function cancelAppt(aid, noShow, reason) {
  const a = S.appts.get(aid); need(a && (a.status === "proposed" || a.status === "confirmed"), "That appointment can't be cancelled.");
  const slot = S.slots.get(a.slot);
  await put("appts", aid, Object.assign({}, a, { status: noShow ? "no_show" : "cancelled", notes: clean(reason, 200) }));
  if (slot) await put("slots", a.slot, Object.assign({}, slot, { status: slot.date >= today() ? "open" : "closed" }));
  await leadAct(a.lead, (l) => { l.status = "Follow-Up Due"; l.next = plusDays(2); ev(l, noShow ? "no_show" : "cancelled", reason); });
}
async function completeJob(aid, f) {
  const a = S.appts.get(aid); need(a && a.status === "confirmed", "Only a confirmed appointment can be completed.");
  let price = num(f.price, "Price charged"); if (price == null) price = a.price; need(price > 0, "Price charged must be more than $0.");
  const paid = num(f.paid, "Amount paid") || 0; need(paid <= price, "Paid is more than the price. Put tips in notes.");
  need(!paid || PAY.includes(f.method), "Pick how they paid.");
  const date = isDate(f.date) ? f.date : today(); need(date <= today(), "Completed date can't be in the future.");
  const service = SERVICES[f.service] ? f.service : a.service;
  await put("jobs", newId("jobs"), { appt: aid, lead: a.lead, date, service, price, paid, status: paid >= price ? "paid" : paid > 0 ? "partial" : "unpaid", payments: paid ? [{ d: date, a: paid, m: f.method }] : [], notes: clean(f.notes, 500) });
  await put("appts", aid, Object.assign({}, a, { status: "completed" }));
  await leadAct(a.lead, (l) => { l.status = "Completed"; l.next = plusDays(1, date); l.repeat = plusDays(35, date); ev(l, "completed", `${service} $${price}`, date); if (paid) ev(l, "payment", `$${paid} ${f.method}`, date); });
}
async function recordPayment(jid, amount, method) {
  const j = JSON.parse(JSON.stringify(S.jobs.get(jid))); need(j, "That job is gone.");
  const amt = num(amount, "Amount"); need(amt && amt > 0, "Enter an amount more than $0."); need(PAY.includes(method), "Pick a payment method.");
  const total = Math.round((j.paid + amt) * 100) / 100; need(total <= j.price, "That's more than the price charged.");
  j.paid = total; j.status = total >= j.price ? "paid" : "partial"; j.payments.push({ d: today(), a: amt, m: method });
  await put("jobs", jid, j);
  await leadAct(j.lead, (l) => ev(l, "payment", `$${amt} ${method}`));
}

// ---------------------------------------------------------------- reports
const payments = () => all("jobs").flatMap((j) => (j.payments || []).map((p) => Object.assign({ job: j.id }, p)));
const collected = (a, b) => payments().filter((p) => !a || (p.d >= a && p.d <= b)).reduce((s, p) => s + p.a, 0);
const owed = () => all("jobs").filter((j) => j.status !== "paid").reduce((s, j) => s + (j.price - j.paid), 0);
const hasEv = (l, t) => (l.events || []).some((e) => e.t === t);
const evCount = (t, a, b) => all("leads").reduce((n, l) => n + (l.events || []).filter((e) => e.t === t && e.d >= a && e.d <= b).length, 0);
function funnel(a, b) {
  const ls = all("leads").filter((l) => !a || (l.inquiry >= a && l.inquiry <= b));
  const c = (t) => ls.filter((l) => hasEv(l, t)).length;
  const f = { leads: ls.length, quoted: c("quote_sent"), booked: c("booked"), completed: c("completed"), lost: ls.filter((l) => l.status === "Lost").length };
  f.l2b = f.leads ? Math.round(100 * f.booked / f.leads) + "%" : "-"; f.q2b = f.quoted ? Math.round(100 * f.booked / f.quoted) + "%" : "-";
  return f;
}
function channels(a, b) {
  const by = {};
  for (const l of all("leads")) {
    if (a && !(l.inquiry >= a && l.inquiry <= b)) continue;
    const r = by[l.source] || (by[l.source] = { source: l.source, inquiries: 0, booked: 0, money: 0 });
    r.inquiries++; if (hasEv(l, "booked")) r.booked++;
  }
  for (const j of all("jobs")) { const l = S.leads.get(j.lead); if (l && by[l.source]) by[l.source].money += (j.payments || []).reduce((s, p) => s + p.a, 0); }
  return Object.values(by).sort((x, y) => y.inquiries - x.inquiries);
}
function weekBounds(any) { const d = any ? parse(any) : new Date(); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); const s = iso(d); return [s, plusDays(6, s)]; }
function weekly(any) {
  const [a, b] = weekBounds(any);

  const ch = channels(a, b);
