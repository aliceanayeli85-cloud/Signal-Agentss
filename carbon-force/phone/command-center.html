function experimentResult(x) {
  const len = Math.max(1, dayDiff(x.start, x.end) + 1);
  const bA = plusDays(-len, x.start), bB = plusDays(-1, x.start);
  const pick = (a, b) => { const r = channelStats(a, b).find((c) => c.source === x.channel) || { inquiries: 0, booked: 0, revenue: 0 }; return { inquiries: r.inquiries, booked: r.booked, revenue: r.revenue }; };
  return { during: pick(x.start, x.end < today() ? x.end : today()), before: pick(bA, bB) };
}

    channel: () => run(() => { const label = clean(f.label, 60); need(label, "Name the channel."); const key = "c_" + slug(label); need(!sources().includes(key), "You already track that channel."); return saveBiz({ channels: (B().channels || []).concat([{ key, label }]) }); }, "Channel added."),
    growth: () => run(() => { const i2q = Number(f.i2q), q2b = Number(f.q2b); need(i2q >= 1 && i2q <= 100 && q2b >= 1 && q2b <= 100, "Percentages must be 1-100."); return saveBiz({ targets: { monthlyRevenue: numOrNull(f.target, "Goal", 100000) }, assumptions: { avgJob: numOrNull(f.avgJob, "Average job", 5000), inquiryToQuote: i2q / 100, quoteToBook: q2b / 100 } }); }, "Saved."),
    policy: () => run(() => { const txt = clean(f.text, 1000); need(txt, "A policy can't be empty."); const reviewed = f.reviewed === "on"; const pols = Object.assign({}, B().policies); pols[id] = reviewed ? txt.replace(/^DRAFT[^:]*:\s*/i, "") : txt; const rv = Object.assign({}, B().policyReviewed || {}); rv[id] = reviewed; return saveBiz({ policies: pols, policyReviewed: rv }); }, "Policy saved."),

function oppFromForm(f, base) {

  o.type = OPP_TYPES.includes(f.type) ? f.type : "other"; o.status = OPP_STATUS.includes(f.status) ? f.status : "to_research"; o.rule = RULES[f.rule] ? f.rule : "unknown";

// ---------------------------------------------------------------- backup + restore
let downloads = null, restoreState = {};
const BACKUP_FORMAT = "carbon-force-backup";
function snapshotData(note) {
  const collections = {}; COLS.forEach((c) => { collections[c] = all(c); });
  return { format: BACKUP_FORMAT, version: 2, saved: new Date().toISOString(), note: note || "", settings: S.settings, business: S.biz, meta: S.meta, collections };
}
async function saveBackup() {
  if (!downloads) return toast("Saving files isn't available in this view. Your data is still in your Claude storage.", true);
  try {
    const res = await downloads.save({ filename: `carbon-force-backup-${today()}.json`, data: JSON.stringify(snapshotData("manual backup"), null, 1) });
    if (res === "saved" || (res && res.status === "saved") || res === undefined) { await saveMeta({ lastBackup: today() }); toast("Backup file saved."); render(true); }
    else toast("Backup wasn't saved.", true);
  } catch (e) { toast("Backup wasn't saved.", true); }
}
const ID_OK = /^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,200}$/;
function validateBackup(d) {
  // Accepts this app's backups (v2), the in-app pre-upgrade snapshot, and the older v1 file. Rejects anything else.
  need(d && typeof d === "object" && !Array.isArray(d), "That file isn't a Carbon Force backup.");
  let cols = d.collections;
  if (!cols) { need(Array.isArray(d.leads) && d.saved, "That file isn't a Carbon Force backup."); cols = {}; COLS.forEach((c) => { if (Array.isArray(d[c])) cols[c] = d[c]; }); }
  else need(d.format === BACKUP_FORMAT, "That file isn't a Carbon Force backup.");
  need(typeof cols === "object" && !Array.isArray(cols), "The backup's records are damaged.");
  const out = {};
  for (const c of Object.keys(cols)) {
    need(COLS.includes(c), `The backup has an unknown section "${c}". Nothing was restored.`);
    need(Array.isArray(cols[c]), `Section "${c}" is damaged. Nothing was restored.`);
    out[c] = cols[c].map((r, i) => { need(r && typeof r === "object" && !Array.isArray(r), `Record ${i + 1} in "${c}" is damaged. Nothing was restored.`); need(typeof r.id === "string" && ID_OK.test(r.id), `Record ${i + 1} in "${c}" has no valid ID. Nothing was restored.`); return r; });
  }
  for (const l of out.leads || []) need(typeof l.name === "string" && l.name, "A lead in the backup has no name. Nothing was restored.");
  for (const j of out.jobs || []) need(isFinite(Number(j.price)), "A job in the backup has no price. Nothing was restored.");
  const cfg = {};
  if (d.settings && typeof d.settings === "object") cfg.settings = d.settings;
  if (d.business && typeof d.business === "object") cfg.business = d.business;
  return { cols: out, cfg };
}
function prepareRestore(data, label) {
  try {
    const v = validateBackup(data);
    const counts = Object.keys(v.cols).map((c) => { const n = v.cols[c].length; const over = v.cols[c].filter((r) => S[c].has(r.id)).length; return n ? `${n} ${c}${over ? ` (${over} replace current)` : ""}` : ""; }).filter(Boolean);
    restoreState = { v, preview: `${label}: ${counts.join(", ") || "no records"}${v.cfg.settings ? ", setup" : ""}${v.cfg.business ? ", services & prices" : ""}.`, error: "" };
  } catch (e) { restoreState = { error: e instanceof VErr ? e.message : "Couldn't read that file." }; }
}
function readRestoreFile(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { restoreState = { error: "That file is too big to be a Carbon Force backup." }; return render(true); }
  const r = new FileReader();
  r.onload = () => { let d; try { d = JSON.parse(r.result); } catch (_) { restoreState = { error: "That file isn't valid JSON. Nothing was restored." }; return render(true); } prepareRestore(d, file.name); render(true); };
  r.onerror = () => { restoreState = { error: "Couldn't read that file." }; render(true); };
  r.readAsText(file);
}
async function doRestore() {
  need(restoreState.v, "Choose a backup file first.");
  const { cols, cfg } = restoreState.v;
  const snap = JSON.stringify(snapshotData("safety snapshot before restore"));
  if (snap.length < 240000) await put("backups", "auto-" + Date.now(), JSON.parse(snap));
  else need(confirmBig, "Your current data is too big for an in-app snapshot. Save a backup file first, then restore again.");
  let n = 0;
  for (const c of Object.keys(cols)) for (const r of cols[c]) { await put(c, r.id, r); n++; }
  if (cfg.settings) await saveSettings(cfg.settings);
  if (cfg.business) { await db.doc("config/business").set(JSON.parse(JSON.stringify(cfg.business))); S.biz = cfg.business; rebuildBiz(); }
  restoreState = {}; toast(`Restored ${n} record(s). A safety snapshot of the previous data was saved.`);
}
let confirmBig = false;

// ---------------------------------------------------------------- boot
let gate = "";
(function boot() {
  const h = (location.hash || "").slice(1);
  if (VIEWS[h] && !["lead", "post", "newlead"].includes(h)) view = h;
  render(true);
})();
(async function connect() {
  const sync = document.getElementById("sync");
  if (!window.claude || !window.claude.use) { sync.textContent = "Offline copy"; gate = `<div class="card bad"><h2>Open this from Claude</h2><p>This page saves your data in your Claude account, so it only works when opened from its claude.ai link while you're signed in.</p></div>`; return render(true); }
  const [d, u, dl, sm] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads"), claude.use("sample")]);
  downloads = dl; sampleFn = sm;
  if (u) { try { if (!(await u.isOwner())) { readOnly = true; gate = `<div class="card bad"><h2>Private business tool</h2><p>This page belongs to someone else, and its data is private.</p></div>`; sync.textContent = ""; return render(true); } } catch (_) {} }
  if (!d) { sync.textContent = "Not connected"; gate = `<div class="card bad"><h2>Storage isn't connected</h2><p>Reopen this page from its claude.ai link while signed in. Your data is safe - it just can't load in this view.</p></div>`; return render(true); }
  db = d; gate = "";
  const need2 = COLS.length + CONFIG_DOCS.length;
  const done = (name) => { S.loaded.add(name); sync.textContent = S.loaded.size >= need2 ? "Saved ✓" : "Loading…"; render(); };
  const fail = (e) => { sync.textContent = "Connection lost - reload"; console.warn(e && e.code); };
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => { S[c] = new Map(snap.docs.map((x) => [x.id, Object.assign({ id: x.id }, x.data())])); done(c); }, fail));
  db.collection("backups").onSnapshot((snap) => { S.backups = new Map(snap.docs.map((x) => [x.id, Object.assign({ id: x.id }, x.data())])); render(); }, fail);
  db.doc("config/activejob").onSnapshot((snap) => { S.active = snap.exists ? Object.assign({}, snap.data()) : null; render(); }, fail);
  db.doc("config/settings").onSnapshot((snap) => { S.settings = snap.exists ? Object.assign({}, snap.data()) : {}; rebuildBiz(); done("settings"); }, fail);
  db.doc("config/business").onSnapshot((snap) => { S.biz = snap.exists ? Object.assign({}, snap.data()) : {}; rebuildBiz(); done("business"); }, fail);
  db.doc("config/meta").onSnapshot((snap) => { S.meta = snap.exists ? Object.assign({}, snap.data()) : {}; done("meta"); }, fail);
})();
if (window.__CF_TEST__) window.__cf = { jobEcon, quoteFor, channelStats, growthPlan, attentionQueue, validateBackup, moneySummary, B, S };
})();
