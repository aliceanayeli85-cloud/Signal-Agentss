// ---------------------------------------------------------------- work mode: one step at a time, timed
// Goal minutes are starting targets for a medium-dirty car; your own averages replace them as you log jobs.
const STEPS = {
  exterior: [
    ["x-setup", "Set up + before photos", 5, "Buckets, wash mitt, wheel brushes, towels and wax all within reach BEFORE water touches the car. Before photos: same 3 spots every time."],
    ["x-wheels", "Wheels + tires", 20, "Wheels first, always - they're the dirtiest. All 4 wheels, then all 4 tires. Don't wash paint yet."],
    ["x-prerinse", "Pre-rinse + bugs", 10, "Rinse top to bottom. Hit bugs on the bumper and mirrors now while you're at the front."],
    ["x-wash", "Hand wash, top down", 25, "Roof, glass, hood, upper sides, then lower sides and bumpers last. One direction around the car - don't bounce side to side."],
    ["x-dry", "Rinse + dry", 15, "Rinse top down, dry top down. Big drying towel first, small towel for mirrors and handles."],
    ["x-jambs", "Door jambs", 10, "Open each door once and do the jamb while it's open. Go around the car one time."],
    ["x-glass", "Outside glass", 5, "All glass in one pass, same towel type every time."],
    ["x-finish", "Tire shine + spray wax", 10, "Spray wax panel by panel in the same order you washed. Tire shine last so it doesn't sling onto clean paint."],
    ["x-photos", "After photos", 5, "Same 3 spots as the before photos, same angle."],
  ],
  interior: [
    ["i-setup", "Set up + before photos", 10, "Vacuum, brushes, cleaner, towels and a bin for their stuff - all in your caddy next to the car. Before photos of the worst spots."],
    ["i-empty", "Empty the car", 10, "Trash bag in one hand. Everything personal goes in the bin, floor mats come out. Check door pockets and under seats now, not later."],
    ["i-mats", "Floor mats", 15, "Clean all mats now and leave them to dry while you work inside. They dry while you do the rest."],
    ["i-brush", "Brush out vents + seams", 15, "Top down: vents, dash seams, console gaps, seat seams. Knock the dust down so the vacuum gets it once."],
    ["i-vac", "Vacuum, one lap", 40, "Driver side front to back, then passenger, then trunk. Seats all the way forward, vacuum behind; all the way back, vacuum in front. Don't switch tools mid-lap."],
    ["i-wipe", "Wipe down, top down", 40, "Dash, console, door panels, cup holders. One cleaner, one brush, one towel. Do every door panel in a row instead of jumping around."],
    ["i-spots", "Stains + headliner spots", 20, "Only the spots you noted in your before photos. Set a limit - if a stain isn't moving after a few minutes, tell the customer instead of fighting it."],
    ["i-glass", "Inside glass", 10, "All windows and mirrors in one pass."],
    ["i-final", "Mats in + final check + after photos", 10, "Mats back, quick touch-up vacuum, check cup holders, after photos at the same spots."],
  ],
};
STEPS.full = STEPS.exterior.slice(0, -1).concat(STEPS.interior.slice(1));
const CONDITION = { light: ["Light (pretty clean)", 0.8], medium: ["Medium (normal)", 1], heavy: ["Heavy (pet hair, stains, trash)", 1.4] };
const KIT = ["Vacuum + crevice tool + brush tool, charged or plugged in", "Detail brushes (vents, seams, cup holders)", "Interior cleaner in a spray bottle, filled", "Stack of clean towels, sorted: interior / glass / drying", "2 buckets, wash mitt, wheel brushes, wheel cleaner", "Spray wax + tire shine", "Trash bags + a bin for the customer's things", "Phone stand for before/after photos", "Water + snack ready, so you don't stop mid-job"];
const SPEED_RULES = [
  "Same order on every car. Never decide what to do next - the Work tab tells you.",
  "Top to bottom, front to back, one lap. Dirt falls down, so the floor is last.",
  "Batch tools: finish everything that needs the vacuum before you pick up a towel.",
  "Mats come out first and dry while you work.",
  "Kit packed and staged the night before (the checklist below).",
  "Judge the condition from photos BEFORE they drop off. Heavy cars get a higher quote, not free extra hours.",
  "Stains get a time limit. If it isn't coming out, tell the customer instead of fighting it.",
  "Phone face down except for the timer. Each step is a short sprint.",
];
const fmt = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const fmtMin = (sec) => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
function stepStats() { // average seconds per step key, from finished jobs (skipped steps excluded)
  const st = {};
  for (const t of all("timings")) for (const d of t.steps || []) { if (d.skipped) continue; const r = st[d.k] || (st[d.k] = { n: 0, sum: 0 }); r.n++; r.sum += d.sec; }
  return st;
}
function goalFor(key, minutes, cond) { return Math.round(minutes * 60 * (CONDITION[cond] || CONDITION.medium)[1]); }
async function saveActive(a) { if (!db) throw new VErr("Storage isn't connected."); await db.doc("config/activejob").set(a); S.active = a; }
async function clearActive() { await db.doc("config/activejob").delete(); S.active = null; }
function stepElapsed(a, now) { return ((a.pausedAt || now) - a.stepStart) / 1000; }

function vWork() {
  const a = S.active;
  if (a && a.service) {
    const steps = STEPS[a.service], cur = steps[a.i];
    const goal = goalFor(cur[0], cur[2], a.condition);
    const now = Date.now(), el = stepElapsed(a, now);
    const total = ((a.pausedAt || now) - a.jobStart) / 1000;
    return `<h1>${esc(SERVICES[a.service].label)}${a.who ? " · " + esc(a.who) : ""}</h1>
<div class="card ok"><p class="muted">Step ${a.i + 1} of ${steps.length} · ${esc(CONDITION[a.condition][0])}</p><div class="bar"><i style="width:${Math.round(100 * a.i / steps.length)}%"></i></div>
<p class="stepname" style="margin-top:14px">${esc(cur[1])}</p>
<div class="timer${el > goal ? " over" : ""}" id="worktimer" data-goal="${goal}">${fmt(el)}</div>
<p class="muted">Goal ${fmtMin(goal)} · whole job so far <span id="worktotal">${fmt(total)}</span>${a.pausedAt ? " · <b>PAUSED</b>" : ""}</p>
<p>${esc(cur[3])}</p>
${a.pausedAt ? `<button class="huge" data-act="workresume">Resume</button>` : `<button class="huge" data-act="worknext">${a.i + 1 < steps.length ? "Done - next step" : "Done - finish job"}</button>`}
<div class="btns" style="margin-top:10px">${a.pausedAt ? "" : `<button class="ghost small" data-act="workpause">Pause (break)</button>`}<button class="ghost small" data-act="workskip">Skip step</button><button class="danger small" data-ask="workcancel">Cancel job</button></div>
<div class="confirm" data-confirm="workcancel" hidden><p>Throw away this job's timing?</p><div class="btns"><button class="small danger" data-act="workcancel">Yes, cancel</button><button class="small ghost" data-ask="">Keep going</button></div></div></div>
<div class="card"><h2>Coming up</h2>${list(steps.slice(a.i + 1).map((s) => `<li><div class="main">${esc(s[1])}</div><span class="muted">${fmtMin(goalFor(s[0], s[2], a.condition))}</span></li>`), "This is the last step.")}</div>`;
  }
  const t = today();
  const todays = all("appts").filter((x) => x.status === "confirmed" && (S.slots.get(x.slot) || {}).date <= t);
  const st = stepStats();
  const jobs = all("timings").sort((x, y) => (y.date || "").localeCompare(x.date || ""));
  const bySvc = Object.keys(SERVICES).map((k) => { const js = jobs.filter((j) => j.service === k); if (!js.length) return null; const avg = js.reduce((s, j) => s + j.total, 0) / js.length; const best = Math.min.apply(null, js.map((j) => j.total)); return `<li><div class="main">${esc(SERVICES[k].label)}<span class="hint">${js.length} job(s) · best ${fmtMin(best)} · ${money(SERVICES[k].price / (avg / 3600))}/hr average</span></div><b>${fmtMin(avg)}</b></li>`; }).filter(Boolean);
  const keys = {}; Object.values(STEPS).forEach((arr) => arr.forEach((s) => { keys[s[0]] = s; }));
  const over = Object.keys(st).map((k) => ({ k, avg: st[k].sum / st[k].n, goal: keys[k][2] * 60, name: keys[k][1] })).sort((x, y) => (y.avg - y.goal) - (x.avg - x.goal));
  return `<h1>Work</h1>
<div class="card"><h2>Start a job</h2><form class="f" data-form="workstart">
${todays.length ? sel("Which appointment?", "appt", [""].concat(todays.map((x) => x.id)), todays[0].id, (id) => { if (!id) return "Practice / not in the app"; const x = S.appts.get(id); return `${(S.leads.get(x.lead) || {}).name} - ${SERVICES[x.service].label}`; }) : `<input type="hidden" name="appt" value="">`}
${sel("Service", "service", Object.keys(SERVICES), todays.length ? todays[0].service : "full", (k) => SERVICES[k].label)}
${sel("How dirty is it?", "condition", Object.keys(CONDITION), "medium", (k) => CONDITION[k][0])}
<button type="submit" class="huge">Start timer</button></form>
<p class="hint">The timer keeps running if your phone locks. Just open this tab again.</p></div>
<div class="card"><h2>Your times</h2>${bySvc.length ? list(bySvc, "") : empty("No timed jobs yet. Time your next car, even a practice one on your own car.")}
${over.length ? `<h3>Where the time goes (vs goal)</h3>${list(over.slice(0, 5).map((o) => `<li><div class="main">${esc(o.name)}<span class="hint">goal ${fmtMin(o.goal)}</span></div><b class="${o.avg > o.goal ? "p-warn" : "p-ok"}">${fmtMin(o.avg)}</b></li>`), "")}<p class="hint">The top line is your biggest time sink. Work on that one step next job.</p>` : ""}</div>
<div class="card"><h2>8 rules for speed</h2><ol class="todo">${SPEED_RULES.map((r) => `<li>${esc(r)}</li>`).join("")}</ol></div>
<div class="card"><details data-key="kit"><summary>Night-before kit checklist</summary><ul class="list">${KIT.map((k, i) => `<li><label style="font-weight:400"><input type="checkbox" id="kit-${i}">${esc(k)}</label></li>`).join("")}</ul></details></div>
${jobs.length ? `<div class="card"><h2>Recent timed jobs</h2>${list(jobs.slice(0, 8).map((j) => `<li><div class="main">${esc(fdate(j.date))} · ${esc(SERVICES[j.service].label)}<span class="hint">${esc((CONDITION[j.condition] || CONDITION.medium)[0])}${j.who ? " · " + esc(j.who) : ""}</span></div><b>${fmtMin(j.total)}</b></li>`), "")}</div>` : ""}`;
}
async function workStart(f) {
  need(SERVICES[f.service], "Pick a service.");
  need(!S.active || !S.active.service, "A job is already running.");
  const appt = f.appt ? S.appts.get(f.appt) : null;
  const now = Date.now();
  await saveActive({ service: f.service, condition: CONDITION[f.condition] ? f.condition : "medium", appt: appt ? appt.id : "", who: appt ? (S.leads.get(appt.lead) || {}).name || "" : "", i: 0, jobStart: now, stepStart: now, pausedAt: null, done: [] });
}
async function workNext(skip) {
  const a = JSON.parse(JSON.stringify(S.active)); need(a && a.service, "No job running.");
  const steps = STEPS[a.service], now = Date.now();
  if (a.pausedAt) { a.stepStart += now - a.pausedAt; a.jobStart += now - a.pausedAt; a.pausedAt = null; }
  a.done.push({ k: steps[a.i][0], sec: Math.round((now - a.stepStart) / 1000), skipped: !!skip });
  if (a.i + 1 < steps.length) { a.i++; a.stepStart = now; await saveActive(a); return null; }
  const total = Math.round(a.done.filter((d) => !d.skipped).reduce((s, d) => s + d.sec, 0));
  await put("timings", newId("timings"), { date: today(), service: a.service, condition: a.condition, appt: a.appt, who: a.who, steps: a.done, total });
  await clearActive();
  return { total, appt: a.appt, service: a.service };
}
async function workPause(on) {
  const a = JSON.parse(JSON.stringify(S.active)); need(a && a.service, "No job running.");
  const now = Date.now();
  if (on && !a.pausedAt) a.pausedAt = now;
  if (!on && a.pausedAt) { a.stepStart += now - a.pausedAt; a.jobStart += now - a.pausedAt; a.pausedAt = null; }
  await saveActive(a);
}
setInterval(() => { // refresh only the clock, so nothing you're doing gets redrawn
  const el = document.getElementById("worktimer"), a = S.active;
  if (!el || !a || !a.service) return;
  const now = Date.now(), sec = stepElapsed(a, now);
  el.textContent = fmt(sec); el.classList.toggle("over", sec > Number(el.dataset.goal));
  const tot = document.getElementById("worktotal"); if (tot) tot.textContent = fmt(((a.pausedAt || now) - a.jobStart) / 1000);
}, 1000);

// ---------------------------------------------------------------- render loop
let pendingRender = false;
function render(force) {
  const root = document.getElementById("view");
  const a = document.activeElement;
  if (!force && a && root.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendingRender = true; return; } // don't wipe what you're typing
  pendingRender = false;
  const open = new Set(Array.from(root.querySelectorAll("details[open]")).map((d) => d.dataset.key));
  const fn = { today: vToday, leads: vLeads, newlead: vNewLead, lead: () => vLead(sub), book: vBook, posts: vPosts, post: () => vPost(sub), replies: vReplies, prospects: vProspects, plan: vPlan, weekly: vWeekly, setup: vSetup, more: vMore, work: vWork }[view] || vToday;
  root.innerHTML = gate || fn();
  root.querySelectorAll("details[data-key]").forEach((d) => { if (open.has(d.dataset.key)) d.open = true; });
  document.getElementById("tabs").innerHTML = TABS.map(([v, l]) => `<button ${go(v)} class="${tabOf(view) === v || (view === "newlead" && v === "leads") || (view === "lead" && v === "leads") || (view === "post" && v === "posts") ? "on" : ""}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[v]}</svg>${l}</button>`).join("");
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 150));

function navigate(v, s) { view = v; sub = s == null ? null : s; filter = ""; render(true); window.scrollTo(0, 0); }

async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); render(true); }
  catch (e) { toast(e instanceof VErr ? e.message : "Couldn't save that. Check your connection and try again.", true); if (!(e instanceof VErr)) console.error(e); }
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-copy],[data-filter],[data-ask]");
  if (!t) return;
  if (t.hasAttribute("data-go")) { e.preventDefault(); return navigate(t.dataset.go, t.dataset.sub); }
  if (t.hasAttribute("data-filter")) { filter = t.dataset.filter; return render(true); }
  if (t.hasAttribute("data-ask")) { document.querySelectorAll("[data-confirm]").forEach((c) => { c.hidden = c.dataset.confirm !== t.dataset.ask; }); return; }
  if (t.hasAttribute("data-copy")) {
    const pre = t.parentNode.querySelector("pre"), text = pre.innerText;
    const done = () => { t.textContent = "Copied"; setTimeout(() => { t.textContent = "Copy"; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected - tap Copy in the menu"); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
    return;
  }
  const id = t.dataset.id, v = t.dataset.v;
  const acts = {
    replied: () => run(() => leadAct(id, (l) => { if (l.status === "New Lead" || l.status === "Follow-Up Due") l.status = "Replied"; l.lastContact = today(); l.next = plusDays(2); ev(l, "reply_sent"); }), "Reply logged. Follow-up set for 2 days from now."),
    followup: () => run(() => leadAct(id, (l) => { l.lastContact = today(); l.next = Number(v) ? plusDays(Number(v)) : null; if (l.status === "Follow-Up Due") l.status = "Replied"; ev(l, "followup_sent"); }), Number(v) ? "Follow-up logged." : "Final follow-up logged. If they don't answer, mark them Lost."),
    confirm: () => run(() => confirmAppt(id), "Confirmed. Send the booking confirmation message."),
    release: () => run(() => cancelAppt(id, false, "slot released"), "Slot released."),
    noshow: () => run(() => cancelAppt(id, true, ""), "No-show logged."),
    reminder: () => run(async () => { const a = S.appts.get(id); await put("appts", id, Object.assign({}, a, { reminder: today() })); await leadAct(a.lead, (l) => ev(l, "reminder_sent")); }, "Reminder logged."),
    closeslot: () => run(async () => { const s = S.slots.get(id); need(s && s.status === "open", "Only open slots can be closed."); await put("slots", id, Object.assign({}, s, { status: "closed" })); }, "Slot closed."),
    reviewreq: () => run(() => leadAct(id, (l) => { l.reviewReq = today(); l.next = null; ev(l, "review_requested"); }), "Review request logged."),
    reviewgot: () => run(() => leadAct(id, (l) => { l.reviewGot = true; ev(l, "review_received"); }), "Review logged."),
    repeat: () => run(() => leadAct(id, (l) => { l.repeat = plusDays(60); ev(l, "repeat_offer_sent"); }), "Repeat offer logged. Next reminder in 60 days."),
    todraft: () => run(() => putPost(id, { status: "draft", approved: null, scheduled: null }), "Back to draft."),
    cash: () => run(() => saveSettings({ cash_mode: v }), v === "yes" ? "Cash mode on." : "Cash mode off."),
    week: () => { reportWeek = plusDays(Number(v), weekBounds(reportWeek)[0]); render(true); },
    backup: () => saveBackup(),
    worknext: () => run(async () => { const r = await workNext(false); if (r) toast(`Job done in ${fmtMin(r.total)}.${r.appt ? " Now record the payment on the lead." : ""}`); }),
    workskip: () => run(() => workNext(true)),
    workpause: () => run(() => workPause(true), "Paused. Tap Resume when you're back."),
    workresume: () => run(() => workPause(false)),
    workcancel: () => run(clearActive, "Job timer cancelled."),
  };
  if (acts[t.dataset.act]) acts[t.dataset.act]();
});

async function putPost(id, patch) { const o = Object.assign({ status: "draft" }, S.posts.get(id) || {}, patch); await put("posts", id, o); }
async function saveSettings(patch) { if (!db) throw new VErr("Storage isn't connected."); const next = Object.assign({}, S.settings, patch); await db.doc("config/settings").set(next); S.settings = next; }

document.addEventListener("submit", (e) => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const f = {}; new FormData(form).forEach((val, k) => { f[k] = typeof val === "string" ? val : ""; });
  const id = form.dataset.id;
  const handlers = {
    workstart: () => run(() => workStart(f), "Timer started. One step at a time."),
    newlead: () => run(async () => { const nid = await createLead(f); view = "lead"; sub = nid; }, "Lead added. Reply now - fast replies win jobs."),
    editlead: () => run(() => leadAct(id, (l) => { const n = leadFromForm(f, l); need(STATUSES.includes(f.status), "Pick a status."); if (f.status === "Lost" && l.status !== "Lost") ev(n, "lost", f.lostReason); n.status = f.status; n.next = isDate(f.next) ? f.next : null; n.repeat = isDate(f.repeat) ? f.repeat : null; n.lostReason = clean(f.lostReason, 200); Object.assign(l, n); }), "Saved."),
    quote: () => run(() => leadAct(id, (l) => { need(SERVICES[f.service], "Pick a service."); let p = num(f.price, "Price"); if (p == null) p = SERVICES[f.service].price; l.status = "Quote Sent"; l.service = f.service; l.quote = p; l.lastContact = today(); l.next = plusDays(2); ev(l, "quote_sent", `${SERVICES[f.service].label} $${p}`); }), "Quote logged. Follow-up in 2 days."),
    offer: () => run(() => propose(id, f.slot, f.service, f.price), "Slot held. Send them the time, then confirm when they say yes."),
    cancel: () => run(() => cancelAppt(id, false, f.reason), "Cancelled. The slot is open again if it's in the future."),
    complete: () => run(() => completeJob(id, f), "Job recorded. Ask for a review tomorrow."),
    pay: () => run(() => recordPayment(id, f.amount, f.method), "Payment recorded."),
    slot: () => run(() => addSlot(f), "Slot added."),
    approve: () => run(async () => { const p = postView(POSTS.find((x) => x.id === id)); if (p.needs_real_photos) need(f.photos === "on", "This post needs your real photos or video. Tick the box once you have them."); const probs = postProblems(p); need(!probs.length, "Can't approve yet: " + probs.join("; ")); await putPost(id, { status: "approved", approved: today() }); }, "Approved. Post it yourself, then mark it published."),
    publish: () => run(async () => { const where = clean(f.where, 200); need(where, "Say where you posted it."); const d = isDate(f.date) ? f.date : today(); need(d <= today(), "Use Schedule for a future date."); await putPost(id, { status: "published", published: d, where }); }, "Marked published."),
    schedule: () => run(async () => { need(isDate(f.date), "Pick a date."); await putPost(id, { status: "scheduled", scheduled: f.date }); }, "Scheduled (reminder only - post it yourself on the day)."),
    postedit: () => run(async () => { const base = POSTS.find((x) => x.id === id), cur = postView(base); need(cur.status !== "published", "Already published - edit it on the platform."); const edits = {}; let changed = false; for (const k in POST_FIELDS) { edits[k] = clean(f[k], 4000); if (edits[k] !== cur[k]) changed = true; } await putPost(id, Object.assign({ edits }, changed && cur.status !== "draft" ? { status: "draft", approved: null } : {})); }, "Wording saved."),
    oppnew: () => run(() => put("opps", newId("opps"), oppFromForm(f, { found: today(), order: Date.now() })), "Added."),
    opp: () => run(() => put("opps", id, oppFromForm(f, S.opps.get(id))), "Updated."),
    effort: () => run(async () => { const m = parseInt(f.minutes, 10); need(m >= 0 && m <= 600, "Minutes must be 0-600."); need(clean(f.activity), "Say what you did."); need(SOURCES.includes(f.channel), "Pick a channel."); await put("effort", newId("effort"), { date: isDate(f.date) ? f.date : today(), channel: f.channel, activity: clean(f.activity, 200), minutes: m }); }, "Logged."),
    settings: () => run(async () => { const patch = {}; for (const [k] of SETTINGS) patch[k] = clean(f[k], 200); if (patch.max_jobs_per_day) { const n = parseInt(patch.max_jobs_per_day, 10); need(n >= 1 && n <= 10, "Max cars per day must be 1-10."); patch.max_jobs_per_day = String(n); } if (patch.launch_date) need(isDate(patch.launch_date), "Launch date must be a date."); await saveSettings(patch); }, "Setup saved."),
  };
  if (handlers[form.dataset.form]) handlers[form.dataset.form]();
});
function oppFromForm(f, base) {
  const o = Object.assign({}, base || {}); o.name = clean(f.name, 200); need(o.name, "Name is required.");
  o.type = OPP_TYPES.includes(f.type) ? f.type : "other"; o.status = OPP_STATUS.includes(f.status) ? f.status : "to_research"; o.rule = RULES[f.rule] ? f.rule : "unknown";
  o.contact = clean(f.contact, 300); o.rulesNotes = clean(f.rulesNotes, 1000); o.next = clean(f.next, 300); o.nextDate = isDate(f.nextDate) ? f.nextDate : null; o.outcome = clean(f.outcome, 500); o.info = clean(f.info, 300);
  return o;
}

let downloads = null;
async function saveBackup() {
  const data = { saved: new Date().toISOString(), settings: S.settings };
  COLS.forEach((c) => { data[c] = all(c); });
  if (!downloads) return toast("Saving files isn't available in this view. Your data is still stored safely.", true);
  try { await downloads.save({ filename: `carbon-force-backup-${today()}.json`, data: JSON.stringify(data, null, 1) }); }
  catch (e) { toast("Backup wasn't saved.", true); }
}

// ---------------------------------------------------------------- boot
let gate = "";
(function boot() {
  const h = (location.hash || "").slice(1);
  if (["today", "leads", "book", "work", "posts", "replies", "prospects", "plan", "weekly", "setup", "more"].includes(h)) view = h;
  render(true);
})();
(async function connect() {
  const sync = document.getElementById("sync");
  if (!window.claude || !window.claude.use) { sync.textContent = "Offline copy"; gate = `<div class="card bad"><h2>Open this from Claude</h2><p>This page saves your data in your Claude account, so it only works when opened from its claude.ai link while you're signed in.</p></div>`; return render(true); }
  const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl;
  if (u) { try { if (!(await u.isOwner())) { readOnly = true; gate = `<div class="card bad"><h2>Private business tool</h2><p>This page belongs to someone else, and its data is private.</p></div>`; sync.textContent = ""; return render(true); } } catch (_) {} }
  if (!d) { sync.textContent = "Not connected"; gate = `<div class="card bad"><h2>Storage isn't connected</h2><p>Reopen this page from its claude.ai link while signed in. Your data is safe - it just can't load in this view.</p></div>`; return render(true); }
  db = d; gate = "";
  const done = (name) => { S.loaded.add(name); sync.textContent = S.loaded.size >= COLS.length + 1 ? "Saved in your Claude account" : "Loading…"; render(); };
  const fail = (e) => { sync.textContent = "Connection lost - reload"; console.warn(e && e.code); };
  COLS.forEach((c) => db.collection(c).onSnapshot((snap) => { S[c] = new Map(snap.docs.map((x) => [x.id, Object.assign({ id: x.id }, x.data())])); done(c); }, fail));
  db.doc("config/activejob").onSnapshot((snap) => { S.active = snap.exists ? Object.assign({}, snap.data()) : null; render(); }, fail);
  db.doc("config/settings").onSnapshot((snap) => { S.settings = snap.exists ? Object.assign({}, snap.data()) : {}; done("settings"); }, fail);
})();
})();
</script>
